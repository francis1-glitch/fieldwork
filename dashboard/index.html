<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#edecea">
<meta http-equiv="refresh" content="0; url=../cockpit/">
<title>Command Center → Cockpit</title>
<link rel="canonical" href="../cockpit/">
<style>
  :root{--bg:#edecea;--ink:#19191b;--muted:#84847e;color-scheme:light}
  @media (prefers-color-scheme:dark){:root{--bg:#161618;--ink:#efefe9;--muted:#9a9a92;color-scheme:dark}}
  body{margin:0;min-height:100vh;display:grid;place-items:center;background:var(--bg);color:var(--ink);
    font:15px/1.5 "Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;text-align:center;padding:24px}
  p{margin:0 0 10px;color:var(--muted)} a{color:var(--ink);font-weight:600}
</style>
</head>
<body>
<main>
  <p>Command Center was folded into Morning Cockpit.</p>
  <a href="../cockpit/">Open Cockpit →</a>
  <p style="margin-top:18px;font-size:12px">You can remove the Command Center icon from your home screen.</p>
</main>
<script>
  // Retired Nov 15, 2026. Unregister this app's old service worker so it stops serving the cached dashboard.
  try{ navigator.serviceWorker && navigator.serviceWorker.getRegistrations().then(rs => rs.forEach(r => { if(/\/dashboard\/$/.test(new URL(r.scope).pathname)) r.unregister(); })); }catch(e){}
  try{ caches.keys().then(ks => ks.filter(k => k.startsWith("center-") || k.startsWith("dashboard-")).forEach(k => caches.delete(k))); }catch(e){}
  location.replace("../cockpit/");
</script>
</body>
</html>
