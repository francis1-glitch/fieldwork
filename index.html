<!doctype html><html lang="en" data-pwa="1"><head><meta charset="utf-8">

</head><body>
<title>Fieldwork</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Unbounded:wght@500;700&family=Atkinson+Hyperlegible:wght@400;700&family=IBM+Plex+Mono:wght@400;500&display=swap">
<style>
/* Layout: one-column phone app on graph paper; blue = Lab (experiments), ochre = Quests; bottom tab bar. */
:root{
  --paper:#EDF0EA; --sheet:#F9FBF7; --ink:#16202A; --ink-2:#4B5661; --ink-3:#7A858E;
  --rule:#D2D9CF; --grid:rgba(22,32,42,.055);
  --lab:#2A52C4; --lab-soft:#DDE5F8; --quest:#A86A12; --quest-soft:#F4E5CC;
  --good:#23824F; --bad:#BC3A2C; --warn:#9A7208; --on-accent:#FFFFFF;
  --f-display:"Unbounded","Arial Black",system-ui,sans-serif;
  --f-body:"Atkinson Hyperlegible",system-ui,-apple-system,"Segoe UI",sans-serif;
  --f-data:"IBM Plex Mono",ui-monospace,"SFMono-Regular",Menlo,monospace;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#10151B; --sheet:#19212A; --ink:#E5EAE3; --ink-2:#A3AEB6; --ink-3:#727E88;
  --rule:#2B3540; --grid:rgba(229,234,227,.045);
  --lab:#86A3F2; --lab-soft:#1E2B4C; --quest:#E3A951; --quest-soft:#3A2B15;
  --good:#5FC78D; --bad:#F07D6E; --warn:#E2B64E; --on-accent:#0F141A; color-scheme:dark}}
:root[data-theme="dark"]{
  --paper:#10151B; --sheet:#19212A; --ink:#E5EAE3; --ink-2:#A3AEB6; --ink-3:#727E88;
  --rule:#2B3540; --grid:rgba(229,234,227,.045);
  --lab:#86A3F2; --lab-soft:#1E2B4C; --quest:#E3A951; --quest-soft:#3A2B15;
  --good:#5FC78D; --bad:#F07D6E; --warn:#E2B64E; --on-accent:#0F141A; color-scheme:dark}

*{box-sizing:border-box}
html,body{height:100%}
body{
  background-color:var(--paper);
  background-image:linear-gradient(var(--grid) 1px,transparent 1px),linear-gradient(90deg,var(--grid) 1px,transparent 1px);
  background-size:22px 22px;
  color:var(--ink); font-family:var(--f-body); font-size:16px; line-height:1.45;
  -webkit-tap-highlight-color:transparent;
}
.wrap{max-width:560px;margin:0 auto;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:0 calc(96px + env(safe-area-inset-bottom,0px));}
header.top{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;background:var(--paper);
  display:flex;align-items:center;justify-content:space-between;gap:12px;padding-block:14px 10px;border-bottom:1px solid var(--rule);margin-bottom:16px}
.brand{font-family:var(--f-display);font-weight:700;font-size:18px;letter-spacing:.02em}
.brand small{display:block;font-family:var(--f-data);font-weight:400;font-size:11px;color:var(--ink-3);letter-spacing:.06em;text-transform:uppercase}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--lab);outline-offset:2px}
.iconbtn{background:none;border:1px solid var(--rule);border-radius:10px;width:40px;height:40px;display:grid;place-items:center;color:var(--ink-2)}
main{display:flex;flex-direction:column;gap:18px}
h1,h2,h3{margin:0;text-wrap:balance}
h1{font-family:var(--f-display);font-weight:700;font-size:24px;line-height:1.15}
h2{font-family:var(--f-display);font-weight:500;font-size:15px;letter-spacing:.01em}
.eyebrow{font-family:var(--f-data);font-size:11px;letter-spacing:.09em;text-transform:uppercase;color:var(--ink-3)}
.muted{color:var(--ink-2)}
.small{font-size:14px}
.mono{font-family:var(--f-data);font-variant-numeric:tabular-nums}

.card{background:var(--sheet);border:1px solid var(--rule);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:12px;min-width:0}
.card.lab{border-top:3px solid var(--lab)}
.card.quest{border-top:3px solid var(--quest)}
.row{display:flex;align-items:center;gap:10px;flex-wrap:wrap}
.between{justify-content:space-between}
.stack{display:flex;flex-direction:column;gap:10px}

.btn{border:none;border-radius:10px;padding:12px 16px;font-weight:700;font-size:15px;min-height:44px}
.btn.lab{background:var(--lab);color:var(--on-accent)}
.btn.quest{background:var(--quest);color:var(--on-accent)}
.btn.ghost{background:transparent;border:1px solid var(--rule);color:var(--ink)}
.btn.danger{background:transparent;border:1px solid var(--bad);color:var(--bad)}
.btn.wide{width:100%}
.btn:disabled{opacity:.45;cursor:default}
.link{background:none;border:none;padding:0;color:var(--lab);font-weight:700;text-decoration:underline;text-underline-offset:3px}

.pill{display:inline-flex;align-items:center;gap:6px;font-family:var(--f-data);font-size:11px;letter-spacing:.06em;text-transform:uppercase;padding:4px 8px;border-radius:999px;border:1px solid var(--rule);color:var(--ink-2);white-space:nowrap}
.pill.lab{background:var(--lab-soft);border-color:transparent;color:var(--lab)}
.pill.quest{background:var(--quest-soft);border-color:transparent;color:var(--quest)}
.pill.good{color:var(--good);border-color:var(--good)}
.pill.bad{color:var(--bad);border-color:var(--bad)}
.pill.warn{color:var(--warn);border-color:var(--warn)}

.banner{display:flex;gap:10px;align-items:center;justify-content:space-between;flex-wrap:wrap;border:1px dashed var(--ink-3);border-radius:12px;padding:10px 12px;font-size:14px;color:var(--ink-2)}

/* check-in scale */
.metric{display:flex;flex-direction:column;gap:6px}
.metric .lbl{display:flex;justify-content:space-between;font-size:14px}
.scale{display:grid;grid-template-columns:repeat(5,1fr);gap:6px}
.scale button{border:1px solid var(--rule);background:var(--paper);border-radius:9px;min-height:44px;font-family:var(--f-data);font-size:16px}
.scale button[aria-pressed="true"]{background:var(--lab);border-color:var(--lab);color:var(--on-accent)}
.ends{display:flex;justify-content:space-between;font-size:12px;color:var(--ink-3)}
.yn{display:grid;grid-template-columns:1fr 1fr;gap:6px}
.yn button{border:1px solid var(--rule);background:var(--paper);border-radius:9px;min-height:40px}
.yn button[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}

input[type=text],input[type=number],input[type=date],textarea,select{width:100%;font:inherit;font-size:16px;color:var(--ink);background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:10px 12px}
textarea{min-height:70px;resize:vertical}
label.f{display:flex;flex-direction:column;gap:6px;font-size:14px;color:var(--ink-2)}
.grid2{display:grid;grid-template-columns:1fr 1fr;gap:10px}

/* progress */
.prog{display:flex;height:8px;border-radius:999px;overflow:hidden;background:var(--paper);border:1px solid var(--rule)}
.prog i{display:block;height:100%}
.prog .b{background:var(--ink-3)} .prog .t{background:var(--lab)}
.prog-legend{display:flex;justify-content:space-between;font-family:var(--f-data);font-size:11px;color:var(--ink-3)}

.list{display:flex;flex-direction:column}
.item{display:flex;gap:12px;align-items:flex-start;justify-content:space-between;padding-block:12px;border-top:1px solid var(--rule);text-align:left;background:none;border-left:none;border-right:none;border-bottom:none;width:100%}
.item:first-child{border-top:none}
.item .t{font-weight:700}
.item > div{min-width:0}

/* chips */
.chips{display:flex;gap:6px;flex-wrap:wrap}
.chip{border:1px solid var(--rule);background:var(--paper);border-radius:999px;padding:7px 12px;font-size:14px;min-height:36px}
.chip[aria-pressed="true"]{background:var(--quest);border-color:var(--quest);color:var(--on-accent)}
.chips.labc .chip[aria-pressed="true"]{background:var(--lab);border-color:var(--lab)}
.fgroup{display:flex;flex-direction:column;gap:6px}

/* quest card */
.qcard{position:relative;border:1px solid var(--quest);background:var(--quest-soft);border-radius:14px;padding:16px;display:flex;flex-direction:column;gap:10px}
.qcard h3{font-family:var(--f-display);font-weight:500;font-size:19px;line-height:1.2}
.qcard.roll{animation:deal .35s ease-out}
@keyframes deal{from{transform:translateY(8px) rotate(-1.2deg);opacity:.4}to{transform:none;opacity:1}}
.dice{font-family:var(--f-data);font-size:22px;line-height:1}

/* stats */
.stats{display:grid;grid-template-columns:repeat(3,1fr);gap:8px}
.stat{background:var(--paper);border:1px solid var(--rule);border-radius:10px;padding:10px;display:flex;flex-direction:column;gap:2px;min-width:0}
.stat b{font-family:var(--f-data);font-size:20px;font-variant-numeric:tabular-nums}
.stat span{font-size:12px;color:var(--ink-3)}

table.res{width:100%;border-collapse:collapse;font-size:14px}
table.res th{font-family:var(--f-data);font-weight:400;font-size:11px;letter-spacing:.06em;text-transform:uppercase;color:var(--ink-3);text-align:right;padding:6px 4px;border-bottom:1px solid var(--rule)}
table.res th:first-child,table.res td:first-child{text-align:left}
table.res td{padding:8px 4px;border-bottom:1px solid var(--rule);text-align:right;font-family:var(--f-data);font-variant-numeric:tabular-nums}
table.res td:first-child{font-family:var(--f-body);font-weight:700}
.tablewrap{overflow-x:auto}
.pos{color:var(--good)} .neg{color:var(--bad)}

.verdict{border-left:3px solid var(--ink-3);padding-left:10px;display:flex;flex-direction:column;gap:2px}
.verdict.good{border-color:var(--good)} .verdict.bad{border-color:var(--bad)} .verdict.warn{border-color:var(--warn)}
.verdict b{font-size:15px}

svg.chart{width:100%;height:auto;display:block}
.chart .band-b{fill:var(--grid)} .chart .band-t{fill:var(--lab-soft)}
.chart .axis{stroke:var(--rule);stroke-width:1}
.chart .line{fill:none;stroke:var(--lab);stroke-width:2}
.chart .dot{fill:var(--lab)} .chart .dot.b{fill:var(--ink-3)}
.chart text{fill:var(--ink-3);font-family:var(--f-data);font-size:9px}
.chart .mean{stroke-dasharray:4 3;stroke-width:1.5}
.chart .mean.b{stroke:var(--ink-3)} .chart .mean.t{stroke:var(--lab)}

/* bottom nav */
nav.tabs{position:fixed;left:0;right:0;bottom:0;z-index:10;background:var(--sheet);border-top:1px solid var(--rule);
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:6px calc(6px + env(safe-area-inset-bottom,0px))}
nav.tabs .in{max-width:560px;margin:0 auto;display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
nav.tabs button{background:none;border:none;border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:3px;font-size:12px;color:var(--ink-3);min-height:52px}
nav.tabs button svg{width:22px;height:22px}
nav.tabs button[aria-current="page"]{color:var(--ink);background:var(--paper)}
nav.tabs button[data-tab="lab"][aria-current="page"]{color:var(--lab)}
nav.tabs button[data-tab="quests"][aria-current="page"]{color:var(--quest)}

/* sheet */
.overlay{position:fixed;inset:0;z-index:20;background:rgba(10,14,18,.45);display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--sheet);width:100%;max-width:560px;max-height:88%;overflow-y:auto;border-radius:18px 18px 0 0;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:18px calc(22px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:14px;animation:up .22s ease-out}
@keyframes up{from{transform:translateY(30px);opacity:.6}to{transform:none;opacity:1}}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(86px + env(safe-area-inset-bottom,0px));z-index:30;background:var(--ink);color:var(--paper);padding:10px 16px;border-radius:999px;font-size:14px;font-weight:700;max-width:calc(100% - 32px)}
.empty{border:1px dashed var(--rule);border-radius:12px;padding:16px;color:var(--ink-2);font-size:14px;text-align:center}
/* history calendar */
.calhead{display:flex;align-items:center;justify-content:space-between;gap:8px}
.cal{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));gap:4px}
.cal .dow{font-family:var(--f-data);font-size:10px;letter-spacing:.06em;color:var(--ink-3);text-align:center;padding-block:2px}
.cal button{aspect-ratio:1/1;max-width:100%;min-width:0;border:1px solid var(--rule);background:var(--paper);border-radius:8px;font-family:var(--f-data);font-size:12px;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:0}
.cal button.has{background:var(--lab-soft);border-color:transparent;color:var(--lab);font-weight:500}
.cal button .qd{width:5px;height:5px;border-radius:50%;background:var(--quest)}
.cal button.today{box-shadow:inset 0 0 0 2px var(--ink)}
.cal button:disabled{opacity:.35;cursor:default}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12px;color:var(--ink-3)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:3px;margin-right:5px;vertical-align:-1px}
/* forecast day picker */
.fc{display:grid;grid-template-columns:repeat(4,minmax(0,1fr));gap:6px}
.fc button{border:1px solid var(--rule);background:var(--paper);border-radius:10px;padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:12px;min-height:76px;min-width:0}
.fc button[aria-pressed="true"]{background:var(--quest);color:var(--on-accent);border-color:var(--quest)}
.fc .wx{font-size:18px;line-height:1.2}
.fc b{font-family:var(--f-data);font-size:13px;font-variant-numeric:tabular-nums}
.fc .pp{font-family:var(--f-data);font-size:10px;opacity:.85}
.twist{border-top:1px dashed var(--quest);padding-top:8px;font-size:14px}
.wxnote{font-size:13px;color:var(--ink-2)}
.numin{max-width:160px}
.switchrow{display:flex;align-items:center;justify-content:space-between;gap:12px}
.switch{position:relative;width:50px;height:30px;border-radius:999px;border:1px solid var(--rule);background:var(--paper);padding:0;flex-shrink:0}
.switch::after{content:"";position:absolute;top:3px;left:3px;width:22px;height:22px;border-radius:50%;background:var(--ink-3);transition:transform .15s}
.switch[aria-checked="true"]{background:var(--quest);border-color:var(--quest)}
.switch[aria-checked="true"]::after{transform:translateX(20px);background:var(--on-accent)}
/* mission */
.mission{background:var(--lab);color:var(--on-accent);border-radius:16px;padding:18px;display:flex;flex-direction:column;gap:10px}
.mission .eyebrow{color:inherit;opacity:.85}
.mission h3{font-family:var(--f-display);font-weight:700;font-size:21px;line-height:1.2}
.mission .btn{background:var(--on-accent);color:var(--lab);align-self:flex-start}
.mission .btn.done{background:transparent;border:1px solid currentColor;color:inherit}
.mission .streak{font-family:var(--f-data);font-size:12px;letter-spacing:.04em;white-space:nowrap}
.mission.wait{background:var(--sheet);color:var(--ink);border:1px dashed var(--lab)}
.mission.wait .eyebrow{color:var(--lab)}
.pat{display:flex;flex-direction:column;gap:4px;padding-block:12px;border-top:1px solid var(--rule)}
.pat:first-child{border-top:none}
.pat .meta{font-family:var(--f-data);font-size:11px;color:var(--ink-3)}
.decide{display:grid;grid-template-columns:repeat(3,1fr);gap:6px}
.decide button{border:1px solid var(--rule);background:var(--paper);border-radius:10px;min-height:44px;font-weight:700}
.decide button[aria-pressed="true"][data-v="keep"]{background:var(--good);border-color:var(--good);color:var(--on-accent)}
.decide button[aria-pressed="true"][data-v="drop"]{background:var(--bad);border-color:var(--bad);color:var(--on-accent)}
.decide button[aria-pressed="true"][data-v="maybe"]{background:var(--ink);border-color:var(--ink);color:var(--paper)}
@media (prefers-reduced-motion: reduce){*{animation:none!important;transition:none!important}}
</style>

<div class="wrap">
  <header class="top">
    <div class="brand">Fieldwork<small id="hdrSub">Field notes on your own life</small></div>
    <button class="iconbtn" id="settingsBtn" aria-label="Settings">
      <svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M4.2 4.2l2.1 2.1M17.7 17.7l2.1 2.1M2 12h3M19 12h3M4.2 19.8l2.1-2.1M17.7 6.3l2.1-2.1"/></svg>
    </button>
  </header>
  <main id="main"></main>
</div>

<nav class="tabs" aria-label="Sections"><div class="in">
  <button data-tab="today" aria-current="page">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"><rect x="4" y="5" width="16" height="15" rx="2"/><path d="M4 10h16M9 3v4M15 3v4"/></svg>Today</button>
  <button data-tab="lab">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6l-5 9a2 2 0 0 0 1.8 3h10.4A2 2 0 0 0 19 18l-5-9V3"/><path d="M7.5 14h9"/></svg>Lab</button>
  <button data-tab="quests">
    <svg viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 21s-6-5.6-6-11a6 6 0 0 1 12 0c0 5.4-6 11-6 11z"/><circle cx="12" cy="10" r="2.2"/></svg>Quests</button>
</div></nav>

<div id="layer"></div>

<script>
(function(){
"use strict";
const VERSION="4.0";
/* ---------- dates ---------- */
const pad=n=>String(n).padStart(2,"0");
const ds=d=>`${d.getFullYear()}-${pad(d.getMonth()+1)}-${pad(d.getDate())}`;
const parse=s=>{const [y,m,d]=s.split("-").map(Number);return new Date(y,m-1,d)};
const today=()=>ds(new Date());
const addDays=(s,n)=>{const d=parse(s);d.setDate(d.getDate()+n);return ds(d)};
const diffDays=(a,b)=>{const u=s=>{const [y,m,d]=s.split("-").map(Number);return Date.UTC(y,m-1,d)};return Math.round((u(b)-u(a))/864e5)};
const fmt=(s,o)=>parse(s).toLocaleDateString(undefined,o||{month:"short",day:"numeric"});
const uid=()=>Math.random().toString(36).slice(2,10);
const esc=s=>String(s==null?"":s).replace(/[&<>"']/g,c=>({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;","'":"&#39;"}[c]));
const seasonOf=s=>{const m=parse(s).getMonth()+1;return m>=3&&m<=5?"spring":m>=6&&m<=8?"summer":m>=9&&m<=11?"fall":"winter"};

/* ---------- quest deck ---------- */
// cost 0 free / 1 cheap / 2 splurge; time 1 ≤2h / 2 half day / 3 full day; who solo|group|any; set in|out|any; season optional
const Q=(id,title,detail,cat,cost,time,who,set,season)=>({id,title,detail,cat,cost,time,who,set,season:season||null});
const DECK=[
 Q("sunrise","Sunrise at the ocean","Get to a South Shore beach before sunrise with a coffee. Stay until the sun clears the horizon.","Outdoors",0,1,"any","out"),
 Q("montauk","Ride out to the end of the Island","Drive to Montauk Point, walk the bluffs by the lighthouse, and stop somewhere new to eat on the way back.","Outdoors",2,3,"any","out"),
 Q("fireisland","Ferry to Fire Island","Take a ferry over and walk the beach an hour in one direction, then back.","Outdoors",1,3,"any","out"),
 Q("newtrail","A trail you've never walked","Pick a park or preserve on the Island you've never set foot in and walk its longest loop.","Outdoors",0,2,"any","out"),
 Q("bike","Bike a new route","Ride 10+ miles round trip on roads you've never biked.","Outdoors",0,2,"solo","out"),
 Q("stars","Find three constellations","Drive somewhere dark enough to see stars and identify three constellations.","Outdoors",0,1,"any","out"),
 Q("paddle","Get on the water","Rent a kayak or paddleboard for an hour on a bay or harbor.","Outdoors",1,2,"any","out"),
 Q("highpoint","Sunset from the highest point","Find the highest spot you can reach within 30 minutes and watch the sun go down.","Outdoors",0,1,"any","out"),
 Q("cuisine","A cuisine you've never had","Eat a full meal from a cuisine you've never tried. Order whatever the staff recommends.","Food",1,1,"any","any"),
 Q("crawl","Three-stop food crawl","Pick one Queens neighborhood and eat one thing at three different spots.","Food",1,2,"group","any"),

const metric=id=>S.metrics.find(m=>m.id===id)||S.archived.find(m=>m.id===id)||{id,name:id,type:"scale"};
const mt=m=>m.type||"scale";
function fmtVal(m,v){if(v==null||isNaN(v))return "–";const t=mt(m);if(t==="yesno")return Math.round(v*100)+"%";if(t==="number")return (Math.round(v*10)/10)+(m.unit?" "+m.unit:"");return v.toFixed(1)}
function fmtRaw(m,v){const t=mt(m);if(t==="yesno")return v?"Yes":"No";if(t==="number")return v+(m.unit?" "+m.unit:"");return String(v)}
function fmtDiff(m,d){const s=d>=0?"+":"−",a=Math.abs(d),t=mt(m);if(t==="yesno")return s+Math.round(a*100)+" pts";if(t==="number")return s+(Math.round(a*10)/10)+(m.unit?" "+m.unit:"");return s+a.toFixed(1)}
const better=(m,d)=>m.dir==="down"?-d:d;
function scaleNote(m){const t=mt(m);return t==="scale"?"on a 5-point scale":t==="yesno"?"in how often it happened":"per day"}

/* ---------- stats ---------- */
const mean=a=>a.reduce((s,x)=>s+x,0)/a.length;
const sd=a=>{if(a.length<2)return 0;const m=mean(a);return Math.sqrt(a.reduce((s,x)=>s+(x-m)*(x-m),0)/(a.length-1))};
function permP(a,b,n){n=n||4000;const obs=Math.abs(mean(b)-mean(a)),na=a.length,x=a.concat(b);let c=0;
  for(let i=0;i<n;i++){for(let j=x.length-1;j>0;j--){const k=Math.floor(Math.random()*(j+1));const t=x[j];x[j]=x[k];x[k]=t}
    let sa=0;for(let j=0;j<na;j++)sa+=x[j];let sb=0;for(let j=na;j<x.length;j++)sb+=x[j];
    if(Math.abs(sb/(x.length-na)-sa/na)>=obs-1e-9)c++}
  return (c+1)/(n+1)}
function cohen(a,b){const na=a.length,nb=b.length;const p=Math.sqrt(((na-1)*sd(a)**2+(nb-1)*sd(b)**2)/(na+nb-2));const d=mean(b)-mean(a);if(!p)return d===0?0:Math.sign(d)*3;return d/p}
function compare(a,b,m){
  m=m||{};
  if(a.length<4||b.length<4)return{ok:false,na:a.length,nb:b.length};
  const diff=mean(b)-mean(a),d=cohen(a,b),p=permP(a,b),g=better(m,diff);
  let v,cls;
  if(p<0.05&&Math.abs(d)>=0.5){v=g>0?"Real improvement":"Real decline";cls=g>0?"good":"bad"}
  else if(p<0.2){v=g>0?"Leaning better":"Leaning worse";cls="warn"}
  else{v="No clear difference";cls=""}
  return{ok:true,ma:mean(a),mb:mean(b),diff,d,p,v,cls,g,na:a.length,nb:b.length}}
window.__fieldworkStats={compare,mean,cohen,permP};

/* ---------- experiments ---------- */
function phaseOn(e,date){const total=e.baseDays+e.testDays,day=diffDays(e.start,date);
  return day<0?"scheduled":day<e.baseDays?"baseline":day<total?"test":"complete"}
function phaseOf(e){const total=e.baseDays+e.testDays,day=diffDays(e.start,today());
  return{day,total,phase:e.status!=="active"?e.status:phaseOn(e,today())}}
function series(e,mid){const a=[],b=[],pts=[],total=e.baseDays+e.testDays;
  Object.keys(S.checkins).sort().forEach(d=>{const k=diffDays(e.start,d);if(k<0||k>=total)return;const c=S.checkins[d];const v=c.m&&c.m[mid];if(v==null||isNaN(v))return;
    if(k<e.baseDays){a.push(v);pts.push({k,v,ph:"b"})}else{if(c.adh&&c.adh[e.id]===false)return;b.push(v);pts.push({k,v,ph:"t"})}});
  return{a,b,pts,total}}
function questDays(){return new Set(S.quests.log.map(q=>q.date))}
const hasData=c=>!!(c&&c.m&&Object.keys(c.m).length);
const loggedDates=()=>Object.keys(S.checkins).filter(d=>hasData(S.checkins[d])).sort();
function streakOf(e){let n=0,d=today();const c0=S.checkins[d];if(!(c0&&c0.adh&&c0.adh[e.id]===true))d=addDays(d,-1);
  while(phaseOn(e,d)==="test"){const c=S.checkins[d];if(c&&c.adh&&c.adh[e.id]===true){n++;d=addDays(d,-1)}else break}return n}
const doneToday=e=>{const c=S.checkins[today()];return !!(c&&c.adh&&c.adh[e.id]===true)};
function bestResult(e){const rows=e.metrics.map(mid=>{const {a,b}=series(e,mid);return{mid,m:metric(mid),r:compare(a,b,metric(mid))}}).filter(x=>x.r.ok);
  return rows.sort((p,q)=>Math.abs(q.r.d)-Math.abs(p.r.d))[0]||null}
function pearson(x,y){const mx=mean(x),my=mean(y);let n=0,a=0,b=0;for(let i=0;i<x.length;i++){const dx=x[i]-mx,dy=y[i]-my;n+=dx*dy;a+=dx*dx;b+=dy*dy}return a&&b?n/Math.sqrt(a*b):0}
function patterns(){
  const dates=loggedDates(),out=[],M=S.metrics;
  for(let i=0;i<M.length;i++)for(let j=i+1;j<M.length;j++){const A=M[i],B=M[j],xs=[],ys=[];
    dates.forEach(d=>{const m=S.checkins[d].m;if(m[A.id]!=null&&m[B.id]!=null){xs.push(m[A.id]);ys.push(m[B.id])}});
    if(xs.length<10)continue;const r=pearson(xs,ys);if(Math.abs(r)>=0.4)out.push({kind:"pair",A,B,r,n:xs.length,w:Math.abs(r)})}
  const qd=questDays();
  M.forEach(m=>{const after=[],other=[];dates.forEach(d=>{const v=S.checkins[d].m[m.id];if(v==null)return;(qd.has(addDays(d,-1))?after:other).push(v)});
    if(after.length<3||other.length<5)return;const d=cohen(other,after);if(Math.abs(d)>=0.5)out.push({kind:"quest",m,diff:mean(after)-mean(other),n:after.length,w:Math.min(1,Math.abs(d)/2)})});
  return out.sort((p,q)=>q.w-p.w).slice(0,4)}
const PUSH=["Every day you do it is a data point. Make today count.","Small change, real evidence. Go get it.","You set this up to find out. Today is how you find out.","Future you is reading these results. Give them something good.","Showing up is the whole experiment. Show up.","One more day of proof. Go."];
function missionHTML(){
  const act=S.experiments.filter(e=>e.status==="active");let h="";
  act.filter(e=>phaseOn(e,today())==="test").forEach(e=>{const {day}=phaseOf(e),k=day-e.baseDays+1,st=streakOf(e),done=doneToday(e),best=bestResult(e);
    let msg=PUSH[day%PUSH.length];
    if(best&&best.r.g>0&&best.r.p<0.2)msg=`Early read: your ${best.m.name.toLowerCase()} is up ${fmtDiff(best.m,best.r.diff).replace("+","")}. It's working. Keep going.`;
    if(done)msg=st>1?`${st} days in a row. That's how habits get built.`:"Done for today. Same time tomorrow.";
    h+=`<section class="mission" aria-label="Today's mission"><div class="row between"><span class="eyebrow">Today's mission · day ${k} of ${e.testDays}</span>${st?`<span class="streak">${st}-day streak</span>`:""}</div>
      <h3>${esc(e.change)}</h3><div class="small">${esc(msg)}</div>
      ${done?`<button class="btn done" data-act="missionUndo" data-id="${e.id}">Done today ✓ · undo</button>`:`<button class="btn" data-act="missionDone" data-id="${e.id}">I did it today</button>`}</section>`});
  act.filter(e=>{const p=phaseOn(e,today());return p==="baseline"||p==="scheduled"}).forEach(e=>{const left=e.baseDays-Math.max(0,diffDays(e.start,today()));
    h+=`<section class="mission wait"><span class="eyebrow">Your change starts in ${left} day${left===1?"":"s"}</span><h3>${esc(e.change)}</h3><div class="small muted">Baseline first: live normally and keep checking in, so your change has something to beat.</div></section>`});
  return h}

const CRAWLS={bakery:"Bakery tribunal",icecream:"Ice cream tribunal",books:"Bookstore crawl",thrift:"Thrift crawl",records:"Crate-digging crawl",sweets:"Sweet tooth crawl"};
function classify(t){
  if(t.leisure==="nature_reserve")return"reserve"; if(t.leisure==="park")return"park"; if(t.leisure==="garden")return"garden";
  if(t.natural==="beach"||t.leisure==="beach_resort")return"beach"; if(t.natural==="peak")return"peak"; if(t.natural==="waterfall")return"waterfall";
  if(t.tourism==="viewpoint")return"viewpoint"; if(t.man_made==="lighthouse"||t.historic==="lighthouse")return"lighthouse";
  if(t.historic==="memorial"||t.historic==="monument")return"memorial"; if(t.historic)return"historic";
  if(t.tourism==="museum")return"museum"; if(t.tourism==="gallery"||t.amenity==="arts_centre")return"gallery";
  if(t.tourism==="zoo")return"zoo"; if(t.tourism==="aquarium")return"aquarium";
  if(t.amenity==="library")return"library"; if(t.amenity==="theatre")return"theatre"; if(t.amenity==="cinema")return"cinema";
  if(t.amenity==="planetarium"||t.man_made==="observatory")return"stars"; if(t.amenity==="marketplace")return"market"; if(t.shop==="farm")return"farm";
  if(t.amenity==="restaurant")return"restaurant"; if(t.shop==="bakery")return"bakery"; if(t.amenity==="ice_cream")return"icecream";
  if(t.shop==="chocolate"||t.shop==="confectionery"||t.shop==="cheese")return"sweets";
  if(t.shop==="books")return"books"; if(t.shop==="second_hand")return"thrift"; if(t.shop==="music")return"records"; if(t.shop==="antiques")return"antiques";
  if(t.leisure==="bowling_alley")return"bowling"; if(t.leisure==="miniature_golf")return"minigolf"; if(t.leisure==="escape_game")return"escape";
  if(t.leisure==="amusement_arcade")return"arcade"; if(t.leisure==="ice_rink")return"rink"; if(t.sport==="climbing")return"climbing";
  if(t.leisure==="marina"||t.man_made==="pier")return"waterfront";
  return null}
function overpassQuery(loc){const a=(r)=>`(around:${r},${loc.lat},${loc.lon})`,near=a(20000),mid=a(40000),far=a(80000);
  const g=(sel,n)=>`(${sel})->.x;.x out tags center ${n};`;
  return `[out:json][timeout:40];`+
   g(`nwr["leisure"="park"]["name"]${near};`,90)+
   g(`nwr["leisure"~"^(nature_reserve|garden)$"]["name"]${mid};nwr["natural"~"^(beach|peak|waterfall)$"]["name"]${far};nwr["tourism"="viewpoint"]["name"]${far};nwr["leisure"~"^(marina)$"]["name"]${near};nwr["man_made"="pier"]["name"]${mid};`,160)+
   g(`nwr["tourism"~"^(museum|gallery|zoo|aquarium)$"]["name"]${far};nwr["man_made"~"^(lighthouse|observatory)$"]["name"]${far};nwr["historic"~"^(castle|fort|manor|ruins|ship|battlefield|archaeological_site|lighthouse|building|house|mill)$"]["name"]${mid};nwr["historic"~"^(monument|memorial)$"]["name"]${near};`,180)+
   g(`nwr["amenity"~"^(library|theatre|cinema|planetarium|arts_centre|marketplace)$"]["name"]${mid};nwr["shop"="farm"]["name"]${far};`,120)+
   g(`nwr["amenity"="restaurant"]["cuisine"]["name"]${a(16000)};`,260)+
   g(`nwr["shop"~"^(bakery|books|second_hand|music|antiques|chocolate|confectionery|cheese)$"]["name"]${a(16000)};nwr["amenity"="ice_cream"]["name"]${a(16000)};`,200)+
   g(`nwr["leisure"~"^(bowling_alley|miniature_golf|escape_game|amusement_arcade|ice_rink)$"]["name"]${mid};nwr["sport"="climbing"]["name"]${mid};`,80)}
async function loadPlaces(force){
  const loc=S.prefs.loc;if(!loc){S.places=null;return}
  const key=loc.lat.toFixed(2)+","+loc.lon.toFixed(2);
  if(!force&&S.places&&S.places.key===key&&Date.now()-S.places.at<7*864e5)return;
  if(UI.placesLoading)return;UI.placesLoading=true;UI.placesErr=false;if(UI.tab==="quests")renderQuests();
  const body="data="+encodeURIComponent(overpassQuery(loc));
  let j=null;
  for(const host of["https://overpass-api.de/api/interpreter","https://overpass.kumi.systems/api/interpreter"]){
    try{const r=await fetch(host,{method:"POST",headers:{"Content-Type":"application/x-www-form-urlencoded"},body});if(r.ok){j=await r.json();break}}catch(e){}
  }
  if(j&&j.elements){const seen=new Set(),items=[];
    j.elements.forEach(e=>{const t=e.tags||{},name=(t.name||"").trim(),k=classify(t);if(!k||!name||name.length>60)return;
      const lat=e.lat!=null?e.lat:e.center&&e.center.lat,lon=e.lon!=null?e.lon:e.center&&e.center.lon;if(lat==null)return;
      const dk=k+"|"+name.toLowerCase();if(seen.has(dk))return;seen.add(dk);
      const it={id:e.type[0]+e.id,k,n:name,lat:+lat.toFixed(5),lon:+lon.toFixed(5)};
      if(k==="restaurant"){const c=String(t.cuisine).split(";")[0].trim().toLowerCase();if(!c||SKIP_CUISINE.has(c))return;it.c=c}
      items.push(it)});
    S.places={key,at:Date.now(),items};save();
  }else UI.placesErr=true;
  UI.placesLoading=false;if(UI.tab==="quests")renderQuests();
}
function placeCounts(){const c={};(S.places&&S.places.items||[]).forEach(p=>c[p.k]=(c[p.k]||0)+1);return c}
const MAX_KM=[0,16,40,85]; // by time budget
function placeQuests(opts){
  opts=opts||{};const loc=S.prefs.loc,P=S.prefs;if(!loc||!S.places||!S.places.items)return[];
  const day=questDay(),season=seasonOf(day),rain=badDay(wxFor(day))&&P.set!=="out";
  const recentPlaces=new Set(S.quests.log.filter(l=>l.placeId&&diffDays(l.date,today())<120).map(l=>l.placeId));
  const banned=new Set(S.quests.bannedPlaces||[]),triedCuisine=new Set(S.quests.log.map(l=>l.cuisine).filter(Boolean));
  const activeId=S.quests.active&&S.quests.active.placeId,out=[];
  S.places.items.forEach(p=>{if(banned.has(p.id)||recentPlaces.has(p.id)||p.id===activeId)return;const K=KINDS[p.k];if(!K)return;
    const d=distKm(loc,p);
    K.t.forEach((t,i)=>{
      const time=Math.max(t.time,d>45?3:d>20?2:1);
      if(d>MAX_KM[P.time]||t.cost>P.cost||time>P.time)return;
      if(!(P.who==="any"||t.who==="any"||t.who===P.who))return;
      if(!(P.set==="any"||t.set==="any"||t.set===P.set))return;
      if(rain&&t.set==="out")return;if(t.season&&t.season!==season)return;
      if(opts.mystery&&t.who==="group"&&t.cat==="Social")return;
      const c=p.c?prettyCuisine(p.c):"";
      out.push({id:"p-"+p.id+"-"+i,placeId:p.id,kind:p.k,kindLabel:K.label,lat:p.lat,lon:p.lon,place:p.n,dist:d,cuisine:p.c||null,newCuisine:!!(p.c&&!triedCuisine.has(p.c)),
        title:t.title.replace("{n}",p.n).replace("{c}",c),detail:t.detail.replace("{n}",p.n).replace("{c}",c),cat:t.cat,cost:t.cost,time,who:t.who,set:t.set,season:t.season,local:true})})});
  if(!opts.mystery)out.push(...crawlQuests());
  return out}
function crawlQuests(){const loc=S.prefs.loc,P=S.prefs,items=S.places.items,out=[];if(P.cost<1)return out;
  const recentPlaces=new Set(S.quests.log.filter(l=>l.placeId&&diffDays(l.date,today())<120).map(l=>l.placeId));
  Object.keys(CRAWLS).forEach(k=>{const list=items.filter(p=>p.k===k&&distKm(loc,p)<=Math.max(16,MAX_KM[P.time]));if(list.length<3)return;
    list.forEach(seed=>{const near=list.filter(p=>p!==seed).map(p=>({p,d:distKm(seed,p)})).filter(x=>x.d<=8).sort((a,b)=>a.d-b.d).slice(0,2);
      if(near.length<2||recentPlaces.has(seed.id))return;const stops=[seed,near[0].p,near[1].p],time=P.time>=2?2:1;if(time>P.time)return;
      if(P.set==="out")return;
      out.push({id:"c-"+stops.map(s=>s.id).join("-"),placeId:seed.id,kind:k,kindLabel:"Three stops",lat:seed.lat,lon:seed.lon,place:seed.n,dist:distKm(loc,seed),stops:stops.map(s=>({n:s.n,lat:s.lat,lon:s.lon})),
        title:CRAWLS[k]+": "+stops.length+" stops",detail:`Hit ${stops[0].n}, ${stops[1].n}, and ${stops[2].n} in one go. Score each one and crown a winner.`,cat:k==="books"||k==="records"?"Culture":k==="thrift"?"Skill":"Food",cost:1,time,who:"any",set:"in",local:true,crawl:true})})});
  return out}
function mapsLink(q){const ios=/iPad|iPhone|iPod|Macintosh/.test(navigator.userAgent||"");
  if(q.stops&&!ios)return "https://www.google.com/maps/dir/"+q.stops.map(s=>s.lat+","+s.lon).join("/");
  return ios?`https://maps.apple.com/?daddr=${q.lat},${q.lon}`+(q.mystery?"":`&q=${encodeURIComponent(q.place)}`):`https://www.google.com/maps/dir/?api=1&destination=${q.lat},${q.lon}`}
function mysteryText(q){return `Somewhere ${miles(q.dist)} ${compass(S.prefs.loc,q)} of you. Follow the directions, and don't look up the name until you're there.`}
async function findTown(q){
  const r=await fetch(`https://geocoding-api.open-meteo.com/v1/search?name=${encodeURIComponent(q)}&count=1&language=en&format=json`);
  if(!r.ok)throw new Error("bad");const j=await r.json();const g=j.results&&j.results[0];if(!g)return null;
  return{lat:+g.latitude.toFixed(2),lon:+g.longitude.toFixed(2),name:[g.name,g.admin1].filter(Boolean).join(", ")}}
async function loadWx(force){
  const loc=S.prefs.loc;if(!loc){S.wx=null;return}const key=loc.lat.toFixed(2)+","+loc.lon.toFixed(2);
  if(!force&&S.wx&&S.wx.key===key&&Date.now()-S.wx.at<3*3600e3&&S.wx.days[today()])return;

function progBar(e){const {day,total}=phaseOf(e);const done=Math.max(0,Math.min(total,day+1));

function yRange(m,pts){const t=mt(m);
  if(t==="scale")return{lo:1,hi:5,ticks:[1,2,3,4,5],lab:v=>String(v)};
  if(t==="yesno")return{lo:0,hi:1,ticks:[0,1],lab:v=>v?"Yes":"No"};
  let lo=Math.min(...pts.map(p=>p.v)),hi=Math.max(...pts.map(p=>p.v));if(!isFinite(lo)){lo=0;hi=1}
  lo=Math.floor(lo);hi=Math.ceil(hi);if(lo===hi)hi=lo+1;const step=(hi-lo)/4,ticks=[0,1,2,3,4].map(i=>lo+i*step);

  R0.ticks.forEach((v,i)=>{s+=`<line class="axis" x1="${L}" x2="${W-R}" y1="${y(v)}" y2="${y(v)}" opacity="${i===0?1:.5}"/><text x="${L-5}" y="${y(v)+3}" text-anchor="end">${esc(R0.lab(v))}</text>`});
  s+=`<text x="${L+4}" y="${T-5}">BASELINE</text><text x="${bx+4}" y="${T-5}">TEST</text>`;
  if(a.length)s+=`<line class="mean b" x1="${L}" x2="${bx}" y1="${y(mean(a))}" y2="${y(mean(a))}"/>`;
  if(b.length)s+=`<line class="mean t" x1="${bx}" x2="${W-R}" y1="${y(mean(b))}" y2="${y(mean(b))}"/>`;

/* ---------- QUESTS ---------- */
function pool(){const li=inLI(S.prefs.loc);return DECK.concat(S.quests.custom).filter(q=>!S.quests.banned.includes(q.id)&&(li||!LOCAL_LI.has(q.id)))}
function dayOpts(){const t=today(),arr=[[t,"Today"],[addDays(t,1),"Tomorrow"]],dow=parse(t).getDay();
  [addDays(t,(6-dow+7)%7),addDays(t,(7-dow)%7)].forEach(d=>{if(!arr.some(a=>a[0]===d))arr.push([d,fmt(d,{weekday:"short"})])});
  let k=2;while(arr.length<4){const d=addDays(t,k++);if(!arr.some(a=>a[0]===d))arr.push([d,fmt(d,{weekday:"short"})])}
  return arr.sort((a,b)=>a[0].localeCompare(b[0])).slice(0,4)}
function questDay(){const opts=dayOpts().map(o=>o[0]);if(!S.prefs.day||!opts.includes(S.prefs.day))S.prefs.day=today();return S.prefs.day}
function eligible(){const P=S.prefs,day=questDay(),season=seasonOf(day),w=wxFor(day),rain=badDay(w)&&P.set!=="out";
  const recent=new Set(S.quests.log.filter(l=>diffDays(l.date,today())<60).map(l=>l.qid));
  return pool().filter(q=>q.cost<=P.cost&&q.time<=P.time&&(P.who==="any"||q.who==="any"||q.who===P.who)&&(P.set==="any"||q.set==="any"||q.set===P.set)
    &&(!q.season||q.season===season)&&!(rain&&q.set==="out")&&!recent.has(q.id)&&!(S.quests.active&&S.quests.active.id===q.id))}
function rollQuest(){
  const src=S.prefs.src||"mix",myst=!!S.prefs.mystery,last=UI.rolledQ&&UI.rolledQ.id;
  let local=src==="classic"?[]:placeQuests({mystery:myst}),classic=(src==="near"||myst)?[]:eligible();
  local=local.filter(q=>q.id!==last&&q.placeId!==(UI.rolledQ&&UI.rolledQ.placeId));classic=classic.filter(q=>q.id!==last);
  if(!local.length&&!classic.length)return null;
  const useLocal=local.length&&(!classic.length||Math.random()<0.65);
  if(!useLocal)return Object.assign({},weightedPick(classic));
  // pick a kind first so one category (parks, restaurants) can't drown the rest
  const byKind={};local.forEach(q=>(byKind[q.kind+(q.crawl?"*":"")]=byKind[q.kind+(q.crawl?"*":"")]||[]).push(q));
  const kinds=Object.keys(byKind),recentKinds=S.quests.log.slice(-3).map(l=>l.kind).filter(Boolean),taste=tasteWeights();
  const kw=kinds.map(k=>{const s=byKind[k][0];let w=1;const a=taste[s.cat];if(a!=null)w*=Math.max(0.3,1+(a-3)*0.5);if(recentKinds.includes(s.kind))w*=0.35;if(s.crawl)w*=0.8;if(s.newCuisine)w*=1.4;return w});
  let r=Math.random()*kw.reduce((a,b)=>a+b,0),pick=kinds[kinds.length-1];for(let i=0;i<kinds.length;i++){r-=kw[i];if(r<=0){pick=kinds[i];break}}
  const list=byKind[pick],q=Object.assign({},list[Math.floor(Math.random()*list.length)]);
  if(myst)q.mystery=true;return q}
function matchCount(){const src=S.prefs.src||"mix",myst=!!S.prefs.mystery;
  return (src==="classic"?0:placeQuests({mystery:myst}).length)+((src==="near"||myst)?0:eligible().length)}
function tasteWeights(){const by={};S.quests.log.forEach(l=>{(by[l.cat]=by[l.cat]||[]).push(l.rating)});const out={};for(const c in by)out[c]=mean(by[c]);return out}
function weightedPick(list){const taste=tasteWeights();
  const ws=list.map(q=>{let w=1;const a=taste[q.cat];if(a!=null)w*=Math.max(0.3,1+(a-3)*0.5);if(q.season)w*=1.6;if(q.custom)w*=1.3;return w});
  let r=Math.random()*ws.reduce((s,x)=>s+x,0);for(let i=0;i<list.length;i++){r-=ws[i];if(r<=0)return list[i]}return list[list.length-1]}
function chipGroup(label,key,opts){return `<div class="fgroup"><span class="eyebrow">${label}</span><div class="chips" role="group" aria-label="${label}">${opts.map(([v,t])=>`<button class="chip" data-act="pref" data-k="${key}" data-v="${v}" aria-pressed="${String(S.prefs[key])===String(v)}">${t}</button>`).join("")}</div></div>`}
function dayPicker(){const day=questDay();
  let h=`<div class="fgroup"><span class="eyebrow">When</span><div class="fc" role="group" aria-label="Day">`;
  dayOpts().forEach(([d,l])=>{const w=wxFor(d),wi=w?wxIcon(w.code):null;
    h+=`<button data-act="pickDay" data-d="${d}" aria-pressed="${d===day}" aria-label="${esc(l)}${w?", "+wi[1]+", high "+w.hi+", "+w.pp+" percent rain":""}"><span>${esc(l)}</span>${w?`<span class="wx" aria-hidden="true">${wi[0]}</span><b>${w.hi}°</b><span class="pp">${w.pp}% rain</span>`:`<span class="pp">${UI.wxLoading?"loading…":S.prefs.loc?"no forecast":fmt(d,{month:"short",day:"numeric"})}</span>`}</button>`});
  h+=`</div>`;
  const w=wxFor(day);
  if(w&&badDay(w))h+=`<div class="wxnote">${wxIcon(w.code)[1]} likely ${day===today()?"today":fmt(day,{weekday:"long"})}, so outdoor quests are held back. Pick "Outdoors" to override.</div>`;

function questEffect(){

  if(on.length<3||off.length<3){h+=`<div class="small muted">Once you've done 3 quests on days you also checked in, this compares your quest days to your regular days. ${on.length}/3 so far.</div></section>`;return h}
  h+=`<div class="tablewrap"><table class="res"><thead><tr><th>Metric</th><th>Quest days</th><th>Other days</th><th>Gap</th></tr></thead><tbody>`;
  S.metrics.forEach(m=>{const A=on.map(d=>S.checkins[d].m[m.id]).filter(v=>v!=null),B=off.map(d=>S.checkins[d].m[m.id]).filter(v=>v!=null);if(!A.length||!B.length)return;
    const g=mean(A)-mean(B),gb=better(m,g);h+=`<tr><td>${esc(m.name)}</td><td>${esc(fmtVal(m,mean(A)))}</td><td>${esc(fmtVal(m,mean(B)))}</td><td class="${gb>0.05?"pos":gb<-0.05?"neg":""}">${esc(fmtDiff(m,g))}</td></tr>`});
  const linked=S.experiments.some(e=>e.questLinked&&e.status==="active");
  h+=`</tbody></table></div><div class="small muted">This is a correlation: maybe quests lift your mood, maybe you only go questing on good days. ${linked?"Your side-quest experiment will settle it.":"Run the side-quest experiment to find out which."}</div>
  ${linked?"":`<button class="btn ghost" data-act="newExp" data-tpl="3">Start the side-quest experiment</button>`}</section>`;
  return h;
}

  case "calNav":{const [y,m]=UI.calMonth.split("-").map(Number),n=new Date(y,m-1+(+el.dataset.d),1);UI.calMonth=`${n.getFullYear()}-${pad(n.getMonth()+1)}`;renderToday();break}
  case "clearSample":clearSample();break;
  case "newExp":newExpSheet(el.dataset.tpl!=null?+el.dataset.tpl:null);break;
  case "useTpl":newExpSheet(+el.dataset.i);break;
  case "toggleChip":el.setAttribute("aria-pressed",el.getAttribute("aria-pressed")==="true"?"false":"true");break;
  case "createExp":{
    const title=document.getElementById("exTitle").value.trim(),change=document.getElementById("exChange").value.trim();
    const ms=[...document.querySelectorAll("#exMetrics .chip[aria-pressed=true]")].map(b=>b.dataset.m);
    const bd=Math.max(4,Math.min(60,+document.getElementById("exBase").value||7)),td=Math.max(4,Math.min(60,+document.getElementById("exTest").value||7));
    const start=document.getElementById("exStart").value||today();
    if(!change||!ms.length){toast(!change?"Add the change you'll make":"Pick at least one metric");break}
    const e={id:uid(),title:title||("Does "+change.toLowerCase()+" help?"),change,metrics:ms,start,baseDays:bd,testDays:td,status:"active",created:today(),questLinked:document.getElementById("exQL").value==="1"};
    S.experiments.push(e);save();closeSheet();UI.tab="lab";UI.labDetail=e.id;render();toast("Experiment started");break}
  case "openExp":UI.tab="lab";UI.labDetail=el.dataset.id;UI.delArm=null;render();window.scrollTo(0,0);break;
  case "backLab":UI.labDetail=null;renderLab();break;
  case "metricView":UI.metricView=el.dataset.m;renderLab();break;
  case "finishExp":{const e=S.experiments.find(x=>x.id===el.dataset.id);closeExpSheet(e);break}
  case "setDecision":UI.closing.takeaway=(document.getElementById("takeaway")||{}).value||"";UI.closing.decision=el.dataset.v;drawClose();break;
  case "confirmClose":{const e=S.experiments.find(x=>x.id===UI.closing.id),best=bestResult(e),ta=document.getElementById("takeaway");
    e.status="done";e.decision=UI.closing.decision;e.takeaway=ta.value.trim()||ta.placeholder.replace("What did you learn?","");e.closed=today();
    e.result=best?{name:best.m.name,diff:fmtDiff(best.m,best.r.diff),v:best.r.v,cls:best.r.cls}:null;
    save();closeSheet();UI.labDetail=null;renderLab();window.scrollTo(0,0);toast(e.decision==="keep"?"Added to your rulebook":"Saved");break}
  case "missionDone":{const id=el.dataset.id,t=today(),c=S.checkins[t]||{m:{},adh:{},note:""};c.adh=Object.assign({},c.adh,{[id]:true});S.checkins[t]=c;if(UI.draft&&UI.draft.date===t)UI.draft.adh[id]=true;
    save();renderToday();const st=streakOf(S.experiments.find(x=>x.id===id));toast(st>1?`${st} days straight. Keep it rolling.`:"Logged. Nice work.");break}
  case "missionUndo":{const id=el.dataset.id,t=today(),c=S.checkins[t];if(c&&c.adh){delete c.adh[id];if(!hasData(c)&&!Object.keys(c.adh).length&&!c.note)delete S.checkins[t]}if(UI.draft&&UI.draft.date===t)delete UI.draft.adh[id];save();renderToday();break}
  case "testPattern":{const p=(UI.patterns||[])[+el.dataset.i];if(!p)break;newExpSheet({title:`Does improving my ${p.A.name.toLowerCase()} change my ${p.B.name.toLowerCase()}?`,change:"",metrics:[p.A.id,p.B.id],baseDays:7,testDays:7});break}
  case "invite":{let q,tw,day;if(el.dataset.src==="active"){q=S.quests.active;tw=q.twist;day=q.day}else{q=UI.rolledQ;tw=UI.rolledTwist;day=questDay()}
    if(q){const t=q.mystery&&!q.revealed?Object.assign({},q,{title:"Mystery destination "+miles(q.dist)+" away",detail:"I know where. You find out when we get there."}):q;invite(inviteText(t,tw,day))}break}
  case "reopenExp":{const e=S.experiments.find(x=>x.id===el.dataset.id);e.status="active";delete e.decision;save();renderLab();break}
  case "deleteExp":{const id=el.dataset.id;if(UI.delArm!==id){UI.delArm=id;renderLab();break}
    S.experiments=S.experiments.filter(x=>x.id!==id);Object.values(S.checkins).forEach(c=>{if(c.adh)delete c.adh[id]});UI.labDetail=null;UI.delArm=null;save();renderLab();toast("Experiment deleted");break}
  case "pref":{const k=el.dataset.k,v=el.dataset.v;S.prefs[k]=(k==="cost"||k==="time")?+v:v;save();renderQuests();break}
  case "pickDay":S.prefs.day=el.dataset.d;save();renderQuests();break;
  case "toggleTwist":S.prefs.twist=!S.prefs.twist;save();renderQuests();break;
  case "toggleMystery":S.prefs.mystery=!S.prefs.mystery;save();renderQuests();break;
  case "retryPlaces":loadPlaces(true);break;
  case "reveal":{const a=S.quests.active;a.revealed=true;save();render();toast("It's "+a.place+"!");break}
  case "useLoc":{
    if(!("geolocation" in navigator)){toast("Location isn't available here");break}
    toast("Finding your location…");
    try{navigator.geolocation.getCurrentPosition(p=>{S.prefs.loc={lat:+p.coords.latitude.toFixed(2),lon:+p.coords.longitude.toFixed(2),name:"your current area"};S.places=null;UI.locEdit=false;save();loadWx(true);loadPlaces(true);toast("Location updated")},()=>toast("Location not allowed. Type your town instead."),{timeout:10000,maximumAge:3600e3})}catch(e){toast("Location not allowed. Type your town instead.")}
    break}
  case "locEdit":UI.locEdit=true;renderQuests();break;
  case "clearLoc":S.prefs.loc=null;S.wx=null;S.places=null;S.prefs.mystery=false;if(S.prefs.src==="near")S.prefs.src="mix";UI.locEdit=false;save();renderQuests();toast("Location removed");break;
  case "setTown":{const q=(document.getElementById("townIn")||{}).value;if(!q||!q.trim()){toast("Type a town or ZIP");break}
    toast("Looking it up…");findTown(q.trim()).then(loc=>{if(!loc){toast("Couldn't find that. Try adding the state.");return}S.prefs.loc=loc;S.wx=null;S.places=null;UI.locEdit=false;save();loadWx(true);loadPlaces(true);renderQuests();toast("Set to "+loc.name)}).catch(()=>toast("Couldn't reach the lookup. Try again in a bit."));break}
  case "roll":{const q=rollQuest();if(!q){UI.rolledQ=null;renderQuests();toast("Nothing fits. Loosen a filter.");break}
    UI.rolledQ=q;UI.rolledTwist=S.prefs.twist?TWISTS[Math.floor(Math.random()*TWISTS.length)]:null;
    renderQuests();const c=document.querySelector(".qcard.roll");if(c)c.scrollIntoView({behavior:"smooth",block:"center"});break}
  case "acceptQuest":{const q=UI.rolledQ;if(!q||S.quests.active)break;S.quests.active=Object.assign({accepted:today(),day:questDay(),twist:UI.rolledTwist},q);UI.rolledQ=null;UI.rolledTwist=null;save();renderQuests();toast("Quest accepted");window.scrollTo(0,0);break}
  case "banQuest":{const q=UI.rolledQ;if(!q)break;if(q.local){S.quests.bannedPlaces=S.quests.bannedPlaces||[];S.quests.bannedPlaces.push(q.placeId)}else S.quests.banned.push(q.id);UI.rolledQ=null;save();renderQuests();toast(q.local?"That place won't come up again":"Removed from the deck");break}
  case "dropQuest":S.quests.active=null;save();render();toast("Quest dropped");break;
  case "completeQuest":completeSheet();break;
  case "qrate":document.querySelectorAll("#qRate button").forEach(b=>b.setAttribute("aria-pressed",b===el?"true":"false"));break;
  case "logQuest":{const a=S.quests.active,r=+(document.querySelector("#qRate button[aria-pressed=true]")||{dataset:{v:4}}).dataset.v;
    S.quests.log.push({id:uid(),qid:a.id,title:a.title,cat:a.cat,twist:a.twist||null,placeId:a.placeId||null,kind:a.kind||null,cuisine:a.cuisine||null,date:document.getElementById("qDate").value||today(),rating:r,note:document.getElementById("qNote").value.trim()});
    S.quests.active=null;save();closeSheet();render();toast("Quest logged");break}
  case "addQuest":addQuestSheet();break;
  case "saveCustom":{const t=document.getElementById("cqT").value.trim();if(!t){toast("Name the quest");break}
    S.quests.custom.push({id:"c-"+uid(),title:t,detail:document.getElementById("cqD").value.trim()||"Your own idea.",cat:document.getElementById("cqCat").value,cost:+document.getElementById("cqCost").value,time:+document.getElementById("cqTime").value,who:"any",set:document.getElementById("cqSet").value,season:null,custom:true});
    save();closeSheet();renderQuests();toast("Added to the deck");break}
  case "newType":UI.newType=el.dataset.v;settingsSheet();break;
  case "addMetric":{const n=document.getElementById("nmName").value.trim();if(!n){toast("Name the metric");break}
    const t=UI.newType,m={id:"m-"+uid(),name:n,type:t,lo:"Low",hi:"High"};
    if(t==="number"){const u=document.getElementById("nmUnit");m.unit=u?u.value.trim():""}
    const d=document.getElementById("nmDir");if(d&&d.value==="down")m.dir="down";
    S.metrics.push(m);save();UI.draft=null;settingsSheet();render();toast("Metric added");break}
  case "rmMetric":{const m=S.metrics.find(x=>x.id===el.dataset.m);S.metrics=S.metrics.filter(x=>x.id!==el.dataset.m);if(m&&!S.archived.some(x=>x.id===m.id))S.archived.push(m);save();UI.draft=null;settingsSheet();render();break}
  case "remGoogle":remGoogle();break;
  case "remIcs":remIcs();break;
  case "copyBackup":{const txt=JSON.stringify(S),ta=document.getElementById("bk");ta.hidden=false;ta.value=txt;
    const done=()=>toast("Backup copied. Paste it into Notes or email it to yourself.");
    try{navigator.clipboard.writeText(txt).then(done,()=>{ta.select();toast("Select all and copy the text below")})}catch(e){ta.select();toast("Select all and copy the text below")}break}
  case "showImport":{const ta=document.getElementById("bk");ta.hidden=false;ta.value="";ta.placeholder="Paste your backup here";document.getElementById("doImport").hidden=false;ta.focus();break}
  case "doImport":{try{const s=JSON.parse(document.getElementById("bk").value);if(!s||s.v!==1||!s.checkins)throw 0;S=migrate(s);save();UI.draft=null;closeSheet();render();toast("Backup restored")}catch(e){toast("That doesn't look like a Fieldwork backup")}break}
  case "eraseAll":if(!UI.eraseArm){UI.eraseArm=true;settingsSheet();break}S=blank();save();UI.eraseArm=false;UI.draft=null;UI.labDetail=null;closeSheet();render();toast("Everything erased");break;
  }
});
function clearSample(){
  for(const d in S.checkins)if(S.checkins[d].sample)delete S.checkins[d];
  S.experiments=S.experiments.filter(e=>!e.sample);S.quests.log=S.quests.log.filter(q=>!q.sample);
  S.hasSample=false;UI.draft=null;UI.labDetail=null;save();closeSheet();render();toast("Examples cleared. It's all yours.");
}
render();loadWx();
try{if("serviceWorker" in navigator&&document.documentElement.dataset.pwa==="1")navigator.serviceWorker.register("sw.js").catch(()=>{})}catch(e){}
})();
</script>

</body></html>
