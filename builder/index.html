<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#edecea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Builder">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Hanken+Grotesk:wght@400;500;600;700&family=IBM+Plex+Mono:wght@400;500;600&display=swap" rel="stylesheet">
<title>Builder Board</title>
<style>
  /* Suite identity. Every project in one of four states; tap a project to see what it does and what lives inside it. */
  :root{
    --bg:#edecea; --surface:#fcfcfb; --surface-2:#e5e4e1; --line:#dad9d4;
    --ink:#19191b; --muted:#84847e; --accent:#19191b; --accent-ink:#fcfcfb;
    --building:#9a7a39; --live:#49705c; --idea:#5a6b86; --parked:#9a918a;
    --display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
    --sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#161618; --surface:#1f1f22; --surface-2:#282829; --line:#34343a;
      --ink:#efefe9; --muted:#9a9a92; --accent:#efefe9; --accent-ink:#161618;
      --building:#d2a65f; --live:#8fb3a0; --idea:#9fb0cd; --parked:#9a918a; color-scheme:dark; }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;
    padding:max(18px,env(safe-area-inset-left)) max(18px,env(safe-area-inset-right));
    padding-block:34px calc(env(safe-area-inset-bottom) + 24px)}
  .wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
  header{padding:0 2px}
  .eyebrow{font-size:.66rem;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);font-weight:600}
  header h1{font-family:var(--display);font-weight:600;font-size:2.7rem;line-height:.95;letter-spacing:-.01em;margin:.3rem 0 0}
  header .sub{margin:.5rem 0 0;color:var(--muted);font-size:.86rem;font-variant-numeric:tabular-nums}

  .add{display:flex;gap:8px;flex-wrap:wrap}
  .add input{flex:1;min-width:150px;font:inherit;font-size:.95rem;padding:11px 14px;border:1px solid var(--line);
    border-radius:12px;background:var(--surface);color:var(--ink);outline:none}
  .add input:focus{border-color:var(--ink)}
  .add select,.add button{font:inherit;font-weight:600;font-size:.8rem;border-radius:12px;padding:11px 14px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink);cursor:pointer}
  .add button{background:var(--accent);color:var(--accent-ink);border-color:transparent;letter-spacing:.04em}

  .col{display:flex;flex-direction:column;gap:10px}
  .col + .col{margin-top:12px}
  .col-head{display:flex;align-items:center;gap:10px;padding:6px 2px;width:100%;background:none;border:none;margin:0;
    font:inherit;color:inherit;text-align:left;cursor:pointer;border-radius:10px}
  .col-head:focus-visible{outline:2px solid var(--ink);outline-offset:2px}
  .col-head .chev{margin-left:auto;transform:rotate(45deg)}
  .col.shut .col-head .chev{transform:rotate(-45deg)}
  .col.shut .card,.col.shut .empty{display:none}
  .col-head .peek{color:var(--muted);font-size:.74rem;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;flex:1}
  .col:not(.shut) .col-head .peek{display:none}
  .col-head .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .col-head h2{font-family:var(--display);font-weight:600;font-size:1.45rem;margin:0}
  .col-head .n{color:var(--muted);font-size:.82rem;font-variant-numeric:tabular-nums}
  .dot.building{background:var(--building)} .dot.live{background:var(--live)}
  .dot.idea{background:var(--idea)} .dot.parked{background:var(--parked)}

  .card{background:var(--surface);border:1px solid var(--line);border-radius:14px;padding:13px 15px;
    box-shadow:0 1px 2px rgba(20,16,10,.03)}
  .card.open{border-color:color-mix(in srgb,var(--ink) 25%,var(--line))}
  .head{display:flex;gap:10px;align-items:center}
  .toggle{flex:1;min-width:0;display:flex;align-items:center;gap:9px;background:none;border:none;padding:4px 0;
    margin:0;text-align:left;font:inherit;color:inherit;cursor:pointer}
  .toggle:focus-visible{outline:2px solid var(--ink);outline-offset:3px;border-radius:6px}
  .chev{flex:0 0 auto;width:8px;height:8px;border-right:1.5px solid var(--muted);border-bottom:1.5px solid var(--muted);
    transform:rotate(-45deg);transition:transform .15s}
  .open .chev{transform:rotate(45deg)}
  .ttl{font-weight:600;font-size:1rem;min-width:0;overflow-wrap:anywhere}
  .inside{flex:0 0 auto;font-size:.7rem;color:var(--muted);font-weight:500;white-space:nowrap}
  .ctl{display:flex;gap:4px;align-items:center;flex:0 0 auto}
  .ctl select{font:inherit;font-size:.68rem;font-weight:600;border-radius:999px;padding:5px 8px;border:1px solid var(--line);
    background:var(--surface-2);color:var(--ink);cursor:pointer;text-transform:uppercase;letter-spacing:.04em}
  .del{border:none;background:none;color:var(--muted);font-size:1.15rem;line-height:1;cursor:pointer;padding:2px 4px}
  .del:hover{color:var(--ink)}

  .panel{margin-top:12px;padding-top:12px;border-top:1px solid var(--line);display:flex;flex-direction:column;gap:10px}
  .summary{margin:0;font-size:.9rem;line-height:1.6;color:var(--ink)}
  .summary.none{color:var(--muted);font-style:italic}
  .links{display:flex;gap:14px;align-items:center;flex-wrap:wrap}
  .open-link{font-size:.76rem;font-weight:600;color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
  .edit{background:none;border:none;color:var(--muted);font:inherit;font-size:.74rem;cursor:pointer;padding:0;border-bottom:1px dotted var(--muted)}
  .subhead{font-size:.62rem;letter-spacing:.2em;text-transform:uppercase;color:var(--muted);font-weight:600;margin-top:4px}
  .subs{display:flex;flex-direction:column;gap:10px;padding-left:12px;border-left:2px solid var(--surface-2)}
  .subitem .t{font-weight:600;font-size:.88rem;color:var(--ink);text-decoration:none}
  a.t{border-bottom:1px solid var(--line)}
  .subitem .f{font-size:.8rem;color:var(--muted);line-height:1.5;margin-top:1px}
  textarea{width:100%;font:inherit;font-size:.88rem;line-height:1.5;border:1px solid var(--line);border-radius:10px;padding:10px 12px;
    background:var(--surface);color:var(--ink);min-height:84px;resize:vertical;outline:none}
  textarea:focus{border-color:var(--ink)}
  .save{align-self:flex-start;font:inherit;font-weight:600;font-size:.74rem;letter-spacing:.04em;border-radius:10px;padding:8px 14px;
    border:none;background:var(--accent);color:var(--accent-ink);cursor:pointer}
  .empty{color:var(--muted);font-size:.84rem;font-style:italic;padding:4px 2px}

  /* Mission Control: a dark ops inset, deliberately identical in both themes */
  :root{ --mc-bg:#111214; --mc-line:#26282c; --mc-ink:#dfe3dc; --mc-dim:#80868d;
    --ok:#46d37f; --warn:#f2b24c; --bad:#ff5f56; --info:#5fa8ff; --off:#5d636b;
    --mono:"IBM Plex Mono",ui-monospace,"SF Mono",Menlo,Consolas,monospace; }
  .mc{background-color:var(--mc-bg);color:var(--mc-ink);border:1px solid var(--mc-line);border-radius:18px;
    padding:14px 16px 12px;font-family:var(--mono);box-shadow:0 18px 40px -28px rgba(0,0,0,.6);
    background-image:linear-gradient(rgba(255,255,255,.022) 1px,transparent 1px);background-size:100% 26px}
  .mc-head{display:flex;align-items:center;gap:10px;padding-bottom:10px;border-bottom:1px solid var(--mc-line)}
  .mc-title{font-size:.66rem;letter-spacing:.24em;text-transform:uppercase;color:var(--mc-dim);font-weight:600}
  .mc-sum{margin-left:auto;font-size:.7rem;font-weight:600;letter-spacing:.08em;text-transform:uppercase;color:var(--mc-dim)}
  .mc-sum.ok{color:var(--ok)} .mc-sum.warn{color:var(--warn)} .mc-sum.bad{color:var(--bad)}
  .mc-ref{background:none;border:1px solid var(--mc-line);color:var(--mc-dim);border-radius:8px;width:30px;height:28px;
    cursor:pointer;font-family:var(--mono);font-size:.85rem;line-height:1}
  .mc-ref:hover{color:var(--mc-ink);border-color:var(--mc-dim)}
  .mc-ref:focus-visible{outline:2px solid var(--mc-ink);outline-offset:2px}
  .mc-rows{display:flex;flex-direction:column}
  .mc-row{display:grid;grid-template-columns:auto 1fr;column-gap:11px;row-gap:1px;padding:9px 0;border-bottom:1px dashed var(--mc-line)}
  .mc-row .lt{grid-row:1 / 3;align-self:center}
  .mc-name{font-size:.8rem;font-weight:500;color:var(--mc-ink)}
  .mc-read{font-size:.72rem;color:var(--mc-dim);overflow-wrap:anywhere}
  .mc-foot{font-size:.62rem;color:var(--mc-dim);letter-spacing:.03em;padding-top:9px;font-variant-numeric:tabular-nums}
  .lt{display:inline-block;width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .lt.green{background:var(--ok);box-shadow:0 0 8px var(--ok)}
  .lt.amber{background:var(--warn);box-shadow:0 0 8px var(--warn)}
  .lt.red{background:var(--bad);box-shadow:0 0 10px var(--bad);animation:mcpulse 1.6s ease-in-out infinite}
  .lt.info{background:var(--info);box-shadow:0 0 8px var(--info)}
  .lt.grey{background:var(--off)}
  @keyframes mcpulse{50%{opacity:.4}}
  @media (prefers-reduced-motion:reduce){ .lt.red{animation:none} }
  .hdot{flex:0 0 auto;width:7px;height:7px;border-radius:50%}
  .hdot.green{background:var(--ok)} .hdot.amber{background:var(--warn)} .hdot.red{background:var(--bad)} .hdot.info{background:var(--info)}
  .st-row{display:flex;gap:9px;align-items:center;font-size:.8rem;color:var(--muted);line-height:1.4}

  footer{color:var(--muted);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;text-align:center;padding-top:6px}
  footer a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Fieldwork</div>
    <h1>Builder Board</h1>
    <div class="sub" id="sub"></div>
  </header>

  <section class="mc" id="mc" aria-label="Mission Control"></section>

  <div class="add">
    <input id="newTitle" type="text" placeholder="New project…" maxlength="60">
    <select id="newStatus" aria-label="Status">
      <option value="building">Building</option>
      <option value="live">Live</option>
      <option value="idea">Idea</option>
      <option value="parked">Parked</option>
    </select>
    <button id="addBtn">Add</button>
  </div>

  <div id="board"></div>

  <footer>Builder v1.5.5 · <a href="../dashboard/">Command Center</a> · <a href="../">Fieldwork</a></footer>
</div>

<script>
const $ = s => document.querySelector(s);
const KEY = "builder.v1";
const SEED_VERSION = 2;
const COLS = [
  // name = section heading (a place); label = the state you set on a card
  {id:"building", name:"Building",  label:"Building"},
  {id:"live",     name:"Live",      label:"Live"},
  {id:"idea",     name:"Ideas",     label:"Idea"},
  {id:"parked",   name:"Graveyard", label:"Parked"},
];
const uid = () => Math.random().toString(36).slice(2,9);

/* Seeded projects. Summaries and sub-projects refresh from here on each load;
   status, deletions and any summary you edit yourself are kept. */
const SEED = [
  {key:"mirror", title:"Mirror", status:"building", url:"../mirror/",
   summary:"On-device facial analysis (v2.0). Maps 478 landmarks plus a hair/skin segmenter for the real hairline, measures proportions, symmetry, skin and profile angles, and ranks you against your own sex in a 5,500-face rated dataset. The percentile explains about a third of rated attractiveness and is calibrated on mostly East Asian and white faces rated in China, so it's a rough indicator, not a verdict. On hold: the next real gain needs better-balanced data.",
   children:[
     {title:"Front analysis", summary:"Facial thirds from the detected hairline, face width, eye spacing, lip position, symmetry, skin, plus canthal tilt, eye openness, width-to-height, jaw width and lip ratio. Head tilt is corrected and the overlay follows your face."},
     {title:"Photos & cropping", summary:"Pick up to 8 photos to average out angle and lighting; auto-zoom on small faces; crop any single photo from its thumbnail."},
     {title:"Score", summary:"Separate men's and women's models (once the per-sex refit is committed), a percentile within your sex, and 'what's moving it' per marker."},
     {title:"Side-profile mode", summary:"Nasofrontal, nasolabial and nasomental angles plus facial convexity, traced on a true side photo."},
     {title:"Benchmark tooling", summary:"mirror/tools: run_benchmark.py downloads SCUT-FBP5500 and the models; train_score.py extracts the exact markers Mirror uses and writes mirror/score_model.json."},
   ]},
  {key:"receipts", title:"Receipts (X account)", status:"building", url:"",
   summary:"An X account that answers whatever people are arguing about with the actual data: the claim, the primary-source number, one sharp line. You post; Claude researches, fact-checks and drafts. Next: pick the handle, then 30 days of 2–4 posts a weekday before judging anything.",
   children:[
     {title:"Playbook doc", summary:"Angle, voice, five post formats, approved primary data sources, algorithm rules, daily workflow and the scoreboard."},
     {title:"Daily draft deck", summary:"Weekdays 7:13 AM ET: 5–8 fact-checked post drafts plus reply drafts in a new doc, with a push notification."},
     {title:"Weekly review", summary:"Sundays 6:43 PM ET: reads the scoreboard and reports which formats, topics and hooks worked."},
   ]},
  {key:"dashboard", title:"Command Center", status:"building", url:"../dashboard/",
   summary:"One screen that reads every app's saved data and shows a live tile per app. It works, but it only shows counts, so it needs a rethink to surface what to act on.",
   children:[]},

  {key:"fieldwork", title:"Fieldwork", status:"live", url:"../",
   summary:"The home-screen app suite and its root app, Experiment Lab + Side Quests, which turns self-improvement into structured personal experiments and real-world side quests. Every app below lives in the same repo and shares one origin, so they can read each other's data.",
   children:[
     {title:"Experiment Lab + Side Quests", url:"../", summary:"The root app: design personal experiments and get real-world side quests."},
     {title:"data/ folder", summary:"Cross-device files apps publish to the repo, like nemesis.json and brief.json, read instantly through raw GitHub."},
     {title:"fieldwork-app skill", summary:"The saved build spec: repo layout, house style, sync pattern, cache rules, and the build-test loop."},
   ]},
  {key:"cockpit", title:"Morning Cockpit", status:"live", url:"../cockpit/",
   summary:"The screen you open each morning: your three priorities (they carry over until done), where you stand against Nemesis this week with the tracks you're behind on, and today's calendar brief.",
   children:[
     {title:"Morning Brief task", summary:"Scheduled daily at 6:17 AM ET. Reads Google Calendar, triages P1–P4 with an urgency score, writes the brief Doc, and publishes today's calendar to the Cockpit, encrypted so only your turned-on devices can read it."},
     {title:"Nemesis feed", summary:"Reads your weekly standing from data/nemesis.json, so it shows on any device."},
   ]},
  {key:"nemesis", title:"Nemesis", status:"live", url:"../nemesis/",
   summary:"An AI rival that competes with you every week on gym, cardio, CPA hours, chess, cold opens and teach-back. It reacts to each log, locks Sunday at 9 PM, and settles the week in a showdown.",
   children:[
     {title:"Teach-back", summary:"Explain a FAR topic in 60 seconds; graded against the key points."},
     {title:"Strength board", summary:"Estimated one-rep maxes on bench, squat and deadlift against Nemesis's."},
     {title:"Cross-device sync", summary:"Publishes your weekly standing to the repo whenever it changes, using your GitHub token."},
     {title:"Sunday showdown ping", summary:"Scheduled reminder Sundays at 9:05 PM ET to reveal the week."},
   ]},
  {key:"palate", title:"Palate", status:"live", url:"../palate/",
   summary:"A taste model built on your own ratings (Letterboxd, Serializd and manual entries). It predicts how you'd rate any movie, show, book, character or dish and surfaces its top picks.",
   children:[
     {title:"Stremio add-on", summary:"palate/stremio: your top picks show up as a row inside Stremio."},
     {title:"Catalog pipeline", summary:"palate/pipeline plus a Monday GitHub Action that builds the movie and TV catalog, taste vectors and streaming availability."},
     {title:"Palate lab", summary:"One-off MovieLens and TMDB test data for \"fans of X also liked Y.\""},
     {title:"Second Brain link", summary:"Recipe ratings flow in as dishes; only your favorites go back to Second Brain as notes."},
   ]},
  {key:"dryrun", title:"Dry Run", status:"live", url:"../dryrun/",
   summary:"Rehearse a real upcoming conversation against Claude playing the actual people, live and in character, then get a director's-notes debrief. It's for rehearsal, not prediction.",
   children:[
     {title:"Replay", summary:"The artifact version that runs on your Claude plan with no API key, pinned to your sidebar."},
   ]},
  {key:"brain", title:"Second Brain", status:"live", url:"../brain/",
   summary:"Your personal knowledge base as a home-screen app, with Obsidian-style [[links]], backlinks, graph and canvases. Hand-written notes now match Claude's: templates, strength meters and auto-linking on save. Next: sync notes as Markdown to a private repo so Claude (and a future Jarvis) can read them.",
   children:[
     {title:"Templates", summary:"Any note tagged #template shows under 'Start from' on a new, empty note and fills headings, tags, folder and section."},
     {title:"Strength meters", summary:"Lines like 'Evidence: 3/5' or 'Potency: ●●●○○' render as dot meters."},
     {title:"Auto-linking", summary:"Done links mentions of other notes' titles, and links back from notes that mention this one; suggested tags from the folder."},
     {title:"Esoteric journal", summary:"Lesser-known remedies and supplements with benefits and uses, organized by searchable tags."},
     {title:"Kitchen codex", summary:"A linked note ecosystem for cooking techniques and recipes."},
     {title:"Palate link", summary:"Recipe ratings feed Palate; its favorites come back as notes."},
   ]},
  {key:"nba", title:"NBA Fair Lines", status:"live", url:"",
   summary:"A model that computes fair lines and picks, compares them to live odds across sportsbooks, and tracks every hit and miss. Audited Nov 4: no edge yet (191 calls, −16% ROI, beats the close 41%); the line-shopping module is the promising part. Hourly publishing is paused until the rebuild.",
   children:[
     {title:"Model repo", summary:"Private francis1-glitch/nba-model. GitHub Actions run the model and commit the data."},
     {title:"Hourly publish task", summary:"Paused Nov 4 to save Claude usage; turn it back on (or set it to game hours) when the model work resumes."},
     {title:"Model audit", summary:"The Nov 4 audit doc: live record, closing-line value, backtest, what breaks, and the ranked revise-and-enhance plan."},
     {title:"Dashboard", summary:"A private Claude artifact showing fair lines, picks, and the edge at each book."},
   ]},
  {key:"greekpath", title:"GreekPath", status:"live", url:"",
   summary:"A full-stack Greek-life compliance platform built to replace Penn State's general-purpose tool for officers tracking 60+ chapters: rosters, incidents, event approvals, documents, analytics, and role-based access.",
   children:[
     {title:"Stack", summary:"React, Node/Express, PostgreSQL on Neon, JWT auth, deployed on Render."},
   ]},
  {key:"skills", title:"Accounting skills library", status:"live", url:"",
   summary:"Your \"every-accounting calculator\": 20+ accounting skills saved to your Claude account so any function is one ask away, from leases and revenue to tax provisions, consolidations and audit sampling.",
   children:[
     {title:"Calculation-heavy", summary:"ASC 842 lessee, ASC 606, ASC 740, bonds and debt, EPS, stock comp, equity method, consolidations, cash flow, business combinations, impairment."},
     {title:"Partly calculated", summary:"Close schedules, bank reconciliation, audit sampling, governmental, nonprofit."},
     {title:"Judgment-heavy", summary:"Accounting memo, journal-entry review, flux analysis, QuickBooks cleanup, Excel workpaper."},
   ]},
  {key:"skilllab", title:"Skill Lab", status:"live", url:"",
   summary:"Your \"dreaming\" loop. A weekly run blind-tests your skills, turns logged corrections into test cases, and proposes one edit only if it scores higher with no regressions. The pilot is ASC 842 lessee.",
   children:[
     {title:"ASC 842 test suite", summary:"21 lease cases with an answer key computed in code; the blind test-taker never sees the key."},
     {title:"skill-feedback (\"log it\")", summary:"Say \"log it\" when an answer is off and the correction goes into the feedback log."},
     {title:"skill-improver", summary:"Runs the loop: feedback to tests, blind baseline, one edit, re-test for regressions."},
     {title:"Weekly improver task", summary:"Scheduled Sundays at 7:37 PM ET."},
     {title:"Skill Lab doc", summary:"Where the feedback log, test suites and run history live."},
   ]},
  {key:"agents", title:"Briefing agents", status:"live", url:"",
   summary:"Scheduled Claude runs that work unattended and leave finished docs for you.",
   children:[
     {title:"Morning Brief", summary:"Daily at 6:17 AM ET: calendar triage with an urgency score; also feeds the Cockpit."},
     {title:"CPA Exam Section Tracker", summary:"Mondays: score release dates, credit-window countdown, and your next section."},
     {title:"CPA & Accounting News Roundup", summary:"Mondays: standard setters, IRS, licensure, and Big 4 news from the past week."},
     {title:"Big 4 Job Tracker", summary:"Mondays: openings that fit your background, plus recruiting events."},
   ]},
  {key:"builder", title:"Builder Board", status:"live", url:"./",
   summary:"This board (v1.5): every project, its state, what it does and what lives inside it, with Mission Control on top running live health checks. Categories fold to keep the page short. Next: monitor the scheduled tasks and the NBA model, which Mission Control can't see yet.",
   children:[
     {title:"Mission Control", summary:"Live checks for site deploys, the Morning Brief feed, Nemesis sync, Mirror's score model and the Palate workflows."},
     {title:"Collapsible categories", summary:"Building, Live, Ideas and Graveyard fold open or shut, showing a one-line peek of project names when folded; remembered per device."},
     {title:"builder-sync skill", summary:"When you say you're done with a project for the moment, Claude rewrites its card here from what changed that session."},
   ]},

  {key:"launchkit", title:"Bookkeeping launch kit", status:"idea", url:"",
   summary:"Everything needed to quote and sign a client the day the ProAdvisor listing goes live. Next: build it while the profile review finishes.",
   children:[
     {title:"Price sheet", summary:"Three fixed-price packages (cleanup, monthly, setup) and the questions that place a lead in one."},
     {title:"Engagement letter", summary:"Scope, fee, deposit, and what's excluded (tax, audit, legal advice)."},
     {title:"Intake checklist", summary:"Statements, logins and prior returns to collect before starting."},
     {title:"Lead replies", summary:"First response, quote and follow-up templates so leads get a fast answer."},
   ]},
  {key:"wifiradar", title:"Wi-Fi Radar", status:"idea", url:"",
   summary:"Presence and motion sensing in your own space from Wi-Fi signal disturbances, using 2–3 cheap ESP32 boards running open-source CSI tools. Realistic goal: which room has someone in it and when they move, not silhouettes. Your router alone can't do it: consumer routers don't expose the signal data.",
   children:[
     {title:"Hardware", summary:"ESP32 boards (about $10 each) flashed with CSI capture firmware, placed around one room first."},
     {title:"Ground rules", summary:"Own space only; never used to sense people who don't know about it."},
   ]},
  {key:"jarvis", title:"Jarvis", status:"idea", url:"",
   summary:"A phone assistant layered over your own apps (Fieldwork, Nemesis, the NBA model) with Claude as the brain.",
   children:[]},
  {key:"recall", title:"Recall", status:"idea", url:"",
   summary:"An elite-memory trainer: memory palaces, the major system, faces and names, timed drills, applied to FAR formulas and networking names.",
   children:[]},

  {key:"negotiator", title:"Negotiator", status:"parked", url:"",
   summary:"A negotiation trainer. An AI counterpart with a hidden bottom line, scoring on value captured, plus prep for real negotiations like a Big 4 offer.",
   children:[]},
  {key:"redflag", title:"Red Flag Radar", status:"parked", url:"",
   summary:"A misstatement-risk scanner over SEC filings on EDGAR, framed as risk flags rather than fraud calls. Public data only.",
   children:[]},
];
const V1_KEYS = ["mirror","dashboard","cockpit","nemesis","palate","dryrun","brain","nba","greekpath","skilllab","jarvis","recall","negotiator","redflag"];
const clone = o => JSON.parse(JSON.stringify(o));

function freshSeed(){
  return { v:SEED_VERSION, seeded:SEED.map(s=>s.key), items:SEED.map(s => Object.assign(clone(s), {id:uid()})) };
}
function load(){
  let s = null;
  try{ s = JSON.parse(localStorage.getItem(KEY) || "null"); }catch(e){}
  if(!s || !Array.isArray(s.items)) { s = freshSeed(); save(s); return s; }
  if((s.v || 1) < SEED_VERSION){
    // first version had no keys: match seeded projects by title, and treat all of them as already seeded
    s.seeded = Array.isArray(s.seeded) ? s.seeded : V1_KEYS.slice();
    for(const it of s.items){
      if(!it.key){ const m = SEED.find(x => x.title.toLowerCase() === String(it.title).toLowerCase()); if(m) it.key = m.key; }
    }
    s.v = SEED_VERSION;
  }
  if(!Array.isArray(s.seeded)) s.seeded = [];
  // add seed projects that were never seeded before (deleted ones stay deleted)
  for(const sd of SEED){
    if(!s.seeded.includes(sd.key)){ s.items.push(Object.assign(clone(sd), {id:uid()})); s.seeded.push(sd.key); }
  }
  // refresh seeded descriptions; keep status and anything you edited
  for(const it of s.items){
    const sd = it.key && SEED.find(x => x.key === it.key);
    if(sd){
      if(!it.summaryEdited) it.summary = sd.summary;
      it.children = clone(sd.children || []);
      if(!it.url) it.url = sd.url || "";
    } else if(!it.summary && it.note){ it.summary = it.note; }
    delete it.note;
  }
  save(s);
  return s;
}
function save(s){ try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){} }
let state = load();
const openIds = new Set();
/* Collapsed categories, remembered per device. Building starts open; the rest start folded. */
const UI_KEY = "builder.ui";
const ui = (() => { try{ return JSON.parse(localStorage.getItem(UI_KEY)) || {}; }catch(e){ return {}; } })();
if(!ui.shut) ui.shut = { live:true, idea:true, parked:true };
const saveUI = () => { try{ localStorage.setItem(UI_KEY, JSON.stringify(ui)); }catch(e){} };
const editing = new Set();

function esc(s){ return String(s == null ? "" : s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function render(){
  const board = $("#board"); board.innerHTML = "";
  let total = 0;
  for(const col of COLS){
    const items = state.items.filter(i => i.status === col.id);
    total += items.length;
    const shut = !!ui.shut[col.id];
    const wrap = document.createElement("div"); wrap.className = "col" + (shut ? " shut" : "");
    const peek = items.map(i => i.title).join(" · ");
    wrap.innerHTML = '<button class="col-head" aria-expanded="'+(!shut)+'"><span class="dot '+col.id+'"></span><h2>'+col.name+'</h2><span class="n">'+items.length+'</span>'
      + '<span class="peek">'+esc(peek)+'</span><span class="chev" aria-hidden="true"></span></button>';
    wrap.querySelector(".col-head").addEventListener("click", () => { ui.shut[col.id] = !ui.shut[col.id]; saveUI(); render(); });
    if(!items.length){ const e = document.createElement("div"); e.className = "empty"; e.textContent = "—"; wrap.append(e); }
    for(const it of items) wrap.append(cardFor(it));
    board.append(wrap);
  }
  $("#sub").textContent = total + (total === 1 ? " project" : " projects") + " · tap one to see what it does";
}

function cardFor(it){
  const isOpen = openIds.has(it.id);
  const kids = Array.isArray(it.children) ? it.children : [];
  const card = document.createElement("div"); card.className = "card" + (isOpen ? " open" : "");
  const opts = COLS.map(c => '<option value="'+c.id+'"'+(c.id === it.status ? " selected" : "")+'>'+c.label+'</option>').join("");
  card.innerHTML =
    '<div class="head">' +
      '<button class="toggle" aria-expanded="'+isOpen+'"><span class="chev"></span><span class="ttl">'+esc(it.title)+'</span>' +
        (health[it.key] && health[it.key] !== "grey" ? '<span class="hdot '+health[it.key]+'" title="Mission Control: '+health[it.key]+'"></span>' : '') +
        (kids.length ? '<span class="inside">'+kids.length+' inside</span>' : '') + '</button>' +
      '<div class="ctl"><select aria-label="Move '+esc(it.title)+'">'+opts+'</select>' +
      '<button class="del" aria-label="Delete '+esc(it.title)+'">×</button></div>' +
    '</div>';
  card.querySelector(".toggle").onclick = () => { isOpen ? openIds.delete(it.id) : openIds.add(it.id); render(); };
  card.querySelector("select").onchange = e => { it.status = e.target.value; ui.shut[it.status] = false; saveUI(); save(state); render(); };
  card.querySelector(".del").onclick = () => { state.items = state.items.filter(x => x.id !== it.id); save(state); render(); };
  if(isOpen) card.append(panelFor(it, kids));
  return card;
}

function panelFor(it, kids){
  const p = document.createElement("div"); p.className = "panel";
  const isEditing = editing.has(it.id) || !it.summary;
  if(isEditing){
    const ta = document.createElement("textarea");
    ta.id = "sum-" + it.id; ta.value = it.summary || ""; ta.placeholder = "What does this project do?";
    const sv = document.createElement("button"); sv.className = "save"; sv.textContent = "Save";
    sv.onclick = () => { it.summary = ta.value.trim(); it.summaryEdited = true; editing.delete(it.id); save(state); render(); };
    p.append(ta, sv);
  } else {
    const sm = document.createElement("p"); sm.className = "summary"; sm.textContent = it.summary; p.append(sm);
  }
  const mine = checks.filter(c => c.keys.includes(it.key));
  if(mine.length){
    p.insertAdjacentHTML("beforeend", '<div class="subhead">Status</div>' +
      mine.map(c => '<div class="st-row"><span class="lt '+c.state+'"></span><span>'+esc(c.name)+' · '+esc(c.text)+'</span></div>').join(""));
  }
  const links = document.createElement("div"); links.className = "links";
  if(it.url) links.insertAdjacentHTML("beforeend", '<a class="open-link" href="'+esc(it.url)+'">Open '+esc(it.title)+' →</a>');
  if(!isEditing){
    const ed = document.createElement("button"); ed.className = "edit"; ed.textContent = "Edit summary";
    ed.onclick = () => { editing.add(it.id); render(); };
    links.append(ed);
  }
  if(links.childNodes.length) p.append(links);
  if(kids.length){
    p.insertAdjacentHTML("beforeend", '<div class="subhead">Inside</div>');
    const subs = document.createElement("div"); subs.className = "subs";
    for(const k of kids){
      const t = k.url ? '<a class="t" href="'+esc(k.url)+'">'+esc(k.title)+'</a>' : '<span class="t">'+esc(k.title)+'</span>';
      subs.insertAdjacentHTML("beforeend", '<div class="subitem">'+t+'<div class="f">'+esc(k.summary)+'</div></div>');
    }
    p.append(subs);
  }
  return p;
}

/* ---------- Mission Control: is the machinery behind each project actually running? ---------- */
const GH = (() => {
  const parts = location.pathname.split("/").filter(Boolean).filter(p => !/\.html$/.test(p));
  return /\.github\.io$/.test(location.hostname)
    ? { owner: location.hostname.split(".")[0], repo: parts[0] || "" }
    : { owner: "francis1-glitch", repo: "fieldwork" };   // local preview
})();
const API = "https://api.github.com/repos/" + GH.owner + "/" + GH.repo;
const RAWURL = p => "https://raw.githubusercontent.com/" + GH.owner + "/" + GH.repo + "/main/" + p + "?ts=" + Date.now();
const RANK = { red:4, amber:3, info:2, green:1, grey:0 };
let checks = [], health = {}, checkedAt = null, scanning = false;

async function ghJSON(path){
  const ck = "mc:" + path;
  try{ const c = JSON.parse(sessionStorage.getItem(ck) || "null"); if(c && Date.now() - c.t < 120000) return c.d; }catch(e){}
  const r = await fetch(API + path, { headers:{ Accept:"application/vnd.github+json" } });
  if(r.status === 403 || r.status === 429) throw new Error("rate");
  if(!r.ok) throw new Error("http");
  const d = await r.json();
  try{ sessionStorage.setItem(ck, JSON.stringify({ t:Date.now(), d })); }catch(e){}
  return d;
}
async function rawJSON(path){
  try{ const r = await fetch(RAWURL(path), { cache:"no-store" });
    if(r.status === 404) return { missing:true }; if(!r.ok) return null; return await r.json(); }catch(e){ return null; }
}
function ago(ts){
  const s = Math.max(0, (Date.now() - new Date(ts).getTime()) / 1000);
  if(s < 90) return "just now"; const m = s / 60; if(m < 60) return Math.round(m) + "m ago";
  const h = m / 60; if(h < 36) return Math.round(h) + "h ago"; return Math.round(h / 24) + "d ago";
}
function etNow(){
  const f = new Intl.DateTimeFormat("en-CA", { timeZone:"America/New_York", year:"numeric", month:"2-digit", day:"2-digit", hour:"2-digit", minute:"2-digit", hour12:false });
  const p = Object.fromEntries(f.formatToParts(new Date()).map(x => [x.type, x.value]));
  return { date: p.year + "-" + p.month + "-" + p.day, mins: (Number(p.hour) % 24) * 60 + Number(p.minute) };
}

async function checkDeploys(){
  const d = await ghJSON("/actions/runs?per_page=10");
  const runs = (d.workflow_runs || []).filter(r => r.name === "pages build and deployment");
  if(!runs.length) return { state:"grey", text:"no deploys found" };
  const r = runs[0], mins = (Date.now() - new Date(r.created_at)) / 60000;
  if(r.status !== "completed") return mins > 15
    ? { state:"amber", text:"deploy stuck · queued " + Math.round(mins) + "m" }
    : { state:"info", text:"deploying now" };
  if(r.conclusion === "success") return { state:"green", text:"live · deployed " + ago(r.updated_at || r.created_at) };
  if(r.conclusion === "cancelled"){
    const ok = runs.find(x => x.conclusion === "success");
    return { state:"amber", text:"last deploy cancelled" + (ok ? " · last good " + ago(ok.updated_at) : "") };
  }
  return { state:"red", text:"deploy failed · " + ago(r.created_at) };
}
async function checkWorkflow(file, weekly){
  const d = await ghJSON("/actions/workflows/" + file + "/runs?per_page=1");
  const r = (d.workflow_runs || [])[0];
  if(!r) return { state:"grey", text:"never run" };
  if(r.status !== "completed") return { state:"info", text:"running now" };
  if(r.conclusion !== "success") return { state: weekly ? "red" : "amber", text:"last run " + r.conclusion + " · " + ago(r.created_at) };
  if(weekly && (Date.now() - new Date(r.created_at)) / 864e5 > 8) return { state:"amber", text:"overdue · last ran " + ago(r.created_at) };
  return { state: weekly ? "green" : "grey", text: (weekly ? "ok · ran " : "idle · last run ") + ago(r.created_at) };
}
async function checkBrief(){
  const b = await rawJSON("data/brief.json");
  if(b === null) return { state:"grey", text:"couldn't check" };
  if(b.missing) return { state:"amber", text:"not published yet · runs daily 6:17 AM ET" };
  const et = etNow(), n = b.n != null ? b.n : Array.isArray(b.events) ? b.events.length : 0;
  if(b.locked === "no-devices" && b.date === et.date) return { state:"amber", text:"published, but no device can read it · turn on a device in Cockpit" };
  if(b.date === et.date) return { state:"green", text:"today's brief live" + (b.v === 2 ? " (sealed)" : "") + " · " + n + (n === 1 ? " event" : " events") };
  if(et.mins < 7 * 60 + 15) return { state:"grey", text:"waiting on the 6:17 AM run · last " + b.date };
  return { state:"red", text:"today's brief missing · last " + b.date };
}
async function checkMirror(){
  const m = await rawJSON("mirror/score_model.json");
  if(m === null) return { state:"grey", text:"couldn't check" };
  if(m.missing) return { state:"amber", text:"no score model · run mirror/tools/run_benchmark.py" };
  if(m.by_sex) return { state:"green", text:`per-sex models · men r ${m.by_sex.m.r_test.toFixed(2)} · women r ${m.by_sex.f.r_test.toFixed(2)}` };
  return { state:"info", text:`shared model · r ${Number(m.r_test).toFixed(2)} · per-sex refit not committed yet` };
}
async function checkNemesis(){
  const s = await rawJSON("data/nemesis.json");
  if(s === null) return { state:"grey", text:"couldn't check" };
  if(s.missing) return { state:"amber", text:"not syncing yet · turn on sync in Nemesis" };
  const stale = (Date.now() - s.updatedAt) / 864e5 > 8;
  const st = s.pre ? "preseason" : "S" + s.season + " W" + s.week + " · you " + s.youWins + "–" + s.nemWins;
  return { state: stale ? "amber" : "green", text: (stale ? "stale · " : "synced ") + ago(s.updatedAt) + " · " + st };
}
const CHECKS = [
  { keys:["fieldwork"],        name:"Site deploys",       run: checkDeploys },
  { keys:["cockpit","agents"], name:"Morning Brief feed", run: checkBrief },
  { keys:["nemesis"],          name:"Nemesis sync",       run: checkNemesis },
  { keys:["mirror"],           name:"Mirror score model", run: checkMirror },
  { keys:["palate"],           name:"Palate catalog",     run: () => checkWorkflow("palate-catalog.yml", true) },
  { keys:["palate"],           name:"Palate lab",         run: () => checkWorkflow("palate-lab.yml", false) },
];

async function runChecks(force){
  if(scanning) return; scanning = true;
  if(force){ try{ Object.keys(sessionStorage).filter(k => k.startsWith("mc:")).forEach(k => sessionStorage.removeItem(k)); }catch(e){} }
  renderMC();
  checks = await Promise.all(CHECKS.map(async c => {
    try{ return Object.assign({}, c, await c.run()); }
    catch(e){ return Object.assign({}, c, { state:"grey", text: e.message === "rate" ? "GitHub rate limit · try again later" : "couldn't check" }); }
  }));
  health = {};
  for(const c of checks) for(const k of c.keys) if(!(k in health) || RANK[c.state] > RANK[health[k]]) health[k] = c.state;
  checkedAt = new Date(); scanning = false;
  renderMC(); render();
}
function renderMC(){
  const el = $("#mc");
  const bad = checks.filter(c => c.state === "red").length, warn = checks.filter(c => c.state === "amber").length;
  const issues = bad + warn;
  const sum = scanning && !checks.length ? '<span class="mc-sum">scanning…</span>'
    : issues ? '<span class="mc-sum ' + (bad ? "bad" : "warn") + '">' + issues + (issues === 1 ? " issue" : " issues") + '</span>'
    : '<span class="mc-sum ok">all systems nominal</span>';
  const rows = checks.length
    ? checks.map(c => '<div class="mc-row"><span class="lt ' + c.state + '"></span><span class="mc-name">' + esc(c.name) + '</span><span class="mc-read">' + esc(c.text) + '</span></div>').join("")
    : '<div class="mc-row"><span class="lt grey"></span><span class="mc-name">Running checks</span><span class="mc-read">…</span></div>';
  const t = checkedAt ? checkedAt.toLocaleTimeString([], { hour:"numeric", minute:"2-digit" }) : "—";
  el.innerHTML =
    '<div class="mc-head"><span class="mc-title">Mission Control</span>' + sum +
    '<button class="mc-ref" id="mcRef" aria-label="Run checks again">' + (scanning ? "…" : "↻") + '</button></div>' +
    '<div class="mc-rows">' + rows + '</div>' +
    '<div class="mc-foot">checked ' + t + ' · scheduled tasks + NBA model not monitored yet</div>';
  $("#mcRef").onclick = () => runChecks(true);
}

function add(){
  const t = $("#newTitle").value.trim(); if(!t) return;
  const it = { id:uid(), title:t, summary:"", url:"", status:$("#newStatus").value, children:[] };
  state.items.unshift(it); openIds.add(it.id); ui.shut[it.status] = false; saveUI();
  save(state); $("#newTitle").value = ""; render();
  const ta = document.getElementById("sum-" + it.id); if(ta) ta.focus();
}
$("#addBtn").onclick = add;
$("#newTitle").addEventListener("keydown", e => { if(e.key === "Enter") add(); });

render();
runChecks(false);
document.addEventListener("visibilitychange", () => { if(!document.hidden) runChecks(false); });

try{ if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{try{r.update();}catch(e){}}).catch(()=>{});
}}catch(e){}
</script>
