<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#edecea">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<meta name="apple-mobile-web-app-title" content="Builder">
<link rel="manifest" href="manifest.json">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:ital,wght@0,500;0,600;1,500&family=Hanken+Grotesk:wght@400;500;600;700&display=swap" rel="stylesheet">
<title>Builder Board</title>
<style>
  /* Suite identity. A build tracker: every project in one of four states, hands-on. */
  :root{
    --bg:#edecea; --surface:#fcfcfb; --surface-2:#e5e4e1; --line:#dad9d4;
    --ink:#19191b; --muted:#84847e; --accent:#19191b; --accent-ink:#fcfcfb;
    --building:#9a7a39; --live:#49705c; --idea:#5a6b86; --parked:#9a918a;
    --display:"Cormorant Garamond",Georgia,"Times New Roman",serif;
    --sans:"Hanken Grotesk",system-ui,-apple-system,"Segoe UI",sans-serif;
    color-scheme:light;
  }
  @media (prefers-color-scheme:dark){
    :root{ --bg:#161618; --surface:#1f1f22; --surface-2:#282829; --line:#34343a;
      --ink:#efefe9; --muted:#9a9a92; --accent:#efefe9; --accent-ink:#161618;
      --building:#d2a65f; --live:#8fb3a0; --idea:#9fb0cd; --parked:#9a918a; color-scheme:dark; }
  }
  *{box-sizing:border-box}
  html,body{margin:0}
  body{background:var(--bg);color:var(--ink);font-family:var(--sans);line-height:1.5;-webkit-font-smoothing:antialiased;
    padding:max(18px,env(safe-area-inset-left)) max(18px,env(safe-area-inset-right));
    padding-block:34px calc(env(safe-area-inset-bottom) + 24px)}
  .wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:22px}
  header{padding:0 2px}
  .eyebrow{font-size:.66rem;letter-spacing:.26em;text-transform:uppercase;color:var(--muted);font-weight:600}
  header h1{font-family:var(--display);font-weight:600;font-size:2.7rem;line-height:.95;letter-spacing:-.01em;margin:.3rem 0 0}
  header .sub{margin:.5rem 0 0;color:var(--muted);font-size:.86rem;font-variant-numeric:tabular-nums}

  .add{display:flex;gap:8px;flex-wrap:wrap}
  .add input{flex:1;min-width:150px;font:inherit;font-size:.95rem;padding:11px 14px;border:1px solid var(--line);
    border-radius:12px;background:var(--surface);color:var(--ink);outline:none}
  .add input:focus{border-color:var(--ink)}
  .add select,.add button{font:inherit;font-weight:600;font-size:.8rem;border-radius:12px;padding:11px 14px;border:1px solid var(--line);
    background:var(--surface);color:var(--ink);cursor:pointer}
  .add button{background:var(--accent);color:var(--accent-ink);border-color:transparent;letter-spacing:.04em}

  .col{display:flex;flex-direction:column;gap:10px}
  .col-head{display:flex;align-items:baseline;gap:10px;padding:0 2px}
  .col-head .dot{width:9px;height:9px;border-radius:50%;flex:0 0 auto}
  .col-head h2{font-family:var(--display);font-weight:600;font-size:1.45rem;margin:0}
  .col-head .n{color:var(--muted);font-size:.82rem;font-variant-numeric:tabular-nums}
  .dot.building{background:var(--building)} .dot.live{background:var(--live)}
  .dot.idea{background:var(--idea)} .dot.parked{background:var(--parked)}

  .card{display:flex;gap:12px;align-items:flex-start;background:var(--surface);border:1px solid var(--line);
    border-radius:14px;padding:13px 15px;box-shadow:0 1px 2px rgba(20,16,10,.03)}
  .card .main{flex:1;min-width:0}
  .card .title{font-weight:600;font-size:1rem;color:var(--ink);text-decoration:none;display:inline-block}
  a.title:hover{border-bottom:1px solid var(--line)}
  .card .note{color:var(--muted);font-size:.82rem;margin-top:2px;word-wrap:break-word}
  .card .ctl{display:flex;flex-direction:column;gap:6px;align-items:flex-end;flex:0 0 auto}
  .card select{font:inherit;font-size:.72rem;font-weight:600;border-radius:999px;padding:5px 9px;border:1px solid var(--line);
    background:var(--surface-2);color:var(--ink);cursor:pointer;text-transform:uppercase;letter-spacing:.04em}
  .card .del{border:none;background:none;color:var(--muted);font-size:1.1rem;line-height:1;cursor:pointer;padding:2px 4px}
  .card .del:hover{color:var(--ink)}
  .empty{color:var(--muted);font-size:.84rem;font-style:italic;padding:4px 2px}

  footer{color:var(--muted);font-size:.64rem;letter-spacing:.14em;text-transform:uppercase;text-align:center;padding-top:6px}
  footer a{color:var(--ink);text-decoration:none;border-bottom:1px solid var(--line)}
</style>
</head>
<body>
<div class="wrap">
  <header>
    <div class="eyebrow">Fieldwork</div>
    <h1>Builder Board</h1>
    <div class="sub" id="sub"></div>
  </header>

  <div class="add">
    <input id="newTitle" type="text" placeholder="New project…" maxlength="60">
    <select id="newStatus" aria-label="Status">
      <option value="building">Building</option>
      <option value="live">Live</option>
      <option value="idea">Idea</option>
      <option value="parked">Parked</option>
    </select>
    <button id="addBtn">Add</button>
  </div>

  <div id="board"></div>

  <footer>Builder v1.0 · <a href="../dashboard/">Command Center</a> · <a href="../">Fieldwork</a></footer>
</div>

<script>
const $ = s => document.querySelector(s);
const KEY = "builder.v1";
const COLS = [
  {id:"building", name:"Building"},
  {id:"live",     name:"Live"},
  {id:"idea",     name:"Ideas"},
  {id:"parked",   name:"Parked"},
];
const uid = () => Math.random().toString(36).slice(2,9);

// Seed with real current projects; the user edits freely from here.
const SEED = { items: [
  {id:uid(), title:"Mirror", note:"facial analysis — benchmarked, adding features", url:"../mirror/", status:"building"},
  {id:uid(), title:"Command Center", note:"needs workshop — make it actually command", url:"../dashboard/", status:"building"},
  {id:uid(), title:"Morning Cockpit", note:"daily driver", url:"../cockpit/", status:"live"},
  {id:uid(), title:"Nemesis", note:"weekly AI rival", url:"../nemesis/", status:"live"},
  {id:uid(), title:"Palate", note:"taste model → Stremio", url:"../palate/", status:"live"},
  {id:uid(), title:"Dry Run", note:"conversation rehearsal", url:"../dryrun/", status:"live"},
  {id:uid(), title:"Second Brain", note:"personal knowledge base", url:"../brain/", status:"live"},
  {id:uid(), title:"NBA Fair Lines", note:"model + hourly dashboard", url:"", status:"live"},
  {id:uid(), title:"GreekPath", note:"Greek-life compliance app", url:"", status:"live"},
  {id:uid(), title:"Skill Lab", note:"self-improving skill library", url:"", status:"live"},
  {id:uid(), title:"Jarvis", note:"phone assistant over your apps", url:"", status:"idea"},
  {id:uid(), title:"Recall", note:"elite-memory trainer", url:"", status:"idea"},
  {id:uid(), title:"Negotiator", note:"negotiation trainer", url:"", status:"parked"},
  {id:uid(), title:"Red Flag Radar", note:"SEC misstatement-risk scanner", url:"", status:"parked"},
] };

function load(){ try{ const s = JSON.parse(localStorage.getItem(KEY)||"null"); if(s && Array.isArray(s.items)) return s; }catch(e){} return SEED; }
function save(s){ try{ localStorage.setItem(KEY, JSON.stringify(s)); }catch(e){} }
let state = load();

function render(){
  const board = $("#board"); board.innerHTML = "";
  let total = 0;
  for(const col of COLS){
    const items = state.items.filter(i => i.status === col.id);
    total += items.length;
    const wrap = document.createElement("div"); wrap.className = "col";
    const head = document.createElement("div"); head.className = "col-head";
    head.innerHTML = '<span class="dot '+col.id+'"></span><h2>'+col.name+'</h2><span class="n">'+items.length+'</span>';
    wrap.append(head);
    if(!items.length){
      const e = document.createElement("div"); e.className = "empty"; e.textContent = "—"; wrap.append(e);
    }
    for(const it of items){
      const card = document.createElement("div"); card.className = "card";
      const titleHtml = it.url
        ? '<a class="title" href="'+it.url+'">'+esc(it.title)+'</a>'
        : '<span class="title">'+esc(it.title)+'</span>';
      const opts = COLS.map(c => '<option value="'+c.id+'"'+(c.id===it.status?' selected':'')+'>'+c.name+'</option>').join("");
      card.innerHTML =
        '<div class="main">'+titleHtml+(it.note?'<div class="note">'+esc(it.note)+'</div>':'')+'</div>' +
        '<div class="ctl"><select aria-label="Move">'+opts+'</select><button class="del" aria-label="Delete">×</button></div>';
      card.querySelector("select").onchange = e => { it.status = e.target.value; save(state); render(); };
      card.querySelector(".del").onclick = () => { state.items = state.items.filter(x => x.id !== it.id); save(state); render(); };
      wrap.append(card);
    }
    board.append(wrap);
    if(col !== COLS[COLS.length-1]) board.append(spacer());
  }
  $("#sub").textContent = total + (total===1?" project":" projects") + " across the board";
}
function spacer(){ const s = document.createElement("div"); s.style.height = "10px"; return s; }
function esc(s){ return String(s).replace(/[&<>"]/g, c => ({"&":"&amp;","<":"&lt;",">":"&gt;",'"':"&quot;"}[c])); }

function add(){
  const t = $("#newTitle").value.trim(); if(!t) return;
  state.items.unshift({ id:uid(), title:t, note:"", url:"", status:$("#newStatus").value });
  save(state); $("#newTitle").value = ""; render();
}
$("#addBtn").onclick = add;
$("#newTitle").addEventListener("keydown", e => { if(e.key === "Enter") add(); });

render();

try{ if("serviceWorker" in navigator){
  navigator.serviceWorker.register("sw.js",{updateViaCache:"none"}).then(r=>{try{r.update();}catch(e){}}).catch(()=>{});
}}catch(e){}
</script>
</body>
</html>
