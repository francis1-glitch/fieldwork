<style>

const SECTIONS = [
  {id:'inbox',     name:'Inbox',     hint:'Captured, not sorted yet'},
  {id:'projects',  name:'Projects',  hint:'Active work with an end date'},
  {id:'areas',     name:'Areas',     hint:'Ongoing parts of your life'},
  {id:'resources', name:'Resources', hint:'Things you want to keep for later'},
  {id:'archive',   name:'Archive',   hint:'Done or inactive'},
];
const SBYID = Object.fromEntries(SECTIONS.map(s=>[s.id,s]));

/* ---------- storage on this phone ---------- */
let S = load();
function load(){ try{ const r = localStorage.getItem(STORE); if (r){ const d = JSON.parse(r); if (Array.isArray(d.notes)){ if (!Array.isArray(d.canvases)) d.canvases = []; return d; } } }catch(e){} return {notes:[], canvases:[]}; }
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(S)); return true; }catch(e){ toast('Couldn’t save. Your phone’s storage may be full.'); return false; } }
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const nowIso = () => new Date().toISOString();

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (k==='class') n.className=v; else if (k==='text') n.textContent=v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v===true) n.setAttribute(k,''); else if (v!==false && v!=null) n.setAttribute(k,v);
  }
  for (const c of kids.flat()) if (c!=null && c!==false) n.append(c.nodeType?c:document.createTextNode(String(c)));
  return n;
}
let toastT; function toast(m){ const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2400); }
function when(iso){
  const d = new Date(iso), n = new Date(), diff = (n-d)/1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff/60)+'m ago';
  if (d.toDateString()===n.toDateString()) return d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
  if (diff < 6*86400) return d.toLocaleDateString(undefined,{weekday:'short'});
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year: d.getFullYear()===n.getFullYear()?undefined:'numeric'});
}
function plain(body){ return body.replace(LINK_RE,(a,t,al)=>al||t).replace(/^\s*(#+|[-*]|>)\s+/gm,'').replace(/[*`=\[\]]/g,'').replace(/\s+/g,' ').trim(); }
function allTags(){ const m = new Map(); for (const n of S.notes) for (const t of n.tags) m.set(t,(m.get(t)||0)+1); return [...m.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])); }
function cleanTag(t){ return t.trim().replace(/^#/,'').replace(/\s+/g,'-').toLowerCase().slice(0,30); }

/* ---------- links between notes: [[Note title]] or [[Note title|shown text]] ---------- */
const LINK_RE = /\[\[([^\]\n|#]+)(?:#[^\]\n|]*)?(?:\|([^\]\n]+))?\]\]/g;
const norm = t => t.trim().toLowerCase();
function findByTitle(t){ const k = norm(t); let best = null; for (const n of S.notes) if (norm(n.title)===k && (!best || n.updatedAt > best.updatedAt)) best = n; return best; }
function linksOf(body){ const out = new Set(); let m; LINK_RE.lastIndex = 0; while ((m = LINK_RE.exec(body))) out.add(m[1].trim()); return [...out]; }
function backlinksOf(note){ const k = norm(note.title); return S.notes.filter(x => x.id!==note.id && linksOf(x.body).some(t => norm(t)===k)); }
function contextLine(body, title){ const k = norm(title); for (const line of body.split('\n')){ let m; LINK_RE.lastIndex=0; while ((m = LINK_RE.exec(line))) if (norm(m[1])===k) return line.replace(LINK_RE,(a,t,al)=>al||t).replace(/^[#>\-*\s]+/,'').trim(); } return ''; }
/* ---------- unlinked mentions: a note's title written in another note without [[ ]] ---------- */
function maskLinks(body){ return body.replace(/\[\[[^\]\n]*\]\]|https?:\/\/\S+|`[^`\n]*`/g, m => ' '.repeat(m.length)); }
// per-body cache: masking and link-parsing every note for every title was the slow part of suggestions
const DER = new Map();
function derived(body){ let d = DER.get(body); if (!d){ if (DER.size > 4000) DER.clear(); d = {masked: maskLinks(body), links: new Set(linksOf(body).map(norm))}; DER.set(body, d); } return d; }
function unlinkedMentionsOf(note){
  const title = note.title.trim(); if (title.length < 4) return [];
  let re; try{ re = new RegExp('(^|[^\\p{L}\\p{N}\\-])('+escRe(title)+')(?=$|[^\\p{L}\\p{N}\\-])','iu'); }catch(e){ return []; }
  const out = [];
  for (const x of S.notes){
    if (x.id===note.id) continue;
    const dx = derived(x.body);
    if (dx.links.has(norm(title))) continue; // already linked from there
    const m = re.exec(dx.masked); if (!m) continue;
    const idx = m.index + m[1].length, len = m[2].length;
    const ls = x.body.lastIndexOf('\n', idx)+1, le = x.body.indexOf('\n', idx), line = x.body.slice(ls, le<0 ? undefined : le);
    out.push({note:x, idx, len, context: line.replace(LINK_RE,(a,t,al)=>al||t).replace(/^[#>\-*\s]+/,'').trim().slice(0,160)});
  }
  return out;
}
function linkMention(m, target){
  const b = m.note.body, matched = b.substr(m.idx, m.len);
  if (norm(matched)!==norm(target.title)) return false; // note changed since we looked
  const rep = matched===target.title ? '[['+target.title+']]' : '[['+target.title+'|'+matched+']]';
  m.note.body = b.slice(0, m.idx) + rep + b.slice(m.idx + m.len); m.note.updatedAt = nowIso(); return true;
}
function allSuggestions(){ const out = []; for (const n of S.notes) for (const m of unlinkedMentionsOf(n)) out.push({target:n, m}); return out; }
function suggestionsSheet(){
  const sh = sheet('short'), sug = allSuggestions();
  sh.append(el('div',{class:'shead'}, el('h2',{text:'Link suggestions'}), el('button',{class:'btn ghost',text:'Close',onclick:()=>{ closeLayer(); render(); }})));
  const body = el('div',{class:'sbody'}); sh.append(body);
  if (!sug.length){ body.append(el('p',{class:'hint',text:'No unlinked mentions. Every note title that appears in another note is already linked.'})); return; }
  body.append(el('p',{class:'hint',text:`${sug.length} place${sug.length===1?'':'s'} where a note’s title is written without a link. Linking them connects the notes in the graph.`}),
    el('div',{class:'actions'}, el('button',{class:'btn primary',text:'Link all '+sug.length,onclick:()=>{ let k=0; for (const {target,m} of allSuggestions()) if (linkMention(m,target)) k++; save(); toast('Linked '+k+'.'); suggestionsSheet(); }})));
  const list = el('div',{class:'mlist'});
  for (const {target, m} of sug.slice(0,150)) list.append(el('div',{class:'mrow'},
    el('div',{class:'mtext'}, el('span',{class:'mt'}, el('strong',{text:m.note.title}), ' mentions ', el('strong',{text:target.title})), el('span',{class:'ex',text:m.context})),
    el('button',{class:'btn',text:'Link',onclick:()=>{ if (linkMention(m,target)){ save(); toast('Linked.'); } suggestionsSheet(); }})));
  body.append(list);
}
function openLink(title){
  const t = findByTitle(title);
  if (t){ openNote(t.id); return; }
  const n = {id:uid(), title:title.trim().slice(0,90), body:'', tags:[], section:'inbox', pinned:false, createdAt:nowIso(), updatedAt:nowIso()};
  S.notes.unshift(n); save(); openEditor(n.id);
}
function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }

/* ---------- writing helpers: preferences, auto-linking, strength meters ---------- */
const PREFS_KEY = 'brain.prefs';
const prefs = (()=>{ try{ return Object.assign({autolink:true}, JSON.parse(localStorage.getItem(PREFS_KEY)||'{}')); }catch(e){ return {autolink:true}; } })();
const savePrefs = () => { try{ localStorage.setItem(PREFS_KEY, JSON.stringify(prefs)); }catch(e){} };

/* Link the first plain mention of every other note's title in this note, and the first mention of this
   note's title in every other note. Longest titles first, so "Cast Iron Skillet" wins over "Skillet". */
function autoLink(note){
  let added = 0, back = 0;
  const targets = S.notes.filter(x => x.id!==note.id && !x.tags.includes('template') && x.title.trim().length>=4)
    .sort((a,b)=>b.title.length-a.title.length);
  for (const t of targets){
    if (linksOf(note.body).some(l => norm(l)===norm(t.title))) continue;
    let re; try{ re = new RegExp('(^|[^\\p{L}\\p{N}\\-])('+escRe(t.title.trim())+')(?=$|[^\\p{L}\\p{N}\\-])','iu'); }catch(e){ continue; }
    const m = re.exec(maskLinks(note.body)); if (!m) continue;
    const idx = m.index + m[1].length, matched = note.body.substr(idx, m[2].length);
    note.body = note.body.slice(0,idx) + (matched===t.title ? '[['+t.title+']]' : '[['+t.title+'|'+matched+']]') + note.body.slice(idx+m[2].length);
    added++;
  }
  if (!note.tags.includes('template')) for (const m of unlinkedMentionsOf(note)){ if (!m.note.tags.includes('template') && linkMention(m, note)) back++; }
  if (added) note.updatedAt = nowIso();
  return {added, back};
}

/* "Evidence: 3/5", "**Strength:** 4.5 / 5", "Potency: ●●●○○" or "★★★☆☆" render as a meter. */
function meterOf(line){
  const m = /^\s*(?:\*\*)?([A-Za-z][^:*\n]{1,30}?)(?:\*\*)?\s*:\s*(?:\*\*)?\s*(.+)$/.exec(line); if (!m) return null;
  const label = m[1].trim(); let v = m[2].trim(), on, max, rest;
  let k = /^(\d+(?:\.5)?)\s*\/\s*(5|10)\b\s*(.*)$/.exec(v);
  if (k){ on = parseFloat(k[1]); max = +k[2]; rest = k[3]; }
  else if ((k = /^([●○◐]{3,10}|[★☆½]{3,10})\s*(.*)$/.exec(v))){
    const g = k[1]; on = (g.match(/[●★]/g)||[]).length + ((g.match(/[◐½]/g)||[]).length ? 0.5 : 0); max = (g.match(/[●○◐★☆½]/g)||[]).length; rest = k[2];
    if (/[★☆½]/.test(g) && max < 5) max = 5;
  } else return null;
  if (!(on>=0 && on<=max)) return null;
  const dots = el('span',{class:'dots',role:'img','aria-label':label+' '+on+' of '+max});
  for (let i=1;i<=max;i++) dots.append(el('i',{class: on>=i ? 'on' : (on>=i-0.5 ? 'half' : '')}));
  rest = rest.replace(/^[\s—–·,(-]+|\)$/g,'').replace(/^\*\*\s*/,'').trim();
  return el('span',{class:'meterrow'}, el('span',{class:'ml',text:label}), dots, rest ? el('span',{class:'mt'}, inline(rest)) : null);
}
function renameLinks(oldT, newT, skipId){
  const re = new RegExp('\\[\\[\\s*'+escRe(oldT.trim())+'\\s*(?=[\\]|#])','gi'); let changed = 0;
  for (const n of S.notes){ if (n.id===skipId) continue; const b = n.body.replace(re, '[['+newT.trim()); if (b!==n.body){ n.body=b; n.updatedAt=nowIso(); changed++; } }
  return changed;
}

/* light Markdown: # headings, - lists, > quotes, **bold**, *italic*, ==highlight==, `code`, links. Built with DOM nodes, never innerHTML. */
function inline(text){
  const out = []; const re = /(\[\[[^\]\n]+\]\]|\*\*[^*]+\*\*|==[^=]+==|\*[^*]+\*|`[^`]+`|https?:\/\/[^\s)]+)/g; let last = 0, m;
  while ((m = re.exec(text))){
    if (m.index > last) out.push(document.createTextNode(text.slice(last, m.index)));
    const s = m[0];
    if (s.startsWith('[[')){
      LINK_RE.lastIndex = 0; const lm = LINK_RE.exec(s);
      if (lm){ const target = lm[1].trim(), label = (lm[2]||target).trim(), exists = !!findByTitle(target);
        out.push(el('button',{class:'wl'+(exists?'':' missing'), title: exists ? 'Open '+target : 'Create '+target, onclick:()=>openLink(target)}, label)); }
      else out.push(document.createTextNode(s));
    }
    else if (s.startsWith('**')) out.push(el('strong',{text:s.slice(2,-2)}));
    else if (s.startsWith('==')) out.push(el('mark',{text:s.slice(2,-2)}));
    else if (s.startsWith('`')) out.push(el('code',{text:s.slice(1,-1)}));
    else if (s.startsWith('*')) out.push(el('em',{text:s.slice(1,-1)}));
    else out.push(el('a',{href:s,target:'_blank',rel:'noopener',text:s}));
    last = m.index + s.length;
  }
  if (last < text.length) out.push(document.createTextNode(text.slice(last)));
  return out;
}
function renderBody(body){
  const root = el('div',{class:'render'}); let ul = null, para = [];
  const flush = () => { if (para.length){ root.append(el('p',{}, inline(para.join(' ')))); para = []; } };
  for (const raw of body.split('\n')){
    const line = raw.trimEnd();
    if (/^\s*[-*]\s+/.test(line)){ flush(); if (!ul){ ul = el('ul'); root.append(ul); } const item = line.replace(/^\s*[-*]\s+/,''), mt = meterOf(item); ul.append(el('li',{}, mt || inline(item))); continue; }
    ul = null;
    if (!line.trim()){ flush(); continue; }
    if (!/^#/.test(line)){ const mt = meterOf(line); if (mt){ flush(); root.append(el('div',{}, mt)); continue; } }
    if (/^##\s+/.test(line)){ flush(); root.append(el('h3',{}, inline(line.replace(/^##\s+/,'')))); continue; }
    if (/^#\s+/.test(line)){ flush(); root.append(el('h2',{}, inline(line.replace(/^#\s+/,'')))); continue; }
    if (/^>\s?/.test(line)){ flush(); root.append(el('blockquote',{}, inline(line.replace(/^>\s?/,'')))); continue; }
    para.push(line);
  }
  flush();
  if (!body.trim()) root.append(el('p',{class:'muted',text:'Nothing written yet. Tap Edit.'}));
  return root;
}

/* ---------- state ---------- */
let tab = 'notes', query = '', section = 'all', tagFilter = null;

function filtered(){
  const q = query.trim().toLowerCase();
  return S.notes.filter(n =>
    (section==='all' ? n.section!=='archive' : n.section===section) &&
    (!tagFilter || n.tags.includes(tagFilter)) &&
    (!q || n.title.toLowerCase().includes(q) || n.body.toLowerCase().includes(q) || n.tags.some(t=>t.includes(q.replace(/^#/,''))))
  ).sort((a,b)=> (b.pinned?1:0)-(a.pinned?1:0) || b.updatedAt.localeCompare(a.updatedAt));
}

function render(){
  for (const id of ['notes','canvas','graph','tags','set']) $('#nav-'+id).setAttribute('aria-current', tab===id?'page':'false');
  const app = $('#app'); app.replaceChildren();
  if (tab==='notes') renderNotes(app);
  else if (tab==='canvas') renderCanvasList(app);
  else if (tab==='graph') renderGraph(app);
  else if (tab==='tags') renderTags(app);
  else renderSettings(app);
}

function renderNotes(app){
  const live = S.notes.filter(n=>n.section!=='archive').length;
  app.append(el('header',{class:'top'}, el('h1',{text:'Second Brain'}), el('div',{class:'hright'}, el('span',{class:'count',text: live+' note'+(live===1?'':'s')}), el('button',{class:'btn ghost imp',text:'Import',onclick:openImportSheet}))));

  // quick capture
  const cap = el('textarea',{id:'capture',rows:'2',placeholder:'Capture a thought…','aria-label':'Capture a thought'});
  const saveCap = () => {
    const txt = cap.value.trim(); if (!txt) return;
    const lines = txt.split('\n'); const first = lines[0].slice(0,90);
    const tags = [...new Set((txt.match(/#[\w-]+/g)||[]).map(cleanTag))];
    const n = {id:uid(), title:first.replace(/#[\w-]+/g,'').trim() || 'Untitled', body: lines.length>1 ? lines.slice(1).join('\n').trim() : (lines[0].length>90 ? txt : ''), tags, section:'inbox', pinned:false, createdAt:nowIso(), updatedAt:nowIso()};
    S.notes.unshift(n); if (save()){ cap.value=''; toast('Saved to Inbox.'); render(); }
  };
  cap.addEventListener('keydown', e => { if (e.key==='Enter' && (e.metaKey||e.ctrlKey)) saveCap(); });
  app.append(el('div',{class:'capture'}, cap,
    el('div',{class:'row'}, el('span',{class:'hint',text:'First line becomes the title. Add #tags anywhere.'}),
      el('div',{class:'actions'}, el('button',{class:'btn ghost',text:'Full note',onclick:()=>openEditor(null, cap.value)}), el('button',{class:'btn primary',text:'Save',onclick:saveCap})))));

  // search + sections
  const search = el('input',{class:'search',id:'search',type:'search',placeholder:'Search notes and #tags',value:query,'aria-label':'Search notes'});
  search.addEventListener('input', () => { query = search.value; drawList(); });
  app.append(search);
  const setView = v => { viewMode = v; try{ localStorage.setItem('brain.view', v); }catch(e){} render(); };
  const allOpen = () => { const keys = new Set(SECTIONS.map(x=>x.id)); for (const n of S.notes){ let k = n.section; for (const part of folderOf(n)){ k += '/'+part; keys.add(k); } } return keys; };
  app.append(el('div',{class:'viewbar'},
    el('div',{class:'seg2',role:'group','aria-label':'View'},
      el('button',{'aria-pressed':String(viewMode!=='folders'),text:'List',onclick:()=>setView('list')}),
      el('button',{'aria-pressed':String(viewMode==='folders'),text:'Folders',onclick:()=>setView('folders')})),
    viewMode==='folders' ? el('div',{class:'actions'},
      el('button',{class:'btn ghost',text:'Expand all',onclick:()=>{ openFolders = allOpen(); saveOpen(); drawTree(); }}),
      el('button',{class:'btn ghost',text:'Collapse',onclick:()=>{ openFolders = new Set(); saveOpen(); drawTree(); }})) : null));
  const counts = s => S.notes.filter(n => s==='all' ? n.section!=='archive' : n.section===s).length;
  if (viewMode!=='folders') app.append(el('div',{class:'chips',role:'group','aria-label':'Sections'},
    [{id:'all',name:'All'}].concat(SECTIONS).map(s => el('button',{class:'chip','aria-pressed':String(section===s.id), title:s.hint||'', onclick:()=>{ section=s.id; render(); }}, s.name, el('span',{class:'n',text:counts(s.id)})))));
  if (tagFilter) app.append(el('div',{class:'chips'}, el('button',{class:'chip','aria-pressed':'true',onclick:()=>{ tagFilter=null; render(); }}, '#'+tagFilter+'  ✕')));

  const list = el('div',{class:'list',id:'list'}); app.append(list);
  drawList();
}
/* ---------- folders (Obsidian-style tree) ----------
   Top level = sections. Inside, a note sits in its own folder path (n.folder, e.g. "Kitchen Codex/Recipes"),
   or, if it has none, an automatic one from its collection tags. */
const COLLECTIONS = [
  ['kitchen-codex','Kitchen Codex', [['recipe','Recipes'],['technique','Techniques'],['cuisine','Cuisines'],['foundation','Foundations'],['template','Templates']]],
  ['esoteric-journal','Esoteric Journal', [['template','Templates']]],
  ['palate','Palate', [['favorite','Favorites']]],
];
const PALATE_KIND = {film:'Films', series:'Series', book:'Books', dish:'Dishes', character:'Characters'};
function folderOf(n){
  if (n.folder) return String(n.folder).split('/').map(x=>x.trim()).filter(Boolean);
  for (const [tag,name,subs] of COLLECTIONS){
    if (!n.tags.includes(tag)) continue;
    const sub = subs.find(([t])=>n.tags.includes(t));
    if (tag==='palate' && sub){ const k = Object.keys(PALATE_KIND).find(t=>n.tags.includes(t)); return k ? [name, sub[1], PALATE_KIND[k]] : [name, sub[1]]; }
    return sub ? [name, sub[1]] : [name];
  }
  return [];
}
const allFolders = () => [...new Set(S.notes.flatMap(n => { const f = folderOf(n); return f.map((_,i)=>f.slice(0,i+1).join('/')); }))].sort();
let viewMode = (()=>{ try{ return localStorage.getItem('brain.view')||'list'; }catch(e){ return 'list'; } })();
let openFolders = (()=>{ try{ return new Set(JSON.parse(localStorage.getItem('brain.open')||'null') || SECTIONS.map(s=>s.id)); }catch(e){ return new Set(SECTIONS.map(s=>s.id)); } })();
const saveOpen = () => { try{ localStorage.setItem('brain.open', JSON.stringify([...openFolders])); }catch(e){} };
const ICON_FOLDER = '<svg viewBox="0 0 24 24"><path d="M3 6.5A1.5 1.5 0 0 1 4.5 5h4.6l2 2.2h8.4A1.5 1.5 0 0 1 21 8.7V17.5A1.5 1.5 0 0 1 19.5 19h-15A1.5 1.5 0 0 1 3 17.5z"/></svg>';
const ICON_MAP = '<svg viewBox="0 0 24 24"><rect x="3" y="4" width="7" height="6" rx="1"/><rect x="14" y="4" width="7" height="6" rx="1"/><rect x="8.5" y="14" width="7" height="6" rx="1"/><path d="M6.5 10v2h11v-2M12 12v2"/></svg>';
const ICON_FILE = '<svg viewBox="0 0 24 24"><path d="M6 3h8l4 4v14H6z M14 3v4h4"/></svg>';
function svgIcon(markup){ const t = document.createElement('span'); t.className='ficon'; t.innerHTML = markup; return t; } // static markup, no user content
function drawTree(){
  const list = $('#list'); if (!list) return; list.replaceChildren();
  const q = query.trim().toLowerCase().replace(/^#/,'');
  const items = S.notes.filter(n => (!tagFilter || n.tags.includes(tagFilter)) &&
    (!q || n.title.toLowerCase().includes(q) || n.body.toLowerCase().includes(q) || n.tags.some(t=>t.includes(q))));
  const searching = !!(q || tagFilter);
  const root = SECTIONS.map(s => ({key:s.id, name:s.name, folders:new Map(), notes:[]}));
  const byId = Object.fromEntries(root.map(r=>[r.key,r]));
  for (const n of items){
    let node = byId[n.section] || byId.inbox, key = node.key;
    for (const part of folderOf(n)){ key += '/'+part;
      if (!node.folders.has(part)) node.folders.set(part, {key, name:part, folders:new Map(), notes:[]});
      node = node.folders.get(part); }
    node.notes.push(n);
  }
  const count = nd => nd.notes.length + [...nd.folders.values()].reduce((a,f)=>a+count(f),0);
  const tree = el('div',{class:'tree',role:'tree'});
  const walk = (nd, depth, parent) => {
    const n = count(nd); if (searching && !n) return;
    const open = searching || openFolders.has(nd.key);
    const row = el('div',{class:'trow fold',role:'treeitem','aria-expanded':String(open),style:'--d:'+depth},
      el('button',{class:'tbtn',onclick:()=>{ open ? openFolders.delete(nd.key) : openFolders.add(nd.key); saveOpen(); drawTree(); }},
        el('span',{class:'chev',text: open ? '▾' : '▸'}), svgIcon(ICON_FOLDER), el('span',{class:'tn',text:nd.name}), el('span',{class:'tc',text:String(n)})),
      n ? el('button',{class:'tmap',title:'Map this folder on a canvas','aria-label':'Map '+nd.name+' on a canvas',onclick:()=>folderCanvas(nd.key, nd.name)}, svgIcon(ICON_MAP)) : null);
    parent.append(row);
    if (!open) return;
    [...nd.folders.values()].sort((a,b)=>a.name.localeCompare(b.name)).forEach(f=>walk(f, depth+1, parent));
    nd.notes.sort((a,b)=>(b.pinned?1:0)-(a.pinned?1:0) || a.title.localeCompare(b.title)).forEach(note =>

  const groups = new Map(); for (const n of notes){ const g = sub(n); if (!groups.has(g)) groups.set(g, []); groups.get(g).push(n); }
  const cols = [...groups.entries()].sort((a,b)=> (a[0]===''?-1:b[0]===''?1:a[0].localeCompare(b[0])));
  const nodes = [], edges = [], nid = new Map(), GAP = 70, colors = ['2','5','4','3','6','1'];

    const k = [nid.get(n.id), nid.get(b.id)].sort().join('|'); if (seen.has(k)) continue; seen.add(k); edges.push({id:uid(), fromNode:nid.get(n.id), toNode:nid.get(b.id)}); }

/* ---------- graph ---------- */
/* A live force layout: it paints at once, settles in the background a few milliseconds per frame,

const GKEY = 'brain.graph.v1';
let GPOS = null, GVIEW = null;
function gposLoad(){ if (GPOS) return GPOS; GPOS = new Map(); try{ const o = JSON.parse(localStorage.getItem(GKEY)||'{}'); for (const id in o) GPOS.set(id, {x:o[id][0], y:o[id][1]}); }catch(e){} return GPOS; }

function renderGraph(app){

  const idx = new Map(notes.map((n,i)=>[norm(n.title), i]));
  const edges = [], seen = new Set();
  notes.forEach((n,i) => { for (const t of linksOf(n.body)){ const j = idx.get(norm(t)); if (j==null || j===i) continue; const k = i<j ? i+'-'+j : j+'-'+i; if (!seen.has(k)){ seen.add(k); edges.push([i,j]); } } });
  const hright = el('div',{class:'hright'}, el('span',{class:'count',text: notes.length+' notes · '+edges.length+' link'+(edges.length===1?'':'s')}));
  app.append(el('header',{class:'top'}, el('h1',{text:'Graph'}), hright));
  // link suggestions scan every note against every title: count them after the graph is on screen, not before
  setTimeout(() => { if (!hright.isConnected) return; const nSug = allSuggestions().length;
    if (nSug) hright.append(el('button',{class:'btn ghost imp',text:nSug+' suggestion'+(nSug===1?'':'s'),onclick:suggestionsSheet})); }, 120);
  if (!notes.length){ app.append(el('div',{class:'empty',text:'No notes yet. Once you have a few, link them with [[Note title]] and they’ll connect here.'})); return; }
  const wrap = el('div',{class:'graphwrap'}), cv = el('canvas',{class:'graph',role:'img','aria-label':'Map of your notes and the links between them'});
  wrap.append(cv); app.append(wrap);
  app.append(el('div',{class:'legend'}, el('span',{}, el('i',{style:'background:var(--copper)'}), 'Linked note'), el('span',{}, el('i',{style:'background:var(--ink-3)'}), 'Not linked yet'), el('span',{text:'Drag a dot to pull it, drag space to pan, pinch or +/− to zoom. Tap a dot to highlight its links, tap again to open.'})));
  if (!edges.length) app.append(el('p',{class:'hint',text:'Nothing is linked yet. Open a note, tap “[[ ]] Link”, and pick another note to connect them.'}));

  const N = notes.length, deg = new Array(N).fill(0), adj = notes.map(()=>[]);
  for (const [a,b] of edges){ deg[a]++; deg[b]++; adj[a].push(b); adj[b].push(a); }

  const mem = gposLoad(), P = notes.map(()=>null), V = notes.map(()=>({x:0,y:0})), fixed = new Uint8Array(N);
  let fresh = 0;

  for (let pass=0; pass<3; pass++) linked.forEach((i,k) => { if (P[i]) return;
    const nb = adj[i].find(j => P[j]);
    if (nb!=null){ const a = Math.random()*6.283; P[i] = {x:P[nb].x+Math.cos(a)*60, y:P[nb].y+Math.sin(a)*60}; fresh++; }

  //    so unrelated topics never pile on top of each other
  const comp = new Int32Array(N).fill(-1), groups = [];

    for (let q=0;q<g.length;q++) for (const j of adj[g[q]]) if (comp[j]<0){ comp[j]=groups.length; g.push(j); }
    groups.push(g); }
  const gorder = groups.map((g,c)=>c).sort((a,b)=>groups[b].length-groups[a].length);
  const cen = groups.map(()=>({x:0,y:0}));

  // one simulation step: grid-based repulsion (only nearby dots in the same cluster push), springs on links, gravity to the cluster's centre
  const REACH = 380, R2 = REACH*REACH, cell = new Map(), springs = edges.filter(([a,b])=>deg[a]&&deg[b]);

/* ---------- canvas: an open board of note cards and connections (Obsidian JSON Canvas compatible) ---------- */
const CW = 230, CH = 128, TW = 210, SWATCHES = ['','1','2','3','4','5','6'], SVGNS = 'http://www.w3.org/2000/svg';
let board = null, B = null, V = {x:0, y:0, k:1};
const bs = {sel:null, edge:null, connect:false, from:null};
const getCanvas = id => S.canvases.find(c => c.id===id);

function touchCanvas(){ const c = getCanvas(board); if (c){ c.updatedAt = nowIso(); save(); } }

function renderCanvasList(app){
  const list = S.canvases.slice().sort((a,b)=>b.updatedAt.localeCompare(a.updatedAt));
  app.append(el('header',{class:'top'}, el('h1',{text:'Canvas'}), el('span',{class:'count',text:list.length+' canvas'+(list.length===1?'':'es')})));
  app.append(el('p',{class:'hint',style:'font-size:14px',text:'Lay notes out on an open board and draw connections between them. Plan a project, map a topic, or see how ideas fit together.'}));
  app.append(el('div',{class:'actions'}, el('button',{class:'btn primary',text:'New canvas',onclick:()=>{ const c = createCanvas('Untitled canvas'); openBoard(c.id); }})));
  if (!list.length){ app.append(el('div',{class:'empty',text:'No canvases yet. Start a blank one, or open any note and tap “Map” to build a canvas from its links automatically.'})); return; }
  const box = el('div',{class:'list'});
  for (const c of list) box.append(el('button',{class:'note',onclick:()=>openBoard(c.id)}, el('span',{class:'t',text:c.name}),
    el('span',{class:'meta'}, el('span',{text:c.nodes.length+' card'+(c.nodes.length===1?'':'s')+' · '+c.edges.length+' connection'+(c.edges.length===1?'':'s')}), el('span',{text:when(c.updatedAt)}))));

function openBoard(id){
  const c = getCanvas(id); if (!c) return;
  board = id; Object.assign(bs, {sel:null, edge:null, connect:false, from:null});
  const name = el('input',{id:'canvasName',type:'text',value:c.name,'aria-label':'Canvas name'});

    el('button',{class:'btn danger',text:'Delete',onclick:()=>{ S.canvases = S.canvases.filter(x=>x.id!==id); save(); closeBoard(); toast('Canvas deleted.'); }}),
    el('button',{class:'btn',text:'Cancel',onclick:()=>{ del.hidden = true; }}));

  const empty = el('div',{class:'bempty'}, el('div',{}, el('strong',{text:'Empty canvas'}), 'Add a note or a text card below. Drag cards to arrange them, then connect them.'));

    el('div',{class:'btop'}, el('button',{class:'icon',text:'‹ Canvases',onclick:closeBoard}), name, el('button',{class:'icon',style:'color:var(--danger)',text:'Delete',onclick:()=>{ del.hidden = false; }})),

}
function canvasJSON(c, pathOf){

    if (n.type==='file' && pathOf.has(n.noteId)) return {...base, type:'file', file:pathOf.get(n.noteId)};
    return {...base, type:'text', text: n.type==='text' ? (n.text||'') : '(missing note)'}; });
  const edges = c.edges.filter(e=>byId.has(e.fromNode) && byId.has(e.toNode)).map(e => { const [fs, ts] = sidesFor(byId.get(e.fromNode), byId.get(e.toNode)); return {id:e.id, fromNode:e.fromNode, fromSide:fs, toNode:e.toNode, toSide:ts, toEnd:'arrow'}; });

async function exportVault(){

    const folder = [SBYID[n.section].name, ...folderOf(n).map(safeName)].join('/'); let base = safeName(n.title), name = folder+'/'+base+'.md', k = 2;
    while (used.has(name.toLowerCase())) name = folder+'/'+base+' '+(k++)+'.md';

function sectionFrom(v){ if (typeof v!=='string' || !v.trim()) return null; const k = norm(v); const s = SECTIONS.find(x => norm(x.name)===k || x.id===k); return s ? s.id : null; }
/* Paste from Claude: one or more notes, each starting with a --- frontmatter block that has a title:
   ---
   title: Note title
   section: Resources        (Inbox, Projects, Areas, Resources or Archive)
   tags: [tag-one, tag-two]
   pinned: false
   ---
   Body in Markdown, [[links]] to other notes.
   Text with no frontmatter becomes one note: a leading "# Heading" (or the first line) is the title. */
function parseBundle(text){
  text = String(text||'').replace(/^\uFEFF/,'').replace(/\r\n?/g,'\n').replace(/^\s*```[a-z]*\n|\n```\s*$/g,'');
  const lines = text.split('\n'), starts = [];
  for (let i=0;i<lines.length;i++){
    if (lines[i].trim()!=='---') continue;
    for (let j=i+1;j<Math.min(lines.length,i+40);j++){
      if (lines[j].trim()==='---'){ if (lines.slice(i+1,j).some(l=>/^title:\s*\S/i.test(l))) starts.push(i); break; }
    }
  }
  const chunks = starts.length ? starts.map((s,k)=>lines.slice(s, starts[k+1]??lines.length).join('\n')) : [text];
  const notes = [];
  for (const ch of chunks){
    if (!ch.trim()) continue;
    const md = parseMarkdown(ch.trim()+'\n');
    let title = typeof md.fm.title==='string' ? md.fm.title.trim() : '', body = md.body;
    if (!title){ const b = body.split('\n'); const h = b.findIndex(l=>l.trim()); title = (b[h]||'Untitled').replace(/^#+\s*/,'').replace(/#[\w-]+/g,'').trim() || 'Untitled'; body = b.slice(h+1).join('\n').replace(/^\s*\n/,''); }
    notes.push({...md, title:title.slice(0,90), body:body.trimEnd(), section: sectionFrom(md.fm.section) || 'inbox', folder: typeof md.fm.folder==='string' ? md.fm.folder.trim() : ''});
  }
  return notes;
}
const CLAUDE_FORMAT = `Format notes for my Second Brain app so I can paste them straight in. Output ONE plain-text block (no commentary inside it). Start every note with this frontmatter, then its body:

---
title: Note title (max 90 characters, unique)
section: Resources
tags: [tag-one, tag-two]
pinned: false
folder: Optional/Subfolder (leave out to file it automatically)
---
Body in light Markdown: # Heading, ## Subheading, - bullet lists, > quotes, **bold**, *italic*, ==highlight==, links like [[Other note title]].

Rules: section is one of Inbox, Projects, Areas, Resources, Archive. Tags are lowercase-with-dashes, no # in the frontmatter. Don't use # before a word in the body unless it's meant as a tag. No tables or numbered lists (use - bullets). A note with the same title as an existing one replaces it.`;

async function readImport(fileList){
  const raw = [];
  for (const f of fileList){
    if (/\.zip$/i.test(f.name)) raw.push(...await readZip(await f.arrayBuffer()));
    else if (/\.(md|markdown|txt|canvas)$/i.test(f.name)) raw.push({name:f.name, text:await f.text()});
  }
  const segs = raw.map(r => r.name.split('/').filter(Boolean));
  const root = segs.length && segs.every(s => s.length>1 && s[0]===segs[0][0]) ? 1 : 0;
  const notes = [], canvases = [];
  raw.forEach((r,i) => {
    const sg = segs[i].slice(root), file = sg[sg.length-1], folder = sg.length>1 ? sg[0] : '';
    if (/\.canvas$/i.test(file)){ try{ const d = JSON.parse(r.text); if (d && Array.isArray(d.nodes)) canvases.push({name:file.replace(/\.canvas$/i,''), data:d}); }catch(e){} return; }
    const sec = SECTIONS.find(s => norm(s.name)===norm(folder) || (folder && norm(folder).replace(/^\d+[\s._-]*/,'')===norm(s.name)));
    const md = parseMarkdown(r.text);
    if (folder && !sec) md.tags = [...new Set([...md.tags, cleanTag(folder)])];
    const fmSec = sectionFrom(md.fm.section);
    const sub = sg.length>2 ? sg.slice(1,-1).join('/') : '';
    md.folder = (typeof md.fm.folder==='string' && md.fm.folder.trim()) ? md.fm.folder.trim() : (sec && sub ? sub : '');
    notes.push({...md, title: (typeof md.fm.title==='string' && md.fm.title.trim() ? md.fm.title.trim() : file.replace(/\.(md|markdown|txt)$/i,'')).slice(0,90), section: fmSec || (sec ? sec.id : (folder ? 'resources' : 'inbox'))});
  });
  return {notes, canvases};
}
function applyImport(res){
  let added = 0, updated = 0, boards = 0; const t = nowIso();
  for (const it of res.notes){
    const ex = S.notes.find(n => norm(n.title)===norm(it.title));
    if (ex){ Object.assign(ex, {body:it.body, tags:it.tags, section:it.section, updatedAt: it.updated || t}); if (it.pinned) ex.pinned = true; if (it.folder) ex.folder = it.folder; updated++; }
    else { const nn = {id:uid(), title:it.title, body:it.body, tags:it.tags, section:it.section, pinned:!!it.pinned, createdAt: it.created || t, updatedAt: it.updated || t}; if (it.folder) nn.folder = it.folder; S.notes.push(nn); added++; }
  }
  for (const cv of res.canvases){
    const ids = new Set(), nodes = [];
    for (const n of cv.data.nodes){
      const id = String(n.id || uid()), base = {id, x:+n.x||0, y:+n.y||0, width:+n.width||CW, height:+n.height||CH};
      if (n.color && /^[1-6]$/.test(String(n.color))) base.color = String(n.color);
      if (n.type==='file' && typeof n.file==='string'){ const ttl = n.file.split('/').pop().replace(/\.md$/i,''), note = findByTitle(ttl); nodes.push(note ? {...base, type:'file', noteId:note.id} : {...base, type:'text', text:ttl}); ids.add(id); }
      else if (n.type==='text'){ nodes.push({...base, type:'text', text:String(n.text||'')}); ids.add(id); }
      else if (n.type==='link' && n.url){ nodes.push({...base, type:'text', text:String(n.url)}); ids.add(id); }
    }
    const edges = (Array.isArray(cv.data.edges) ? cv.data.edges : []).filter(e => ids.has(String(e.fromNode)) && ids.has(String(e.toNode))).map(e => ({id:String(e.id||uid()), fromNode:String(e.fromNode), toNode:String(e.toNode)}));
    const ex = S.canvases.find(c => norm(c.name)===norm(cv.name));
    if (ex) Object.assign(ex, {nodes, edges, view:null, updatedAt:t}); else createCanvas(cv.name, nodes, edges);
    boards++;
  }
  save(); return {added, updated, boards};
}

/* ---------- Palate link: recipes (notes tagged #recipe) with a "My rating" line become rated dishes in Palate ---------- */
function ratingOf(body){
  const line = (body.split('\n').find(l => /my rating/i.test(l)) || '');
  const stars = (line.match(/★/g)||[]).length + ((line.match(/½/g)||[]).length ? 0.5 : 0);
  if (stars) return Math.min(5, stars);
  const m = line.replace(/\*\*my rating\*\*/i,'').replace(/out of 5|\/\s*5\b/gi,'').match(/(\d(?:\.\d)?)/);
  if (!m) return null; const r = Math.round(parseFloat(m[1])*2)/2; return r>=0.5 && r<=5 ? r : null;
}
function dishesForPalate(){
  return S.notes.filter(n => n.tags.includes('recipe') && !n.tags.includes('template'))
    .map(n => ({id:n.id, title:n.title, tags:n.tags, rating:ratingOf(n.body), updated:n.updatedAt}));
}

// Notes sent from Palate (favorites) wait in 'brain.inbox' until Second Brain opens, then import like a paste.
function takeInbox(){
  let box=null; try{ box=JSON.parse(localStorage.getItem('brain.inbox')||'null'); }catch(e){}
  if (!box || typeof box.text!=='string') return;

  const notes = parseBundle(box.text); if (!notes.length) return;

  toast('From '+(box.from==='palate'?'Palate':'another app')+': '+r.added+' new, '+r.updated+' updated.'); render();
}
