<!doctype html><html lang="en" data-pwa="1"><head><meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="theme-color" content="#2C1A0E">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">

<link rel="preconnect" href="https://fonts.googleapis.com">

<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Lora:ital,wght@0,500;0,600;0,700;1,500&family=Figtree:wght@400;500;600&display=swap">
<style>
/* Layout: a pocket notebook. Warm paper, ink-brown text, one copper accent; serif for what you wrote, sans for the controls. */
:root{
  --paper:#faf6f0; --page:#fffaf3; --rule:#e8dbc6; --ink:#2c1a0e; --ink-2:#6b5444; --ink-3:#9a8574;
  --copper:#b5651d; --copper-dk:#8b4c16; --copper-lt:#fdf0e3; --hl:#fde3b4; --tag:#f6e2c4;
  --danger:#b3261e; --scrim:rgba(44,26,14,.4);
  --serif:"Lora",Georgia,"Times New Roman",serif;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --navh:62px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#17120d; --page:#211a13; --rule:#3a2e22; --ink:#f1e6d8; --ink-2:#c3b09c; --ink-3:#8f7c69;
  --copper:#e0934a; --copper-dk:#f0ac68; --copper-lt:#33241a; --hl:#5a4120; --tag:#3a2b1d;
  --danger:#ff8a7e; --scrim:rgba(0,0,0,.6); color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:15.5px/1.55 var(--sans);-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px calc(var(--navh) + 28px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--serif);margin:0;text-wrap:balance;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);font-weight:600}
.muted{color:var(--ink-3)} .small{font-size:13px}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.top h1{font-size:30px;line-height:1.1}
.top .count{font-size:13px;color:var(--ink-3)}

.capture{background:var(--page);border:1px solid var(--rule);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.capture textarea{border:0;background:transparent;resize:none;min-height:46px;font:16px/1.5 var(--serif);color:var(--ink);padding:2px;outline:none;width:100%}
.capture .row{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.capture .row .hint{flex:1 1 180px;min-width:0}
.capture .row .actions{flex-wrap:nowrap;margin-left:auto}

input,select,textarea{font:inherit;font-size:16px;color:var(--ink)}
.search{width:100%;background:var(--page);border:1px solid var(--rule);border-radius:999px;padding:10px 14px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--page);border-radius:999px;padding:6px 12px;font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .n{opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}

.btn{border:1px solid var(--rule);background:var(--page);border-radius:6px;padding:9px 14px;font-weight:600;font-size:14.5px}
.btn.primary{background:var(--copper);border-color:var(--copper);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5}

.list{display:flex;flex-direction:column;gap:8px}
.note{background:var(--page);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;text-align:left;width:100%;display:flex;flex-direction:column;gap:5px}
.note .t{font-family:var(--serif);font-weight:600;font-size:17px;line-height:1.3}
.note .ex{color:var(--ink-2);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.note .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-3)}
.pin{color:var(--copper);font-weight:600}
.tag{background:var(--tag);color:var(--copper-dk);border-radius:4px;padding:1px 7px;font-size:12px}
.sec{border:1px solid var(--rule);border-radius:4px;padding:0 6px;font-size:11.5px}
.empty{border:1px dashed var(--rule);border-radius:8px;padding:18px;color:var(--ink-3);font-size:14px;text-align:center}

/* editor */
.overlay{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:620px;height:94vh;border-radius:14px 14px 0 0;display:flex;flex-direction:column;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:10px}
.sheet.short{height:auto;max-height:80vh;overflow:auto}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar .grp{display:flex;gap:4px;align-items:center}
.icon{border:0;background:none;padding:8px 10px;border-radius:6px;font-size:14.5px;font-weight:600;color:var(--ink-2)}
.icon[aria-pressed="true"]{color:var(--copper)}
.titlein{border:0;background:transparent;font:700 24px/1.25 var(--serif);padding:4px 0;outline:none;width:100%}
.bodyin{flex:1;border:0;background:transparent;font:16.5px/1.65 var(--serif);padding:4px 0;outline:none;resize:none;width:100%;min-height:200px}
.render{flex:1;overflow:auto;font:16.5px/1.65 var(--serif);overflow-wrap:anywhere}
.render h2{font-size:21px;margin:.8em 0 .3em} .render h3{font-size:18px;margin:.7em 0 .2em}
.render p{margin:0 0 .7em} .render ul{margin:0 0 .7em;padding-left:22px} .render li{margin:.15em 0}
.render mark{background:var(--hl);color:inherit;padding:0 2px;border-radius:2px}
.render a{color:var(--copper-dk)}
.render code{font-family:ui-monospace,Menlo,monospace;font-size:.88em;background:var(--copper-lt);padding:1px 4px;border-radius:3px}
.render blockquote{border-left:3px solid var(--copper);margin:0 0 .7em;padding:2px 0 2px 12px;color:var(--ink-2)}
.metarow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:10px}
.metarow select{background:var(--page);border:1px solid var(--rule);border-radius:6px;padding:7px 8px;font-size:14px}
.tagbox{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:1;min-width:180px}
.tagbox input{border:0;background:transparent;outline:none;min-width:90px;flex:1;font-size:14px;padding:6px 2px}
.tagx{border:0;background:var(--tag);color:var(--copper-dk);border-radius:4px;padding:2px 7px;font-size:12.5px}
.hint{font-size:12.5px;color:var(--ink-3);margin:0}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--copper-lt);border-radius:6px;padding:8px 10px;font-size:13.5px}

.card{background:var(--page);border:1px solid var(--rule);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h2{font-size:20px}
.card textarea{width:100%;min-height:90px;background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:10px}
.tagcloud{display:flex;flex-wrap:wrap;gap:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.nav{position:fixed;left:0;right:0;bottom:0;background:var(--page);border-top:1px solid var(--rule);z-index:10;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(4,1fr);height:var(--navh)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-3);font-size:12px;font-weight:600;letter-spacing:.04em}
.nav button[aria-current="page"]{color:var(--ink)}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.nav button[aria-current="page"] svg{stroke:var(--copper)}
/* links between notes */
.wl{border:0;background:none;padding:0;font:inherit;color:var(--copper-dk);text-decoration:underline;text-decoration-color:var(--copper);text-underline-offset:3px;cursor:pointer}
.wl.missing{color:var(--ink-3);text-decoration-style:dashed}
.backlinks{border-top:1px solid var(--rule);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.backlinks .note{padding:9px 12px}
.backlinks .note .t{font-size:15px}
.suggest{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.suggest::-webkit-scrollbar{display:none}
.suggest .chip{background:var(--copper-lt);border-color:transparent;color:var(--copper-dk)}
.viewbody{flex:1;overflow:auto;display:flex;flex-direction:column;gap:14px;min-height:0}
.viewbody .render{flex:none;overflow:visible}
/* graph */
.graphwrap{background:var(--page);border:1px solid var(--rule);border-radius:8px;overflow:hidden;position:relative}
canvas.graph{display:block;width:100%;touch-action:manipulation;cursor:pointer}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + 16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:6px;font-size:13.5px;z-index:40;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(20px);opacity:.7}}}
</style>
</head><body>
<div class="wrap" id="app"></div>
<nav class="nav" aria-label="Sections"><div class="in">
  <button id="nav-notes" aria-current="page"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7M9 7h4"/></svg>Notes</button>
  <button id="nav-graph"><svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="2.3"/><circle cx="18" cy="6" r="2.3"/><circle cx="12" cy="17" r="2.3"/><circle cx="19" cy="16" r="1.6"/><path d="M8 8l2.6 7M16 7.5l-2.8 7.6M8.2 6.8l7.5-.6M14.2 17.2l3.3-.8"/></svg>Graph</button>
  <button id="nav-tags"><svg viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/></svg>Tags</button>
  <button id="nav-set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Settings</button>
</div></nav>
<div id="layer"></div>
<div id="toast" class="toast" hidden></div>

<script>
(() => {
'use strict';
const STORE = 'brain.v1';
/* Sections follow the PARA method from Building a Second Brain. */
const SECTIONS = [
  {id:'inbox',     name:'Inbox',     hint:'Captured, not sorted yet'},
  {id:'projects',  name:'Projects',  hint:'Active work with an end date'},
  {id:'areas',     name:'Areas',     hint:'Ongoing parts of your life'},
  {id:'resources', name:'Resources', hint:'Things you want to keep for later'},
  {id:'archive',   name:'Archive',   hint:'Done or inactive'},
];
const SBYID = Object.fromEntries(SECTIONS.map(s=>[s.id,s]));

/* ---------- storage on this phone ---------- */
let S = load();
function load(){ try{ const r = localStorage.getItem(STORE); if (r){ const d = JSON.parse(r); if (Array.isArray(d.notes)) return d; } }catch(e){} return {notes:[]}; }
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(S)); return true; }catch(e){ toast('Couldn’t save. Your phone’s storage may be full.'); return false; } }
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const nowIso = () => new Date().toISOString();

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (k==='class') n.className=v; else if (k==='text') n.textContent=v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v===true) n.setAttribute(k,''); else if (v!==false && v!=null) n.setAttribute(k,v);
  }
  for (const c of kids.flat()) if (c!=null && c!==false) n.append(c.nodeType?c:document.createTextNode(String(c)));
  return n;
}
let toastT; function toast(m){ const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2400); }
function when(iso){
  const d = new Date(iso), n = new Date(), diff = (n-d)/1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff/60)+'m ago';
  if (d.toDateString()===n.toDateString()) return d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
  if (diff < 6*86400) return d.toLocaleDateString(undefined,{weekday:'short'});
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year: d.getFullYear()===n.getFullYear()?undefined:'numeric'});
}
function plain(body){ return body.replace(LINK_RE,(a,t,al)=>al||t).replace(/[#*>`=\-\[\]()]/g,'').replace(/\s+/g,' ').trim(); }
function allTags(){ const m = new Map(); for (const n of S.notes) for (const t of n.tags) m.set(t,(m.get(t)||0)+1); return [...m.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])); }
function cleanTag(t){ return t.trim().replace(/^#/,'').replace(/\s+/g,'-').toLowerCase().slice(0,30); }

/* ---------- links between notes: [[Note title]] or [[Note title|shown text]] ---------- */
const LINK_RE = /\[\[([^\]\n|#]+)(?:#[^\]\n|]*)?(?:\|([^\]\n]+))?\]\]/g;
const norm = t => t.trim().toLowerCase();
function findByTitle(t){ const k = norm(t); let best = null; for (const n of S.notes) if (norm(n.title)===k && (!best || n.updatedAt > best.updatedAt)) best = n; return best; }
function linksOf(body){ const out = new Set(); let m; LINK_RE.lastIndex = 0; while ((m = LINK_RE.exec(body))) out.add(m[1].trim()); return [...out]; }
function backlinksOf(note){ const k = norm(note.title); return S.notes.filter(x => x.id!==note.id && linksOf(x.body).some(t => norm(t)===k)); }
function contextLine(body, title){ const k = norm(title); for (const line of body.split('\n')){ let m; LINK_RE.lastIndex=0; while ((m = LINK_RE.exec(line))) if (norm(m[1])===k) return line.replace(LINK_RE,(a,t,al)=>al||t).replace(/^[#>\-*\s]+/,'').trim(); } return ''; }
function openLink(title){
  const t = findByTitle(title);
  if (t){ openNote(t.id); return; }
  const n = {id:uid(), title:title.trim().slice(0,90), body:'', tags:[], section:'inbox', pinned:false, createdAt:nowIso(), updatedAt:nowIso()};
  S.notes.unshift(n); save(); openEditor(n.id);
}
function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function renameLinks(oldT, newT, skipId){
  const re = new RegExp('\\[\\[\\s*'+escRe(oldT.trim())+'\\s*(?=[\\]|#])','gi'); let changed = 0;
  for (const n of S.notes){ if (n.id===skipId) continue; const b = n.body.replace(re, '[['+newT.trim()); if (b!==n.body){ n.body=b; n.updatedAt=nowIso(); changed++; } }
  return changed;
}

/* light Markdown: # headings, - lists, > quotes, **bold**, *italic*, ==highlight==, `code`, links. Built with DOM nodes, never innerHTML. */
function inline(text){
  const out = []; const re = /(\[\[[^\]\n]+\]\]|\*\*[^*]+\*\*|==[^=]+==|\*[^*]+\*|`[^`]+`|https?:\/\/[^\s)]+)/g; let last = 0, m;
  while ((m = re.exec(text))){
    if (m.index > last) out.push(document.createTextNode(text.slice(last, m.index)));
    const s = m[0];
    if (s.startsWith('[[')){
      LINK_RE.lastIndex = 0; const lm = LINK_RE.exec(s);
      if (lm){ const target = lm[1].trim(), label = (lm[2]||target).trim(), exists = !!findByTitle(target);
        out.push(el('button',{class:'wl'+(exists?'':' missing'), title: exists ? 'Open '+target : 'Create '+target, onclick:()=>openLink(target)}, label)); }
      else out.push(document.createTextNode(s));
    }
    else if (s.startsWith('**')) out.push(el('strong',{text:s.slice(2,-2)}));
    else if (s.startsWith('==')) out.push(el('mark',{text:s.slice(2,-2)}));
    else if (s.startsWith('`')) out.push(el('code',{text:s.slice(1,-1)}));
    else if (s.startsWith('*')) out.push(el('em',{text:s.slice(1,-1)}));
    else out.push(el('a',{href:s,target:'_blank',rel:'noopener',text:s}));
    last = m.index + s.length;
  }
  if (last < text.length) out.push(document.createTextNode(text.slice(last)));
  return out;
}
function renderBody(body){
  const root = el('div',{class:'render'}); let ul = null, para = [];
  const flush = () => { if (para.length){ root.append(el('p',{}, inline(para.join(' ')))); para = []; } };
  for (const raw of body.split('\n')){
    const line = raw.trimEnd();
    if (/^\s*[-*]\s+/.test(line)){ flush(); if (!ul){ ul = el('ul'); root.append(ul); } ul.append(el('li',{}, inline(line.replace(/^\s*[-*]\s+/,'')))); continue; }
    ul = null;
    if (!line.trim()){ flush(); continue; }
    if (/^##\s+/.test(line)){ flush(); root.append(el('h3',{}, inline(line.replace(/^##\s+/,'')))); continue; }
    if (/^#\s+/.test(line)){ flush(); root.append(el('h2',{}, inline(line.replace(/^#\s+/,'')))); continue; }
    if (/^>\s?/.test(line)){ flush(); root.append(el('blockquote',{}, inline(line.replace(/^>\s?/,'')))); continue; }
    para.push(line);
  }
  flush();
  if (!body.trim()) root.append(el('p',{class:'muted',text:'Nothing written yet. Tap Edit.'}));
  return root;
}

/* ---------- state ---------- */
let tab = 'notes', query = '', section = 'all', tagFilter = null;

function filtered(){
  const q = query.trim().toLowerCase();
  return S.notes.filter(n =>
    (section==='all' ? n.section!=='archive' : n.section===section) &&
    (!tagFilter || n.tags.includes(tagFilter)) &&
    (!q || n.title.toLowerCase().includes(q) || n.body.toLowerCase().includes(q) || n.tags.some(t=>t.includes(q.replace(/^#/,''))))
  ).sort((a,b)=> (b.pinned?1:0)-(a.pinned?1:0) || b.updatedAt.localeCompare(a.updatedAt));
}

function render(){
  for (const id of ['notes','graph','tags','set']) $('#nav-'+id).setAttribute('aria-current', tab===id?'page':'false');
  const app = $('#app'); app.replaceChildren();
  if (tab==='notes') renderNotes(app);
  else if (tab==='graph') renderGraph(app);
  else if (tab==='tags') renderTags(app);
  else renderSettings(app);
}

function renderNotes(app){
  const live = S.notes.filter(n=>n.section!=='archive').length;
  app.append(el('header',{class:'top'}, el('h1',{text:'Second Brain'}), el('span',{class:'count',text: live+' note'+(live===1?'':'s')})));

  // quick capture
  const cap = el('textarea',{id:'capture',rows:'2',placeholder:'Capture a thought…','aria-label':'Capture a thought'});
  const saveCap = () => {
    const txt = cap.value.trim(); if (!txt) return;
    const lines = txt.split('\n'); const first = lines[0].slice(0,90);
    const tags = [...new Set((txt.match(/#[\w-]+/g)||[]).map(cleanTag))];
    const n = {id:uid(), title:first.replace(/#[\w-]+/g,'').trim() || 'Untitled', body: lines.length>1 ? lines.slice(1).join('\n').trim() : (lines[0].length>90 ? txt : ''), tags, section:'inbox', pinned:false, createdAt:nowIso(), updatedAt:nowIso()};
    S.notes.unshift(n); if (save()){ cap.value=''; toast('Saved to Inbox.'); render(); }
  };
  cap.addEventListener('keydown', e => { if (e.key==='Enter' && (e.metaKey||e.ctrlKey)) saveCap(); });
  app.append(el('div',{class:'capture'}, cap,
    el('div',{class:'row'}, el('span',{class:'hint',text:'First line becomes the title. Add #tags anywhere.'}),
      el('div',{class:'actions'}, el('button',{class:'btn ghost',text:'Full note',onclick:()=>openEditor(null, cap.value)}), el('button',{class:'btn primary',text:'Save',onclick:saveCap})))));

  // search + sections
  const search = el('input',{class:'search',id:'search',type:'search',placeholder:'Search notes and #tags',value:query,'aria-label':'Search notes'});
  search.addEventListener('input', () => { query = search.value; drawList(); });
  app.append(search);
  const counts = s => S.notes.filter(n => s==='all' ? n.section!=='archive' : n.section===s).length;
  app.append(el('div',{class:'chips',role:'group','aria-label':'Sections'},

function renderGraph(app){

      const f = 900/d2, d=Math.sqrt(d2); dx/=d; dy/=d;

    }
    for (const [a,b] of edges){ const dx=P[b].x-P[a].x, dy=P[b].y-P[a].y, d=Math.sqrt(dx*dx+dy*dy)||1, f=(d-70)*0.04; P[a].vx+=dx/d*f; P[a].vy+=dy/d*f; P[b].vx-=dx/d*f; P[b].vy-=dy/d*f; }

  }

  const css = getComputedStyle(document.documentElement), col = v => css.getPropertyValue(v).trim();
  const W = wrap.clientWidth || 340, H = Math.round(Math.min(window.innerHeight*0.62, Math.max(300, W*1.05)));
  const dpr = Math.min(window.devicePixelRatio||1, 3);
  cv.width = W*dpr; cv.height = H*dpr; cv.style.height = H+'px';
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity; for (const p of P){ minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x); minY=Math.min(minY,p.y); maxY=Math.max(maxY,p.y); }
  const pad = 34, sc = Math.min((W-2*pad)/Math.max(1,maxX-minX), (H-2*pad)/Math.max(1,maxY-minY), 2.2);
  const ox = (W - (maxX-minX)*sc)/2 - minX*sc, oy = (H - (maxY-minY)*sc)/2 - minY*sc;
  const S2 = P.map(p => ({x:p.x*sc+ox, y:p.y*sc+oy}));
  const rad = i => 4 + Math.min(9, Math.sqrt(deg[i])*2.6);
  const ctx = cv.getContext('2d'); ctx.setTransform(dpr,0,0,dpr,0,0); ctx.clearRect(0,0,W,H);
  ctx.strokeStyle = col('--rule'); ctx.lineWidth = 1.2;

  const labelSet = new Set(N<=40 ? order : order.filter(i=>deg[i]).slice(0,18));
  ctx.font = '500 12px Figtree, system-ui, sans-serif'; ctx.textAlign = 'center'; ctx.textBaseline = 'top';
  for (const i of labelSet){ const t = notes[i].title.length>24 ? notes[i].title.slice(0,23)+'…' : notes[i].title;
    ctx.lineWidth = 3; ctx.strokeStyle = col('--page'); ctx.strokeText(t, S2[i].x, S2[i].y+rad(i)+3); ctx.fillStyle = col('--ink-2'); ctx.fillText(t, S2[i].x, S2[i].y+rad(i)+3); }
  cv.onclick = e => {
    const r = cv.getBoundingClientRect(), x = e.clientX-r.left, y = e.clientY-r.top; let best=-1, bd=24*24;
    for (let i=0;i<N;i++){ const d=(S2[i].x-x)**2+(S2[i].y-y)**2; if (d<bd){ bd=d; best=i; } }
    if (best>=0) openNote(notes[best].id);

}

const CRC = (()=>{ const t = new Uint32Array(256); for (let n=0;n<256;n++){ let c=n; for (let k=0;k<8;k++) c = c&1 ? 0xEDB88320^(c>>>1) : c>>>1; t[n]=c>>>0; } return t; })();

function safeName(t){ return (t.replace(/[\\/:*?"<>|#^\[\]]/g,'-').replace(/\s+/g,' ').trim().slice(0,100)) || 'Untitled'; }

}
async function exportVault(){
  const used = new Set(), files = [];
  for (const n of S.notes){
    const folder = SBYID[n.section].name; let base = safeName(n.title), name = folder+'/'+base+'.md', k = 2;
    while (used.has(name.toLowerCase())) name = folder+'/'+base+' '+(k++)+'.md';
    used.add(name.toLowerCase()); files.push({name:'Second Brain/'+name, text:toMarkdown(n)});
  }
  if (!files.length){ toast('No notes to export yet.'); return; }
  const blob = makeZip(files), fname = 'Second Brain '+new Date().toISOString().slice(0,10)+'.zip';
  const file = new File([blob], fname, {type:'application/zip'});
  try{ if (matchMedia('(pointer:coarse)').matches && navigator.canShare && navigator.canShare({files:[file]})){ await navigator.share({files:[file], title:'Second Brain vault'}); return; } }catch(e){ if (e && e.name==='AbortError') return; }

}

    const md = parseMarkdown(r.text);
    if (folder && !sec) md.tags = [...new Set([...md.tags, cleanTag(folder)])];
    return {title: file.replace(/\.(md|markdown|txt)$/i,'').slice(0,90), section: sec ? sec.id : (folder ? 'resources' : 'inbox'), ...md};
  });
}
function applyImport(items){
  let added = 0, updated = 0; const t = nowIso();
  for (const it of items){
    const ex = S.notes.find(n => norm(n.title)===norm(it.title));
    if (ex){ Object.assign(ex, {body:it.body, tags:it.tags, section:it.section, updatedAt: it.updated || t}); if (it.pinned) ex.pinned = true; updated++; }
    else { S.notes.push({id:uid(), title:it.title, body:it.body, tags:it.tags, section:it.section, pinned:!!it.pinned, createdAt: it.created || t, updatedAt: it.updated || t}); added++; }
  }
  save(); return {added, updated};
}

/* ---------- tags ---------- */
function renderTags(app){
  app.append(el('header',{class:'top'}, el('h1',{text:'Tags'})));
  const tags = allTags();
  if (!tags.length){ app.append(el('div',{class:'empty',text:'No tags yet. Add #tags when you capture or edit a note.'})); return; }
  app.append(el('div',{class:'tagcloud'}, tags.map(([t,c])=>el('button',{class:'chip',onclick:()=>{ tagFilter=t; section='all'; query=''; tab='notes'; render(); }}, '#'+t, el('span',{class:'n',text:c})))));
  const secs = el('div',{class:'card'}, el('h2',{text:'Sections'}), el('p',{class:'hint',text:'Sort notes by how actionable they are: Projects (active, with an end), Areas (ongoing), Resources (keep for later), Archive (done). New captures land in Inbox.'}));
  for (const s of SECTIONS){ const c = S.notes.filter(n=>n.section===s.id).length;
    secs.append(el('button',{class:'note',onclick:()=>{ section=s.id; tagFilter=null; tab='notes'; render(); }}, el('span',{class:'t',text:s.name+' · '+c}), el('span',{class:'ex',text:s.hint}))); }
  app.append(secs);
}

/* ---------- settings ---------- */
function renderSettings(app){
  app.append(el('header',{class:'top'}, el('h1',{text:'Settings'})));
  const data = JSON.stringify(S);
  const ta = el('textarea',{id:'restore',placeholder:'Paste a backup here to restore it.'});
  const confirm = el('div',{class:'confirm',hidden:true}, el('span',{text:'This replaces every note on this phone.'}),
    el('button',{class:'btn primary',text:'Yes, restore',onclick:()=>{ try{ const d=JSON.parse(ta.value); if(!Array.isArray(d.notes)) throw 0; S={notes:d.notes}; save(); toast('Restored '+S.notes.length+' notes.'); tab='notes'; render(); }catch(e){ toast('That backup couldn’t be read.'); } }}),
    el('button',{class:'btn',text:'Cancel',onclick:()=>{ confirm.hidden=true; }}));
  app.append(el('div',{class:'card'}, el('h2',{text:'Backup'}),
    el('p',{class:'hint',text:'Your notes live only on this phone. Copy a backup now and then, and restore it if you switch phones or clear your browser.'}),
    el('div',{class:'actions'},
      el('button',{class:'btn',text:'Copy backup',onclick:async()=>{ try{ await navigator.clipboard.writeText(data); toast('Backup copied.'); }catch(e){ ta.value=data; ta.select(); toast('Select and copy the text below.'); } }}),
      el('button',{class:'btn',text:'Download backup',onclick:()=>{ const a=el('a',{href:URL.createObjectURL(new Blob([data],{type:'application/json'})),download:'second-brain-'+new Date().toISOString().slice(0,10)+'.json'}); document.body.append(a); a.click(); a.remove(); }}),
      ),
    el('label',{class:'label',for:'restore',text:'Restore'}), ta,
    el('div',{class:'actions'}, el('button',{class:'btn',text:'Restore from backup',onclick:()=>{ if (ta.value.trim()) confirm.hidden=false; else toast('Paste a backup first.'); }})), confirm));

  const picker = el('input',{type:'file',id:'vaultFile',multiple:true,accept:'.zip,.md,.markdown,.txt,application/zip,text/markdown',hidden:true});
  const impConfirm = el('div',{class:'confirm',hidden:true});
  picker.addEventListener('change', async () => {
    if (!picker.files.length) return;
    try{
      const items = await readImport([...picker.files]); picker.value = '';
      if (!items.length){ toast('No Markdown notes found in that file.'); return; }
      const same = items.filter(it => S.notes.some(n => norm(n.title)===norm(it.title))).length;
      impConfirm.replaceChildren(el('span',{text:'Found '+items.length+' note'+(items.length===1?'':'s')+(same ? '. '+same+' already exist here and will be updated.' : '.')}),
        el('button',{class:'btn primary',text:'Import',onclick:()=>{ const r = applyImport(items); impConfirm.hidden = true; toast('Imported: '+r.added+' new, '+r.updated+' updated.'); tab='notes'; section='all'; render(); }}),
        el('button',{class:'btn',text:'Cancel',onclick:()=>{ impConfirm.hidden = true; }}));
      impConfirm.hidden = false;
    }catch(e){ picker.value=''; toast(e && e.message==='inflate' ? 'This phone can’t open that zip. Try importing the .md files directly.' : 'That file couldn’t be read.'); }
  });
  app.append(el('div',{class:'card'}, el('h2',{text:'Vault'}),
    el('p',{class:'hint',text:'Export your notes as a real vault: a zip of Markdown files in Inbox, Projects, Areas, Resources and Archive folders, with tags kept and [[links]] intact. Unzip it and open the folder in Obsidian, or give it to Claude Code. Import works the other way: pick an Obsidian vault zip or .md files.'}),
    el('div',{class:'actions'}, el('button',{class:'btn primary',text:'Export vault',onclick:exportVault}), el('button',{class:'btn',text:'Import vault or notes',onclick:()=>picker.click()})),
    picker, impConfirm));

  const wipe = el('div',{class:'confirm',hidden:true}, el('span',{text:'Erase every note on this phone? This can’t be undone without a backup.'}),
    el('button',{class:'btn danger',text:'Erase all',onclick:()=>{ S={notes:[]}; save(); toast('Erased.'); tab='notes'; render(); }}),
    el('button',{class:'btn',text:'Cancel',onclick:()=>{ wipe.hidden=true; }}));
  app.append(el('div',{class:'card'}, el('h2',{text:'Start over'}), el('p',{class:'hint',text:'Delete all notes on this phone.'}),
    el('div',{class:'actions'}, el('button',{class:'btn danger',text:'Erase all notes',onclick:()=>{ wipe.hidden=false; }})), wipe));

  app.append(el('div',{class:'card'}, el('h2',{text:'Writing tips'}),
    el('p',{class:'hint',text:'[[Note title]] links to another note (tap “[[ ]] Link” while editing to pick one)  ·  # Heading  ·  - list item  ·  > quote  ·  **bold**  ·  *italic*  ·  ==highlight==  ·  `code`. Web links become tappable. On the capture box, the first line is the title and #tags are picked up automatically. Renaming a note updates every link to it.'})));
}

/* ---------- boot ---------- */
for (const id of ['notes','graph','tags','set']) $('#nav-'+id).addEventListener('click',()=>{ tab=id; closeLayer(); render(); window.scrollTo(0,0); });
render();
try{ if ('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{ try{ r.update(); }catch(e){} }).catch(()=>{});
  let reloaded=false; navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(reloaded) return; reloaded=true; const a=document.activeElement; if(!(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName))&&!$('#layer').children.length) location.reload(); });
} }catch(e){}
})();
</script>
</body></html>
