<style>
/* Layout: a pocket notebook. Warm paper, ink-brown text, one copper accent; serif for what you wrote, sans for the controls. */
:root{
  --paper:#faf6f0; --page:#fffaf3; --rule:#e8dbc6; --ink:#2c1a0e; --ink-2:#6b5444; --ink-3:#9a8574;
  --copper:#b5651d; --copper-dk:#8b4c16; --copper-lt:#fdf0e3; --hl:#fde3b4; --tag:#f6e2c4;
  --danger:#b3261e; --scrim:rgba(44,26,14,.4);
  --c1:#c94a3f; --c2:#d9822b; --c3:#c9a227; --c4:#3f8f5a; --c5:#2f8fa3; --c6:#8559b8;
  --serif:"Lora",Georgia,"Times New Roman",serif;
  --sans:"Figtree",system-ui,-apple-system,"Segoe UI",sans-serif;
  --navh:62px; color-scheme:light;
}
@media (prefers-color-scheme: dark){:root{
  --paper:#17120d; --page:#211a13; --rule:#3a2e22; --ink:#f1e6d8; --ink-2:#c3b09c; --ink-3:#8f7c69;
  --copper:#e0934a; --copper-dk:#f0ac68; --copper-lt:#33241a; --hl:#5a4120; --tag:#3a2b1d;
  --danger:#ff8a7e; --scrim:rgba(0,0,0,.6);
  --c1:#ef7468; --c2:#f0a057; --c3:#e3c25a; --c4:#6cc08a; --c5:#5cbfd3; --c6:#b28ae6; color-scheme:dark}}
*{box-sizing:border-box}
html,body{margin:0}
[hidden]{display:none!important}
body{background:var(--paper);color:var(--ink);font:15.5px/1.55 var(--sans);-webkit-tap-highlight-color:transparent;padding-top:env(safe-area-inset-top,0px)}
.wrap{max-width:620px;margin:0 auto;display:flex;flex-direction:column;gap:14px;
  padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));
  padding-block:14px calc(var(--navh) + 28px + env(safe-area-inset-bottom,0px))}
h1,h2,h3{font-family:var(--serif);margin:0;text-wrap:balance;font-weight:700}
button{font:inherit;color:inherit;cursor:pointer}
button:focus-visible,input:focus-visible,textarea:focus-visible,select:focus-visible{outline:2px solid var(--copper);outline-offset:2px}
.label{font-size:11px;text-transform:uppercase;letter-spacing:.12em;color:var(--ink-3);font-weight:600}
.muted{color:var(--ink-3)} .small{font-size:13px}

.top{display:flex;justify-content:space-between;align-items:flex-end;gap:12px}
.top h1{font-size:30px;line-height:1.1}
.top .count{font-size:13px;color:var(--ink-3)}
.top .hright{display:flex;align-items:center;gap:6px}
.top .imp{padding:6px 10px;font-size:14px}
.shead{display:flex;justify-content:space-between;align-items:center;gap:8px}
.shead h2{font-size:22px;margin:0}
.sbody{display:flex;flex-direction:column;gap:10px}
.sbody textarea{width:100%;min-height:150px;font:14px/1.5 ui-monospace,Menlo,monospace;color:var(--ink);background:var(--page);border:1px solid var(--rule);border-radius:8px;padding:10px;resize:vertical}
.sbody .actions{display:flex;flex-wrap:wrap;gap:8px}
.preview{display:flex;flex-direction:column;gap:8px}
.plist{margin:0;padding-left:20px;font-size:14px;max-height:34vh;overflow:auto} .plist li{margin:.2em 0}

.capture{background:var(--page);border:1px solid var(--rule);border-radius:8px;padding:12px;display:flex;flex-direction:column;gap:8px}
.capture textarea{border:0;background:transparent;resize:none;min-height:46px;font:16px/1.5 var(--serif);color:var(--ink);padding:2px;outline:none;width:100%}
.capture .row{display:flex;justify-content:space-between;align-items:center;gap:8px 12px;flex-wrap:wrap}
.capture .row .hint{flex:1 1 180px;min-width:0}
.capture .row .actions{flex-wrap:nowrap;margin-left:auto}

input,select,textarea{font:inherit;font-size:16px;color:var(--ink)}
.search{width:100%;background:var(--page);border:1px solid var(--rule);border-radius:999px;padding:10px 14px}
.chips{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding-bottom:2px}
.chips::-webkit-scrollbar{display:none}
.chip{flex:none;border:1px solid var(--rule);background:var(--page);border-radius:999px;padding:6px 12px;font-size:13.5px;color:var(--ink-2);white-space:nowrap}
.chip[aria-pressed="true"]{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.chip .n{opacity:.6;margin-left:4px;font-variant-numeric:tabular-nums}

.btn{border:1px solid var(--rule);background:var(--page);border-radius:6px;padding:9px 14px;font-weight:600;font-size:14.5px}
.btn.primary{background:var(--copper);border-color:var(--copper);color:#fff}
.btn.ghost{background:transparent}
.btn.danger{color:var(--danger)}
.btn:disabled{opacity:.5}

.list{display:flex;flex-direction:column;gap:8px}
.note{background:var(--page);border:1px solid var(--rule);border-radius:8px;padding:12px 14px;text-align:left;width:100%;display:flex;flex-direction:column;gap:5px}
.note .t{font-family:var(--serif);font-weight:600;font-size:17px;line-height:1.3}
.note .ex{color:var(--ink-2);font-size:14px;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;overflow-wrap:anywhere}
.note .meta{display:flex;gap:8px;flex-wrap:wrap;align-items:center;font-size:12px;color:var(--ink-3)}
.pin{color:var(--copper);font-weight:600}
.tag{background:var(--tag);color:var(--copper-dk);border-radius:4px;padding:1px 7px;font-size:12px}
.sec{border:1px solid var(--rule);border-radius:4px;padding:0 6px;font-size:11.5px}
.empty{border:1px dashed var(--rule);border-radius:8px;padding:18px;color:var(--ink-3);font-size:14px;text-align:center}

/* editor */
.overlay{position:fixed;inset:0;background:var(--scrim);z-index:20;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--paper);width:100%;max-width:620px;height:94vh;border-radius:14px 14px 0 0;display:flex;flex-direction:column;
  padding:12px max(16px,env(safe-area-inset-right,0px)) calc(14px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));gap:10px}
.sheet.short{height:auto;max-height:80vh;overflow:auto}
.bar{display:flex;justify-content:space-between;align-items:center;gap:8px}
.bar .grp{display:flex;gap:4px;align-items:center}
.icon{border:0;background:none;padding:8px 10px;border-radius:6px;font-size:14.5px;font-weight:600;color:var(--ink-2)}
.icon[aria-pressed="true"]{color:var(--copper)}
.titlein{border:0;background:transparent;font:700 24px/1.25 var(--serif);padding:4px 0;outline:none;width:100%}
.bodyin{flex:1;border:0;background:transparent;font:16.5px/1.65 var(--serif);padding:4px 0;outline:none;resize:none;width:100%;min-height:200px}
.render{flex:1;overflow:auto;font:16.5px/1.65 var(--serif);overflow-wrap:anywhere}
.render h2{font-size:21px;margin:.8em 0 .3em} .render h3{font-size:18px;margin:.7em 0 .2em}
.render p{margin:0 0 .7em} .render ul{margin:0 0 .7em;padding-left:22px} .render li{margin:.15em 0}
.render mark{background:var(--hl);color:inherit;padding:0 2px;border-radius:2px}
.render a{color:var(--copper-dk)}
.render code{font-family:ui-monospace,Menlo,monospace;font-size:.88em;background:var(--copper-lt);padding:1px 4px;border-radius:3px}
.render blockquote{border-left:3px solid var(--copper);margin:0 0 .7em;padding:2px 0 2px 12px;color:var(--ink-2)}
.metarow{display:flex;gap:8px;align-items:center;flex-wrap:wrap;border-top:1px solid var(--rule);padding-top:10px}
.metarow select{background:var(--page);border:1px solid var(--rule);border-radius:6px;padding:7px 8px;font-size:14px}
.tagbox{display:flex;gap:6px;flex-wrap:wrap;align-items:center;flex:1;min-width:180px}
.tagbox input{border:0;background:transparent;outline:none;min-width:90px;flex:1;font-size:14px;padding:6px 2px}
.tagx{border:0;background:var(--tag);color:var(--copper-dk);border-radius:4px;padding:2px 7px;font-size:12.5px}
.hint{font-size:12.5px;color:var(--ink-3);margin:0}
.confirm{display:flex;gap:8px;align-items:center;flex-wrap:wrap;background:var(--copper-lt);border-radius:6px;padding:8px 10px;font-size:13.5px}

.card{background:var(--page);border:1px solid var(--rule);border-radius:8px;padding:14px;display:flex;flex-direction:column;gap:10px}
.card h2{font-size:20px}
.card textarea{width:100%;min-height:90px;background:var(--paper);border:1px solid var(--rule);border-radius:6px;padding:10px}
.tagcloud{display:flex;flex-wrap:wrap;gap:8px}
.actions{display:flex;gap:8px;flex-wrap:wrap}

.nav{position:fixed;left:0;right:0;bottom:0;background:var(--page);border-top:1px solid var(--rule);z-index:10;
  padding-bottom:env(safe-area-inset-bottom,0px);padding-left:env(safe-area-inset-left,0px);padding-right:env(safe-area-inset-right,0px)}
.nav .in{max-width:620px;margin:0 auto;display:grid;grid-template-columns:repeat(5,1fr);height:var(--navh)}
.nav button{background:none;border:0;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:3px;color:var(--ink-3);font-size:12px;font-weight:600;letter-spacing:.04em}
.nav button[aria-current="page"]{color:var(--ink)}
.nav svg{width:22px;height:22px;stroke:currentColor;fill:none;stroke-width:1.8}
.nav button[aria-current="page"] svg{stroke:var(--copper)}
/* links between notes */
.wl{border:0;background:none;padding:0;font:inherit;color:var(--copper-dk);text-decoration:underline;text-decoration-color:var(--copper);text-underline-offset:3px;cursor:pointer}
.wl.missing{color:var(--ink-3);text-decoration-style:dashed}
.backlinks{border-top:1px solid var(--rule);padding-top:10px;display:flex;flex-direction:column;gap:6px}
.backlinks .note{padding:9px 12px}
.backlinks .note .t{font-size:15px}
.suggest{display:flex;gap:6px;overflow-x:auto;scrollbar-width:none;padding:2px 0}
.suggest::-webkit-scrollbar{display:none}
.suggest .chip{background:var(--copper-lt);border-color:transparent;color:var(--copper-dk)}
.viewbody{flex:1;overflow:auto;display:flex;flex-direction:column;gap:14px;min-height:0}
.viewbody .render{flex:none;overflow:visible}
/* graph */
.graphwrap{background:var(--page);border:1px solid var(--rule);border-radius:8px;overflow:hidden;position:relative}
canvas.graph{display:block;width:100%;touch-action:none;cursor:grab}
.gzoom{position:absolute;right:8px;top:8px;display:flex;flex-direction:column;gap:6px}
.gzoom .btn{min-width:40px;padding:6px 8px;font-size:16px;background:var(--paper)}
.gbar{display:flex;align-items:center;gap:8px;flex-wrap:wrap;margin-top:8px}
.gbar .gsel{flex:1 1 160px;min-width:0;font-weight:600;overflow-wrap:anywhere}
.legend{display:flex;gap:14px;flex-wrap:wrap;font-size:12.5px;color:var(--ink-3)}
.legend i{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:5px;vertical-align:-1px}
/* canvas board */
.board{position:fixed;inset:0;z-index:15;background:var(--paper);display:flex;flex-direction:column;padding-top:env(safe-area-inset-top,0px)}
.btop{display:flex;align-items:center;gap:6px;padding:6px max(10px,env(safe-area-inset-right,0px)) 6px max(10px,env(safe-area-inset-left,0px));border-bottom:1px solid var(--rule);background:var(--page)}
.btop input{flex:1;min-width:0;border:0;background:transparent;font:700 19px/1.2 var(--serif);color:var(--ink);padding:6px 4px;outline:none}
.bconfirm{margin:8px max(12px,env(safe-area-inset-left,0px)) 0}
.stage{flex:1;position:relative;overflow:hidden;touch-action:none;-webkit-user-select:none;user-select:none;cursor:grab;
  background-color:var(--paper);background-image:radial-gradient(var(--rule) 1.1px, transparent 1.3px);background-size:22px 22px}
.world{position:absolute;left:0;top:0;transform-origin:0 0}
svg.edges{position:absolute;left:0;top:0;width:1px;height:1px;overflow:visible;pointer-events:none}
.edge{fill:none;stroke:var(--ink-3);stroke-width:1.8}
.edge.sel{stroke:var(--copper);stroke-width:2.6}
.arrowhead{fill:var(--ink-3)} .arrowhead.sel{fill:var(--copper)}
.edot{fill:var(--page);stroke:var(--ink-3);stroke-width:1.3;pointer-events:all;cursor:pointer}
.edot.sel{stroke:var(--copper);fill:var(--copper-lt)}
.ccard{position:absolute;background:var(--page);border:1px solid var(--rule);border-radius:8px;box-shadow:0 1px 4px rgba(44,26,14,.10);
  padding:10px 12px;display:flex;flex-direction:column;gap:4px;overflow:hidden;cursor:pointer}
.ccard .cs{font-size:10.5px;letter-spacing:.1em;text-transform:uppercase;color:var(--ink-3);font-weight:600}
.ccard .ct{font:600 15.5px/1.25 var(--serif);color:var(--ink);overflow-wrap:anywhere}
.ccard .cx{font-size:12.5px;line-height:1.45;color:var(--ink-2);overflow:hidden;flex:1;min-height:0;overflow-wrap:anywhere;-webkit-mask-image:linear-gradient(#000 65%,transparent);mask-image:linear-gradient(#000 65%,transparent)}
.ccard.text{background:var(--copper-lt);border-color:transparent}
.ccard.text .cx{font:15px/1.45 var(--serif);color:var(--ink);white-space:pre-wrap;-webkit-mask-image:none;mask-image:none}
.ccard.missing .ct{color:var(--ink-3)}
.ccard.sel{outline:2.5px solid var(--copper);outline-offset:2px}
.ccard.from{outline:2.5px dashed var(--copper);outline-offset:3px}
.ccard[data-c="1"]{border-top:5px solid var(--c1)} .ccard[data-c="2"]{border-top:5px solid var(--c2)} .ccard[data-c="3"]{border-top:5px solid var(--c3)}
.ccard[data-c="4"]{border-top:5px solid var(--c4)} .ccard[data-c="5"]{border-top:5px solid var(--c5)} .ccard[data-c="6"]{border-top:5px solid var(--c6)}
.bempty{position:absolute;inset:0;display:grid;place-items:center;text-align:center;color:var(--ink-3);padding:24px;pointer-events:none;font-size:14px}
.bempty strong{display:block;font:600 18px var(--serif);color:var(--ink-2);margin-bottom:4px}
.btools{border-top:1px solid var(--rule);background:var(--page);display:flex;flex-direction:column;gap:8px;
  padding:8px max(12px,env(safe-area-inset-right,0px)) calc(8px + env(safe-area-inset-bottom,0px)) max(12px,env(safe-area-inset-left,0px))}
.trow2{display:flex;gap:6px;align-items:center;overflow-x:auto;scrollbar-width:none;min-height:38px}
.trow2::-webkit-scrollbar{display:none}
.trow2 .btn{flex:none;padding:8px 12px}
.trow2 .hint{white-space:nowrap}
.btn.on{background:var(--ink);color:var(--paper);border-color:var(--ink)}
.sw{flex:none;width:28px;height:28px;border-radius:50%;border:2px solid var(--rule);background:var(--page);padding:0}
.sw[aria-pressed="true"]{border-color:var(--ink);box-shadow:0 0 0 2px var(--page) inset}
.sw[data-c="1"]{background:var(--c1)} .sw[data-c="2"]{background:var(--c2)} .sw[data-c="3"]{background:var(--c3)}
.sw[data-c="4"]{background:var(--c4)} .sw[data-c="5"]{background:var(--c5)} .sw[data-c="6"]{background:var(--c6)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(var(--navh) + 16px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--paper);padding:9px 14px;border-radius:6px;font-size:13.5px;z-index:40;max-width:calc(100% - 32px)}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .2s ease-out}@keyframes up{from{transform:translateY(20px);opacity:.7}}}
</style>

<div class="wrap" id="app"></div>
<nav class="nav" aria-label="Sections"><div class="in">
  <button id="nav-notes" aria-current="page"><svg viewBox="0 0 24 24"><path d="M6 3h9l4 4v14H6z"/><path d="M9 11h7M9 15h7M9 7h4"/></svg>Notes</button>
  <button id="nav-canvas"><svg viewBox="0 0 24 24"><rect x="2.5" y="4" width="9" height="6.5" rx="1.2"/><rect x="12.5" y="13.5" width="9" height="6.5" rx="1.2"/><path d="M7 10.5v3.3a2 2 0 0 0 2 2h3.5"/></svg>Canvas</button>
  <button id="nav-graph"><svg viewBox="0 0 24 24"><circle cx="6" cy="7" r="2.3"/><circle cx="18" cy="6" r="2.3"/><circle cx="12" cy="17" r="2.3"/><circle cx="19" cy="16" r="1.6"/><path d="M8 8l2.6 7M16 7.5l-2.8 7.6M8.2 6.8l7.5-.6M14.2 17.2l3.3-.8"/></svg>Graph</button>
  <button id="nav-tags"><svg viewBox="0 0 24 24"><path d="M3 12V4h8l10 10-8 8z"/><circle cx="7.5" cy="8.5" r="1.3"/></svg>Tags</button>
  <button id="nav-set"><svg viewBox="0 0 24 24"><circle cx="12" cy="12" r="3"/><path d="M12 2v3M12 19v3M2 12h3M19 12h3M4.9 4.9l2.1 2.1M17 17l2.1 2.1M4.9 19.1L7 17M17 7l2.1-2.1"/></svg>Settings</button>
</div></nav>
<div id="boardLayer"></div>
<div id="layer"></div>
<div id="toast" class="toast" hidden></div>

<script>
(() => {
'use strict';
const STORE = 'brain.v1';
/* Sections follow the PARA method from Building a Second Brain. */
const SECTIONS = [
  {id:'inbox',     name:'Inbox',     hint:'Captured, not sorted yet'},
  {id:'projects',  name:'Projects',  hint:'Active work with an end date'},
  {id:'areas',     name:'Areas',     hint:'Ongoing parts of your life'},
  {id:'resources', name:'Resources', hint:'Things you want to keep for later'},
  {id:'archive',   name:'Archive',   hint:'Done or inactive'},
];
const SBYID = Object.fromEntries(SECTIONS.map(s=>[s.id,s]));

/* ---------- storage on this phone ---------- */
let S = load();
function load(){ try{ const r = localStorage.getItem(STORE); if (r){ const d = JSON.parse(r); if (Array.isArray(d.notes)){ if (!Array.isArray(d.canvases)) d.canvases = []; return d; } } }catch(e){} return {notes:[], canvases:[]}; }
function save(){ try{ localStorage.setItem(STORE, JSON.stringify(S)); return true; }catch(e){ toast('Couldn’t save. Your phone’s storage may be full.'); return false; } }
const uid = () => Date.now().toString(36)+Math.random().toString(36).slice(2,7);
const nowIso = () => new Date().toISOString();

/* ---------- helpers ---------- */
const $ = s => document.querySelector(s);
function el(tag, attrs, ...kids){
  const n = document.createElement(tag);
  for (const [k,v] of Object.entries(attrs||{})){
    if (k==='class') n.className=v; else if (k==='text') n.textContent=v;
    else if (k.startsWith('on')) n.addEventListener(k.slice(2), v);
    else if (v===true) n.setAttribute(k,''); else if (v!==false && v!=null) n.setAttribute(k,v);
  }
  for (const c of kids.flat()) if (c!=null && c!==false) n.append(c.nodeType?c:document.createTextNode(String(c)));
  return n;
}
let toastT; function toast(m){ const t=$('#toast'); t.textContent=m; t.hidden=false; clearTimeout(toastT); toastT=setTimeout(()=>t.hidden=true,2400); }
function when(iso){
  const d = new Date(iso), n = new Date(), diff = (n-d)/1000;
  if (diff < 60) return 'just now';
  if (diff < 3600) return Math.floor(diff/60)+'m ago';
  if (d.toDateString()===n.toDateString()) return d.toLocaleTimeString(undefined,{hour:'numeric',minute:'2-digit'});
  if (diff < 6*86400) return d.toLocaleDateString(undefined,{weekday:'short'});
  return d.toLocaleDateString(undefined,{month:'short',day:'numeric',year: d.getFullYear()===n.getFullYear()?undefined:'numeric'});
}
function plain(body){ return body.replace(LINK_RE,(a,t,al)=>al||t).replace(/^\s*(#+|[-*]|>)\s+/gm,'').replace(/[*`=\[\]]/g,'').replace(/\s+/g,' ').trim(); }
function allTags(){ const m = new Map(); for (const n of S.notes) for (const t of n.tags) m.set(t,(m.get(t)||0)+1); return [...m.entries()].sort((a,b)=>b[1]-a[1]||a[0].localeCompare(b[0])); }
function cleanTag(t){ return t.trim().replace(/^#/,'').replace(/\s+/g,'-').toLowerCase().slice(0,30); }

/* ---------- links between notes: [[Note title]] or [[Note title|shown text]] ---------- */
const LINK_RE = /\[\[([^\]\n|#]+)(?:#[^\]\n|]*)?(?:\|([^\]\n]+))?\]\]/g;
const norm = t => t.trim().toLowerCase();
function findByTitle(t){ const k = norm(t); let best = null; for (const n of S.notes) if (norm(n.title)===k && (!best || n.updatedAt > best.updatedAt)) best = n; return best; }
function linksOf(body){ const out = new Set(); let m; LINK_RE.lastIndex = 0; while ((m = LINK_RE.exec(body))) out.add(m[1].trim()); return [...out]; }
function backlinksOf(note){ const k = norm(note.title); return S.notes.filter(x => x.id!==note.id && linksOf(x.body).some(t => norm(t)===k)); }
function contextLine(body, title){ const k = norm(title); for (const line of body.split('\n')){ let m; LINK_RE.lastIndex=0; while ((m = LINK_RE.exec(line))) if (norm(m[1])===k) return line.replace(LINK_RE,(a,t,al)=>al||t).replace(/^[#>\-*\s]+/,'').trim(); } return ''; }
function openLink(title){
  const t = findByTitle(title);
  if (t){ openNote(t.id); return; }
  const n = {id:uid(), title:title.trim().slice(0,90), body:'', tags:[], section:'inbox', pinned:false, createdAt:nowIso(), updatedAt:nowIso()};
  S.notes.unshift(n); save(); openEditor(n.id);
}
function escRe(s){ return s.replace(/[.*+?^${}()|[\]\\]/g,'\\$&'); }
function renameLinks(oldT, newT, skipId){
  const re = new RegExp('\\[\\[\\s*'+escRe(oldT.trim())+'\\s*(?=[\\]|#])','gi'); let changed = 0;
  for (const n of S.notes){ if (n.id===skipId) continue; const b = n.body.replace(re, '[['+newT.trim()); if (b!==n.body){ n.body=b; n.updatedAt=nowIso(); changed++; } }
  return changed;
}

/* light Markdown: # headings, - lists, > quotes, **bold**, *italic*, ==highlight==, `code`, links. Built with DOM nodes, never innerHTML. */
function inline(text){
  const out = []; const re = /(\[\[[^\]\n]+\]\]|\*\*[^*]+\*\*|==[^=]+==|\*[^*]+\*|`[^`]+`|https?:\/\/[^\s)]+)/g; let last = 0, m;
  while ((m = re.exec(text))){
    if (m.index > last) out.push(document.createTextNode(text.slice(last, m.index)));
    const s = m[0];
    if (s.startsWith('[[')){
      LINK_RE.lastIndex = 0; const lm = LINK_RE.exec(s);
      if (lm){ const target = lm[1].trim(), label = (lm[2]||target).trim(), exists = !!findByTitle(target);
        out.push(el('button',{class:'wl'+(exists?'':' missing'), title: exists ? 'Open '+target : 'Create '+target, onclick:()=>openLink(target)}, label)); }
      else out.push(document.createTextNode(s));
    }
    else if (s.startsWith('**')) out.push(el('strong',{text:s.slice(2,-2)}));
    else if (s.startsWith('==')) out.push(el('mark',{text:s.slice(2,-2)}));
    else if (s.startsWith('`')) out.push(el('code',{text:s.slice(1,-1)}));
    else if (s.startsWith('*')) out.push(el('em',{text:s.slice(1,-1)}));
    else out.push(el('a',{href:s,target:'_blank',rel:'noopener',text:s}));
    last = m.index + s.length;
  }
  if (last < text.length) out.push(document.createTextNode(text.slice(last)));
  return out;
}
function renderBody(body){
  const root = el('div',{class:'render'}); let ul = null, para = [];
  const flush = () => { if (para.length){ root.append(el('p',{}, inline(para.join(' ')))); para = []; } };
  for (const raw of body.split('\n')){
    const line = raw.trimEnd();
    if (/^\s*[-*]\s+/.test(line)){ flush(); if (!ul){ ul = el('ul'); root.append(ul); } ul.append(el('li',{}, inline(line.replace(/^\s*[-*]\s+/,'')))); continue; }
    ul = null;
    if (!line.trim()){ flush(); continue; }
    if (/^##\s+/.test(line)){ flush(); root.append(el('h3',{}, inline(line.replace(/^##\s+/,'')))); continue; }
    if (/^#\s+/.test(line)){ flush(); root.append(el('h2',{}, inline(line.replace(/^#\s+/,'')))); continue; }
    if (/^>\s?/.test(line)){ flush(); root.append(el('blockquote',{}, inline(line.replace(/^>\s?/,'')))); continue; }
    para.push(line);
  }
  flush();
  if (!body.trim()) root.append(el('p',{class:'muted',text:'Nothing written yet. Tap Edit.'}));
  return root;
}

/* ---------- state ---------- */
let tab = 'notes', query = '', section = 'all', tagFilter = null;

function filtered(){
  const q = query.trim().toLowerCase();
  return S.notes.filter(n =>
    (section==='all' ? n.section!=='archive' : n.section===section) &&
    (!tagFilter || n.tags.includes(tagFilter)) &&
    (!q || n.title.toLowerCase().includes(q) || n.body.toLowerCase().includes(q) || n.tags.some(t=>t.includes(q.replace(/^#/,''))))
  ).sort((a,b)=> (b.pinned?1:0)-(a.pinned?1:0) || b.updatedAt.localeCompare(a.updatedAt));
}

function render(){
  for (const id of ['notes','canvas','graph','tags','set']) $('#nav-'+id).setAttribute('aria-current', tab===id?'page':'false');
  const app = $('#app'); app.replaceChildren();
  if (tab==='notes') renderNotes(app);
  else if (tab==='canvas') renderCanvasList(app);
  else if (tab==='graph') renderGraph(app);
  else if (tab==='tags') renderTags(app);
  else renderSettings(app);
}

function renderNotes(app){
  const live = S.notes.filter(n=>n.section!=='archive').length;
  app.append(el('header',{class:'top'}, el('h1',{text:'Second Brain'}), el('div',{class:'hright'}, el('span',{class:'count',text: live+' note'+(live===1?'':'s')}), el('button',{class:'btn ghost imp',text:'Import',onclick:openImportSheet}))));

  // quick capture
  const cap = el('textarea',{id:'capture',rows:'2',placeholder:'Capture a thought…','aria-label':'Capture a thought'});
  const saveCap = () => {
    const txt = cap.value.trim(); if (!txt) return;
    const lines = txt.split('\n'); const first = lines[0].slice(0,90);
    const tags = [...new Set((txt.match(/#[\w-]+/g)||[]).map(cleanTag))];
    const n = {id:uid(), title:first.replace(/#[\w-]+/g,'').trim() || 'Untitled', body: lines.length>1 ? lines.slice(1).join('\n').trim() : (lines[0].length>90 ? txt : ''), tags, section:'inbox', pinned:false, createdAt:nowIso(), updatedAt:nowIso()};
    S.notes.unshift(n); if (save()){ cap.value=''; toast('Saved to Inbox.'); render(); }
  };
  cap.addEventListener('keydown', e => { if (e.key==='Enter' && (e.metaKey||e.ctrlKey)) saveCap(); });
  app.append(el('div',{class:'capture'}, cap,
    el('div',{class:'row'}, el('span',{class:'hint',text:'First line becomes the title. Add #tags anywhere.'}),
      el('div',{class:'actions'}, el('button',{class:'btn ghost',text:'Full note',onclick:()=>openEditor(null, cap.value)}), el('button',{class:'btn primary',text:'Save',onclick:saveCap})))));

  // search + sections
  const search = el('input',{class:'search',id:'search',type:'search',placeholder:'Search notes and #tags',value:query,'aria-label':'Search notes'});
  search.addEventListener('input', () => { query = search.value; drawList(); });
  app.append(search);
  const counts = s => S.notes.filter(n => s==='all' ? n.section!=='archive' : n.section===s).length;
  app.append(el('div',{class:'chips',role:'group','aria-label':'Sections'},
    [{id:'all',name:'All'}].concat(SECTIONS).map(s => el('button',{class:'chip','aria-pressed':String(section===s.id), title:s.hint||'', onclick:()=>{ section=s.id; render(); }}, s.name, el('span',{class:'n',text:counts(s.id)})))));
  if (tagFilter) app.append(el('div',{class:'chips'}, el('button',{class:'chip','aria-pressed':'true',onclick:()=>{ tagFilter=null; render(); }}, '#'+tagFilter+'  ✕')));

}
function drawList(){
  const list = $('#list'); if (!list) return; list.replaceChildren();
  const items = filtered();
  if (!S.notes.length){ list.append(el('div',{class:'empty'}, 'Your second brain is empty. Capture anything above: an idea, a quote, something you learned, a person’s name and how you met. Link notes together by writing [[Note title]]. Sort it later.')); return; }
  if (!items.length){ list.append(el('div',{class:'empty',text: query ? 'No notes match “'+query+'”.' : 'Nothing in '+(SBYID[section]?SBYID[section].name:'this view')+' yet.'})); return; }
  for (const n of items){
    const ex = plain(n.body);
    list.append(el('button',{class:'note',onclick:()=>openNote(n.id)},
      el('span',{class:'t',text:n.title}),
      ex ? el('span',{class:'ex',text:ex}) : null,

/* ---------- note view / editor ---------- */
function closeLayer(){ $('#layer').replaceChildren(); if (board) drawBoard(); }
function sheet(cls){ const sh = el('div',{class:'sheet '+(cls||''),role:'dialog','aria-modal':'true'}); const ov = el('div',{class:'overlay',onclick:e=>{ if(e.target===ov) closeLayer(); }}, sh); $('#layer').replaceChildren(ov); return sh; }
document.addEventListener('keydown', e => { if (e.key!=='Escape') return; if ($('#layer').children.length) closeLayer(); else if (board) closeBoard(); });

function openNote(id){
  const n = S.notes.find(x=>x.id===id); if (!n) return;
  const sh = sheet();
  sh.append(el('div',{class:'bar'},
    el('button',{class:'icon',text:'Close',onclick:()=>{ closeLayer(); render(); }}),
    el('div',{class:'grp'},
      el('button',{class:'icon',text:'Map',title:'Build a canvas from this note’s links',onclick:()=>mapNote(id)}),
      el('button',{class:'icon','aria-pressed':String(!!n.pinned),text:n.pinned?'Pinned':'Pin',onclick:()=>{ n.pinned=!n.pinned; save(); openNote(id); }}),
      el('button',{class:'icon',text:'Edit',onclick:()=>openEditor(id)}))));
  sh.append(el('h2',{style:'font-size:24px',text:n.title}));
  sh.append(el('div',{class:'meta small muted',style:'display:flex;gap:8px;flex-wrap:wrap;align-items:center'},
    el('span',{class:'sec',text:SBYID[n.section].name}), n.tags.map(t=>el('button',{class:'tagx',text:'#'+t,onclick:()=>{ tagFilter=t; section='all'; tab='notes'; closeLayer(); render(); }})), el('span',{text:'Edited '+when(n.updatedAt)})));
  const view = el('div',{class:'viewbody'}, renderBody(n.body));
  const back = backlinksOf(n);
  if (back.length){
    const bl = el('div',{class:'backlinks'}, el('span',{class:'label',text:'Linked from · '+back.length}));
    for (const b of back.sort((a,c)=>c.updatedAt.localeCompare(a.updatedAt))){
      const ctx = contextLine(b.body, n.title);
      bl.append(el('button',{class:'note',onclick:()=>openNote(b.id)}, el('span',{class:'t',text:b.title}), ctx ? el('span',{class:'ex',text:ctx}) : null));
    }
    view.append(bl);
  } else view.append(el('p',{class:'hint',text:'No other notes link here yet. Write [['+n.title+']] in another note to connect them.'}));
  sh.append(view);
}

function openEditor(id, seed){
  const existing = id ? S.notes.find(x=>x.id===id) : null;
  const d = existing ? {...existing, tags:[...existing.tags]} : {id:uid(), title:'', body:'', tags:[], section:'inbox', pinned:false, createdAt:nowIso(), updatedAt:nowIso()};
  if (!existing && seed){ const lines = seed.split('\n'); d.title = lines[0].slice(0,90); d.body = lines.slice(1).join('\n'); }
  let saved = !!existing; const origTitle = existing ? existing.title : null;
  const sh = sheet();
  const title = el('input',{class:'titlein',id:'noteTitle',type:'text',placeholder:'Title',value:d.title,'aria-label':'Title'});
  const body = el('textarea',{class:'bodyin',id:'noteBody',placeholder:'Write it down. Link other notes with [[Note title]]. Use # for headings, - for lists, **bold**, and ==highlight== for the part that matters most.','aria-label':'Note'});
  body.value = d.body;
  const sec = el('select',{id:'noteSection','aria-label':'Section'}, SECTIONS.map(s=>el('option',{value:s.id,text:s.name, selected: s.id===d.section})));
  const tagIn = el('input',{id:'tagInput',type:'text',placeholder:'+ tag',autocapitalize:'off','aria-label':'Add a tag'});
  const tagBox = el('div',{class:'tagbox'});
  const drawTags = () => { tagBox.replaceChildren(...d.tags.map(t=>el('button',{class:'tagx','aria-label':'Remove tag '+t,text:'#'+t+' ✕',onclick:()=>{ d.tags=d.tags.filter(x=>x!==t); drawTags(); persist(); }})), tagIn); };
  tagIn.addEventListener('keydown', e => { if (e.key==='Enter' || e.key===',' || e.key===' '){ e.preventDefault(); addTag(); } });
  tagIn.addEventListener('blur', addTag);
  function addTag(){ const t = cleanTag(tagIn.value); tagIn.value=''; if (t && !d.tags.includes(t)){ d.tags.push(t); drawTags(); persist(); } }
  drawTags();

  let tmr; const status = el('span',{class:'hint',text: existing ? 'Saved' : ''});
  function persist(){
    d.title = title.value.trim(); d.body = body.value; d.section = sec.value;
    if (!d.title && !d.body.trim()) return;
    if (!d.title) d.title = (d.body.trim().split('\n')[0]||'Untitled').replace(/^#+\s*/,'').slice(0,90);
    d.updatedAt = nowIso();
    const i = S.notes.findIndex(x=>x.id===d.id);
    if (i>=0) S.notes[i] = {...d, tags:[...d.tags]}; else { S.notes.unshift({...d, tags:[...d.tags]}); saved = true; }
    if (save()) status.textContent = 'Saved';
  }
  const later = () => { status.textContent = 'Saving…'; clearTimeout(tmr); tmr = setTimeout(persist, 500); };
  title.addEventListener('input', later); body.addEventListener('input', later); sec.addEventListener('change', persist);

  // [[ link suggestions
  const suggest = el('div',{class:'suggest',hidden:true,'aria-label':'Link to a note'});
  function linkContext(){ const pos = body.selectionStart; const m = /\[\[([^\]\n]*)$/.exec(body.value.slice(0,pos)); return m ? {start:m.index, pos, q:m[1]} : null; }
  function insertLink(t){
    const c = linkContext(); if (!c) return;
    const after = body.value.slice(c.pos), close = after.startsWith(']]') ? 2 : 0;
    body.value = body.value.slice(0,c.start) + '[['+t+']]' + after.slice(close);
    const caret = c.start + t.length + 4; body.focus(); body.setSelectionRange(caret, caret);
    suggest.hidden = true; later();
  }
  function drawSuggest(){
    const c = linkContext(); if (!c){ suggest.hidden = true; return; }
    const q = norm(c.q);
    const hits = S.notes.filter(x => x.id!==d.id && (!q || norm(x.title).includes(q))).sort((a,b)=>(norm(b.title).startsWith(q)?1:0)-(norm(a.title).startsWith(q)?1:0) || b.updatedAt.localeCompare(a.updatedAt)).slice(0,8);
    const chips = hits.map(x => el('button',{class:'chip',onpointerdown:e=>e.preventDefault(),onclick:()=>insertLink(x.title)}, x.title));
    if (c.q.trim() && !findByTitle(c.q)) chips.push(el('button',{class:'chip',onpointerdown:e=>e.preventDefault(),onclick:()=>insertLink(c.q.trim())}, 'New: '+c.q.trim()));
    if (!chips.length) chips.push(el('span',{class:'hint',text:'Type a note title, then ]]'}));
    suggest.replaceChildren(...chips); suggest.hidden = false;
  }
  for (const ev of ['input','click','keyup']) body.addEventListener(ev, drawSuggest);
  const linkBtn = el('button',{class:'icon',text:'[[ ]] Link',onpointerdown:e=>e.preventDefault(),onclick:()=>{
    const pos = body.selectionStart ?? body.value.length; body.value = body.value.slice(0,pos)+'[['+body.value.slice(pos); body.focus(); body.setSelectionRange(pos+2,pos+2); drawSuggest(); later(); }});

  const confirm = el('div',{class:'confirm',hidden:true}, el('span',{text:'Delete this note for good?'}),
    el('button',{class:'btn danger',text:'Delete',onclick:()=>{ S.notes = S.notes.filter(x=>x.id!==d.id); save(); closeLayer(); toast('Deleted.'); render(); }}),
    el('button',{class:'btn',text:'Keep',onclick:()=>{ confirm.hidden=true; }}));
  const done = () => {
    clearTimeout(tmr); persist();
    if (origTitle && d.title && norm(origTitle)!==norm(d.title)){ const k = renameLinks(origTitle, d.title, d.id); if (k){ save(); toast('Updated links in '+k+' note'+(k===1?'':'s')+'.'); } }
    closeLayer(); if (saved) openNote(d.id); else render();
  };

  sh.append(el('div',{class:'bar'},
    el('button',{class:'icon',text:'Done',onclick:done}),
    el('div',{class:'grp'}, status, linkBtn, existing ? el('button',{class:'icon',style:'color:var(--danger)',text:'Delete',onclick:()=>{ confirm.hidden=false; }}) : null)));
  sh.append(confirm, title, body, suggest, el('div',{class:'metarow'}, sec, tagBox));
  setTimeout(()=> (existing ? body : (d.title ? body : title)).focus(), 80);
}

/* ---------- graph ---------- */
function renderGraph(app){
  const notes = S.notes.filter(n => n.section!=='archive');
  const idx = new Map(notes.map((n,i)=>[norm(n.title), i]));
  const edges = [], seen = new Set();
  notes.forEach((n,i) => { for (const t of linksOf(n.body)){ const j = idx.get(norm(t)); if (j==null || j===i) continue; const k = i<j ? i+'-'+j : j+'-'+i; if (!seen.has(k)){ seen.add(k); edges.push([i,j]); } } });
  app.append(el('header',{class:'top'}, el('h1',{text:'Graph'}), el('span',{class:'count',text: notes.length+' notes · '+edges.length+' link'+(edges.length===1?'':'s')})));
  if (!notes.length){ app.append(el('div',{class:'empty',text:'No notes yet. Once you have a few, link them with [[Note title]] and they’ll connect here.'})); return; }
  const wrap = el('div',{class:'graphwrap'}), cv = el('canvas',{class:'graph',role:'img','aria-label':'Map of your notes and the links between them'});
  wrap.append(cv); app.append(wrap);
  app.append(el('div',{class:'legend'}, el('span',{}, el('i',{style:'background:var(--copper)'}), 'Linked note'), el('span',{}, el('i',{style:'background:var(--ink-3)'}), 'Not linked yet'), el('span',{text:'Drag to move, pinch or +/− to zoom. Tap a dot to highlight its links, tap again to open.'})));
  if (!edges.length) app.append(el('p',{class:'hint',text:'Nothing is linked yet. Open a note, tap “[[ ]] Link”, and pick another note to connect them.'}));

  const N = notes.length, deg = new Array(N).fill(0), adj = notes.map(()=>[]);
  for (const [a,b] of edges){ deg[a]++; deg[b]++; adj[a].push(b); adj[b].push(a); }

  // 1. split into clusters (connected groups); lay out each on its own so unrelated notes never tangle
  const comp = new Array(N).fill(-1), groups = [];
  for (let i=0;i<N;i++){ if (comp[i]>=0 || !deg[i]) continue; const g=[i]; comp[i]=groups.length;
    for (let q=0;q<g.length;q++) for (const j of adj[g[q]]) if (comp[j]<0){ comp[j]=groups.length; g.push(j); }
    groups.push(g); }
  groups.sort((x,y)=>y.length-x.length);
  const P = new Array(N);
  const boxes = groups.map(g => {
    const n = g.length, L = new Map(g.map((v,k)=>[v,k]));
    const Q = g.map((v,k)=>{ const a=k*2.39996, r=40*Math.sqrt(k+1); return {x:Math.cos(a)*r, y:Math.sin(a)*r, vx:0, vy:0}; });
    const E = []; for (const v of g) for (const w of adj[v]) if (v<w) E.push([L.get(v), L.get(w)]);
    const iters = n > 300 ? 180 : 400;
    for (let it=0; it<iters; it++){
      const cool = 1 - it/iters;
      for (let i=0;i<n;i++) for (let j=i+1;j<n;j++){
        let dx=Q[i].x-Q[j].x, dy=Q[i].y-Q[j].y, d2=dx*dx+dy*dy+0.01; if (d2>640000) continue;
        const f = 7000/d2, d=Math.sqrt(d2); dx/=d; dy/=d;
        Q[i].vx+=dx*f; Q[i].vy+=dy*f; Q[j].vx-=dx*f; Q[j].vy-=dy*f;
      }
      for (const [a,b] of E){ const dx=Q[b].x-Q[a].x, dy=Q[b].y-Q[a].y, d=Math.sqrt(dx*dx+dy*dy)||1, f=(d-150)*0.03; Q[a].vx+=dx/d*f; Q[a].vy+=dy/d*f; Q[b].vx-=dx/d*f; Q[b].vy-=dy/d*f; }
      for (const p of Q){ p.vx-=p.x*0.004; p.vy-=p.y*0.004; p.vx*=0.82; p.vy*=0.82; const sp=Math.hypot(p.vx,p.vy)||1, m=Math.min(14*cool+1, sp); p.x+=p.vx/sp*m; p.y+=p.vy/sp*m; }
    }
    let x0=Infinity,x1=-Infinity,y0=Infinity,y1=-Infinity; for (const p of Q){ x0=Math.min(x0,p.x); x1=Math.max(x1,p.x); y0=Math.min(y0,p.y); y1=Math.max(y1,p.y); }
    return {g, Q, w:x1-x0+140, h:y1-y0+90, x0, y0};
  });
  // 2. shelf-pack the clusters left to right, wrapping rows, with wide gutters between them
  const GAP = 120, rowMax = Math.max(900, ...boxes.map(b=>b.w));
  let cx = 0, cy = 0, rowH = 0, maxW = 0;
  for (const bx of boxes){
    if (cx > 0 && cx + bx.w > rowMax){ cx = 0; cy += rowH + GAP; rowH = 0; }
    bx.g.forEach((v,k)=>{ P[v] = {x: cx + 70 + (bx.Q[k].x - bx.x0), y: cy + 45 + (bx.Q[k].y - bx.y0)}; });
    cx += bx.w + GAP; rowH = Math.max(rowH, bx.h); maxW = Math.max(maxW, cx);
  }
  // 3. notes with no links sit in a tidy grid underneath
  const lone = [...Array(N).keys()].filter(i=>!deg[i]);
  const loneTop = boxes.length ? cy + rowH + GAP : 0, cols = Math.max(4, Math.floor(Math.max(maxW, 600)/150));
  lone.forEach((v,k)=>{ P[v] = {x: 75 + (k%cols)*150, y: loneTop + 30 + Math.floor(k/cols)*80}; });

  const css = getComputedStyle(document.documentElement), col = v => css.getPropertyValue(v).trim();
  const W = wrap.clientWidth || 340, H = Math.round(Math.max(360, window.innerHeight*0.68));
  const dpr = Math.min(window.devicePixelRatio||1, 3);
  cv.width = W*dpr; cv.height = H*dpr; cv.style.height = H+'px';
  let minX=Infinity,maxX=-Infinity,minY=Infinity,maxY=-Infinity; for (const p of P){ minX=Math.min(minX,p.x); maxX=Math.max(maxX,p.x); minY=Math.min(minY,p.y); maxY=Math.max(maxY,p.y); }
  const rad = i => 5 + Math.min(10, Math.sqrt(deg[i])*2.8);
  const fitK = Math.min((W-60)/Math.max(1,maxX-minX), (H-60)/Math.max(1,maxY-minY));
  // start readable (not squeezed): fit if it fits, otherwise zoom in on the biggest cluster and let you pan
  let k = Math.min(1.4, Math.max(fitK, 0.95)), tx, ty;
  const centerOn = (x,y) => { tx = W/2 - x*k; ty = H/2 - y*k; };
  if (fitK >= 0.95) centerOn((minX+maxX)/2, (minY+maxY)/2);
  else if (boxes.length){ const b0 = boxes[0].g.map(v=>P[v]); centerOn(b0.reduce((s,p)=>s+p.x,0)/b0.length, b0.reduce((s,p)=>s+p.y,0)/b0.length); }

  const ta = el('textarea',{id:'restore',placeholder:'Paste a backup here to restore it.'});
  const confirm = el('div',{class:'confirm',hidden:true}, el('span',{text:'This replaces every note on this phone.'}),
    el('button',{class:'btn primary',text:'Yes, restore',onclick:()=>{ try{ const d=JSON.parse(ta.value); if(!Array.isArray(d.notes)) throw 0; S={notes:d.notes, canvases:Array.isArray(d.canvases)?d.canvases:[]}; save(); toast('Restored '+S.notes.length+' notes.'); tab='notes'; render(); }catch(e){ toast('That backup couldn’t be read.'); } }}),
    el('button',{class:'btn',text:'Cancel',onclick:()=>{ confirm.hidden=true; }}));
  app.append(el('div',{class:'card'}, el('h2',{text:'Backup'}),
    el('p',{class:'hint',text:'Your notes live only on this phone. Copy a backup now and then, and restore it if you switch phones or clear your browser.'}),
    el('div',{class:'actions'},
      el('button',{class:'btn',text:'Copy backup',onclick:async()=>{ try{ await navigator.clipboard.writeText(data); toast('Backup copied.'); }catch(e){ ta.value=data; ta.select(); toast('Select and copy the text below.'); } }}),
      el('button',{class:'btn',text:'Download backup',onclick:()=>{ const a=el('a',{href:URL.createObjectURL(new Blob([data],{type:'application/json'})),download:'second-brain-'+new Date().toISOString().slice(0,10)+'.json'}); document.body.append(a); a.click(); a.remove(); }}),
      ),
    el('label',{class:'label',for:'restore',text:'Restore'}), ta,
    el('div',{class:'actions'}, el('button',{class:'btn',text:'Restore from backup',onclick:()=>{ if (ta.value.trim()) confirm.hidden=false; else toast('Paste a backup first.'); }})), confirm));

  const picker = el('input',{type:'file',id:'vaultFile',multiple:true,accept:'.zip,.md,.markdown,.txt,.canvas,application/zip,text/markdown',hidden:true});
  const impConfirm = el('div',{class:'confirm',hidden:true});
  picker.addEventListener('change', async () => {
    if (!picker.files.length) return;
    try{
      const res = await readImport([...picker.files]); picker.value = '';
      if (!res.notes.length && !res.canvases.length){ toast('No notes or canvases found in that file.'); return; }
      const same = res.notes.filter(it => S.notes.some(n => norm(n.title)===norm(it.title))).length, parts = [];
      if (res.notes.length) parts.push(res.notes.length+' note'+(res.notes.length===1?'':'s'));
      if (res.canvases.length) parts.push(res.canvases.length+' canvas'+(res.canvases.length===1?'':'es'));
      impConfirm.replaceChildren(el('span',{text:'Found '+parts.join(' and ')+(same ? '. '+same+' note'+(same===1?'':'s')+' already here will be updated.' : '.')}),
        el('button',{class:'btn primary',text:'Import',onclick:()=>{ const r = applyImport(res); impConfirm.hidden = true; toast('Imported: '+r.added+' new, '+r.updated+' updated'+(r.boards ? ', '+r.boards+' canvas'+(r.boards===1?'':'es') : '')+'.'); tab='notes'; section='all'; render(); }}),
        el('button',{class:'btn',text:'Cancel',onclick:()=>{ impConfirm.hidden = true; }}));
      impConfirm.hidden = false;
    }catch(e){ picker.value=''; toast(e && e.message==='inflate' ? 'This phone can’t open that zip. Try importing the .md files directly.' : 'That file couldn’t be read.'); }
  });
  app.append(el('div',{class:'card'}, el('h2',{text:'Vault'}),
    el('p',{class:'hint',text:'Export everything as a real vault: Markdown files in Inbox, Projects, Areas, Resources and Archive folders, with tags and [[links]] intact, plus your canvases as Obsidian .canvas files. Unzip it and open the folder in Obsidian, or give it to Claude Code. Import works the other way: an Obsidian vault zip, .md files, or .canvas files.'}),
    el('div',{class:'actions'}, el('button',{class:'btn primary',text:'Export vault',onclick:exportVault}), el('button',{class:'btn',text:'Import vault or notes',onclick:()=>picker.click()})),
    picker, impConfirm));

  const wipe = el('div',{class:'confirm',hidden:true}, el('span',{text:'Erase every note on this phone? This can’t be undone without a backup.'}),
    el('button',{class:'btn danger',text:'Erase all',onclick:()=>{ S={notes:[], canvases:[]}; save(); toast('Erased.'); tab='notes'; render(); }}),
    el('button',{class:'btn',text:'Cancel',onclick:()=>{ wipe.hidden=true; }}));
  app.append(el('div',{class:'card'}, el('h2',{text:'Start over'}), el('p',{class:'hint',text:'Delete all notes and canvases on this phone.'}),
    el('div',{class:'actions'}, el('button',{class:'btn danger',text:'Erase all notes',onclick:()=>{ wipe.hidden=false; }})), wipe));

  app.append(el('div',{class:'card'}, el('h2',{text:'Writing tips'}),
    el('p',{class:'hint',text:'[[Note title]] links to another note (tap “[[ ]] Link” while editing to pick one)  ·  # Heading  ·  - list item  ·  > quote  ·  **bold**  ·  *italic*  ·  ==highlight==  ·  `code`. Web links become tappable. On the capture box, the first line is the title and #tags are picked up automatically. Renaming a note updates every link to it.'})));
}

/* ---------- boot ---------- */
for (const id of ['notes','canvas','graph','tags','set']) $('#nav-'+id).addEventListener('click',()=>{ tab=id; closeLayer(); render(); window.scrollTo(0,0); });
render();
try{ if ('serviceWorker' in navigator){
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{ try{ r.update(); }catch(e){} }).catch(()=>{});
  let reloaded=false; navigator.serviceWorker.addEventListener('controllerchange',()=>{ if(reloaded) return; reloaded=true; const a=document.activeElement; if(!(a&&/^(INPUT|TEXTAREA)$/.test(a.tagName))&&!$('#layer').children.length&&!board) location.reload(); });
} }catch(e){}
})();
</script>
</body></html>
